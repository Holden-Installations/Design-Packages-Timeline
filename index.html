      function renderClosedSection(assessed) {
        var failed = [],
          pastPlan = [],
          asPlanned = [];

        assessed.forEach(function (a) {
          var p = a.pkg;

          if (!a.isClosed) return;

          var tsLive = getEffectiveLiveItems(
            deliverableItemsAsOf(p.tsItems, TODAY),
          );
          var dwLive = getEffectiveLiveItems(
            deliverableItemsAsOf(p.dwItems, TODAY),
          );
          var calcLive = getEffectiveLiveItems(
            deliverableItemsAsOf(p.calcItems, TODAY),
          );
          var smpLive = getEffectiveLiveItems(
            deliverableItemsAsOf(p.smpItems, TODAY),
          );

          var coIssued = p.coItems.length
            ? p.coItems
                .filter(function (it) {
                  return it.issued && it.issued <= TODAY;
                })
                .map(function (it) {
                  return it.issued;
                })
            : [];
          var latestCO = coIssued.length
            ? coIssued.reduce(function (m, d) {
                return d > m ? d : m;
              }, coIssued[0])
            : null;

          var allCompDates = []
            .concat(tsLive, dwLive, calcLive, smpLive)
            .map(function (it) {
              return itemCompletionDate(it);
            })
            .filter(function (d) {
              return d;
            });

          var latestDesignCompletion = allCompDates.length
            ? allCompDates.reduce(function (m, d) {
                return d > m ? d : m;
              }, allCompDates[0])
            : null;

          var completionDates = [latestCO, latestDesignCompletion].filter(
            function (d) {
              return d;
            },
          );

          var effectiveFinish = completionDates.length
            ? completionDates.reduce(function (m, d) {
                return d > m ? d : m;
              }, completionDates[0])
            : null;

          var daysLateCO =
            latestCO && p.critCO ? wdays(p.critCO, latestCO) : null;

          var allIssued = []
            .concat(tsLive, dwLive, calcLive, smpLive)
            .map(function (it) {
              return itemStartDate(it);
            })
            .filter(function (d) {
              return d;
            });
          var earliestIssue = allIssued.length
            ? allIssued.reduce(function (m, d) {
                return d < m ? d : m;
              }, allIssued[0])
            : null;
          var planStart = packagePlannedStart(p);
          var plannedFinish = packagePlannedFinish(p, planStart);
          var daysLateIssue =
            effectiveFinish && plannedFinish
              ? wdays(plannedFinish, effectiveFinish)
              : null;

          var outcome = {
            pkg: p,
            fI: a.fI,
            fCO: a.fCO,
            daysLateCO: daysLateCO,
            daysLateIssue: daysLateIssue,
            latestCO: latestCO,
            effectiveFinish: effectiveFinish,
            earliestIssue: earliestIssue,
            assessment: a,
          };
          if (daysLateCO !== null && daysLateCO > 0) failed.push(outcome);
          else if (daysLateIssue !== null && daysLateIssue > 0)
            pastPlan.push(outcome);
          else asPlanned.push(outcome);
        });

        var h = '<div class="area-label">Closed Packages</div>';

        h += renderClosedPackageGroup(
          "Failed Mitigation",
          "red",
          failed,
          "FAILED",
          true,
        );
        h += renderClosedPackageGroup(
          "Past Planned",
          "yellow",
          pastPlan,
          "PAST_CLOSED",
        );
        h += renderClosedPackageGroup(
          "Completed As Per Plan",
          "green",
          asPlanned,
          "AS_PLANNED",
        );
        return h;
      }

      function collectActionTasks(assessed) {
        var toIssue = [],
          toAddress = [],
          toChase = [];

        function shortRef(ref) {
          return String(ref || "");
        }

        function cleanActionItem(value, pkgName) {
          var s = String(value || "").trim();
          var p = String(pkgName || "").trim();

          if (p) {
            var escaped = p.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            s = s.replace(new RegExp(escaped, "gi"), "");
          }

          return (
            s
              .replace(/\s+[-–—|/]\s+/g, " — ")
              .replace(/^(?:\s*[-–—|/]\s*)+|(?:\s*[-–—|/]\s*)+$/g, "")
              .replace(/\s{2,}/g, " ")
              .trim() || String(value || "").trim()
          );
        }

        function dueText(prefix, d) {
          if (!d) return prefix + ": —";
          var delta = wdays(TODAY, d);
          if (delta === 0) return prefix + ": " + fmt(d) + " · due today";
          if (delta < 0)
            return (
              prefix + ": " + fmt(d) + " · " + Math.abs(delta) + "d overdue"
            );
          return prefix + ": " + fmt(d) + " · due in " + delta + "d";
        }

        function prevStatus(revs, live) {
          var idx = revs.indexOf(live);
          return idx > 0 ? revs[idx - 1].statusRec || "" : "";
        }

        function collectIssueTasks(items, typeLabel, fI, colPlanned, pkgName) {
          var byRef = byRefSorted(deliverableItemsAsOf(items, TODAY));

          Object.values(byRef).forEach(function (revs) {
            var live = resolveEffectiveLiveItem(revs);
            if (!live || isCompleteItem(live) || effectiveIssuedDate(live))
              return;

            var ps = prevStatus(revs, live);
            var planDate = live.planned || colPlanned;
            var item = cleanActionItem(shortRef(live.ref), pkgName);
            var revision = live.rc ? live.rc : "—";

            var isStatusCReissue = ps === "C";

            toIssue.push({
              pkg: pkgName,
              type: typeLabel,
              item: item,
              revision: revision,
              status: isStatusCReissue ? "C" : "Not issued",
              action: isStatusCReissue
                ? "Address comments + resubmit"
                : "Initial issue",
              actionCat: isStatusCReissue
                ? "STATUS_C_REISSUE"
                : "INITIAL_ISSUE",
              when: dueText("Planned", planDate),
              float: fI,
              planDate: planDate,
            });
          });
        }
        function collectAddressTasks(items, typeLabel, fI, pkgName) {
          var byRef = byRefSorted(deliverableItemsAsOf(items, TODAY));
          Object.values(byRef).forEach(function (revs) {
            var live = resolveEffectiveLiveItem(revs);
            if (!live || isCompleteItem(live)) return;
            if (
              !(
                effectiveIssuedDate(live) &&
                live.statusRec === "C" &&
                live.cmtsRec
              )
            )
              return;
            var planDate = live.nextRevPlanned || TODAY;
            toAddress.push({
              pkg: pkgName,
              type: typeLabel,
              item: cleanActionItem(shortRef(live.ref), pkgName),
              revision: live.rc ? live.rc : "—",
              status: "C",
              action: "Address comments + resubmit",
              actionCat: "STATUS_C_REISSUE",
              when: dueText("Resubmit planned", planDate),
              float: fI,
              planDate: planDate,
            });
          });
        }

        function collectChaseTasks(items, typeLabel, fI, pkgName) {
          var byRef = byRefSorted(deliverableItemsAsOf(items, TODAY));
          Object.values(byRef).forEach(function (revs) {
            var live = resolveEffectiveLiveItem(revs);
            if (!live || isCompleteItem(live)) return;
            var issuedDate = effectiveIssuedDate(live);
            if (!issuedDate || !live.cmtsBy || live.cmtsRec) return;
            if (live.statusRec === "A" || live.statusRec === "B") return;
            var d = wdays(TODAY, live.cmtsBy);
            var overdue = d !== null && d < 0;
            toChase.push({
              pkg: pkgName,
              type: typeLabel,
              item: cleanActionItem(shortRef(live.ref), pkgName),
              revision: live.rc ? live.rc : "—",
              status: overdue ? "Comments overdue" : "Awaiting comments",
              action: "Chase client comments — issued " + fmt(issuedDate),
              actionCat: "CHASING",
              when: dueText("Comments due", live.cmtsBy),
              float: fI,
              planDate: live.cmtsBy,
              overdue: overdue,
              issued: issuedDate,
            });
          });
        }

        function collectRfiTasks(items, pkgName, isPkgClosed) {
          rfiItemsAsOf(items, TODAY).forEach(function (it) {
            if (!rfiNeedsAction(it, isPkgClosed)) return;
            var overdue = rfiIsOverdue(it, TODAY, isPkgClosed);
            toChase.push({
              pkg: pkgName,
              type: "RFI",
              item: cleanActionItem(
                "RFI " + it.ref + (it.title ? " — " + it.title : ""),
                pkgName,
              ),
              revision: "—",
              status: overdue ? "Response overdue" : "Awaiting response",
              action:
                "Chase client RFI response" +
                (it.issued ? " — issued " + fmt(it.issued) : ""),
              actionCat: "CHASING",
              when: dueText("Response due", it.required),
              float: null,
              planDate: it.required,
              overdue: overdue,
            });
          });
        }

        function collectConstructionIssueTasks(items, typeLabel, fI, pkgName) {
          var byRef = byRefSorted(deliverableItemsAsOf(items, TODAY));
          Object.values(byRef).forEach(function (revs) {
            var live = resolveEffectiveLiveItem(revs);
            if (!live) return;
            if (
              !(
                (live.statusRec === "A" || live.statusRec === "B") &&
                constructionFlagOn(live.constructionFlag) &&
                !live.constructionIssued
              )
            )
              return;
            toIssue.push({
              pkg: pkgName,
              type: typeLabel,
              item: cleanActionItem(shortRef(live.ref), pkgName),
              revision: live.rc ? live.rc : "—",
              status:
                live.statusRec === "B"
                  ? "Status B — address comments + issue for construction"
                  : "Status A — issue for construction",
              action:
                live.statusRec === "B"
                  ? "Address comments + issue for construction"
                  : "Issue for construction",
              actionCat:
                live.statusRec === "B"
                  ? "STATUS_B_CONSTRUCTION"
                  : "STATUS_A_CONSTRUCTION",
              when:
                "Status " + live.statusRec + " received " + fmt(live.cmtsRec),
              float: fI,
              planDate: TODAY,
            });
          });
        }

        assessed.forEach(function (a) {
          collectRfiTasks(a.pkg.rfiItems, a.pkg.name, a.isClosed);
        });

        assessed.forEach(function (a) {
          if (a.isClosed) return;
          var p = a.pkg;
          var planStart = packagePlannedStart(p);
          var streams = [
            {
              items: p.tsItems,
              label: "Tech Sub",
              planned: p.tsPlanned,
              float: a.deliverableFloats.techSub,
            },
            {
              items: p.dwItems,
              label: "Drawings",
              planned: p.dwPlanned,
              float: a.deliverableFloats.drawings,
            },
            {
              items: p.calcItems,
              label: "Calculations",
              planned: p.tsPlanned,
              float: a.deliverableFloats.calculations,
            },
            {
              items: p.smpItems,
              label: "Samples",
              planned: planStart,
              float: a.deliverableFloats.samples,
            },
          ];

          var designFloatsAct = streams
            .map(function (stream) {
              return stream.float;
            })
            .filter(function (value) {
              return value !== null && value !== undefined;
            });

          var coFloat = designFloatsAct.length
            ? worstFloat(designFloatsAct)
            : a.fCO;

          streams.forEach(function (stream) {
            var inherited = stream.items.some(function (item) {
              return !!item.sharedFromPackage;
            });

            if (inherited) return;

            collectIssueTasks(
              stream.items,
              stream.label,
              stream.float,
              stream.planned,
              p.name,
            );
            collectAddressTasks(
              stream.items,
              stream.label,
              stream.float,
              p.name,
            );
            collectChaseTasks(stream.items, stream.label, stream.float, p.name);
            collectConstructionIssueTasks(
              stream.items,
              stream.label,
              stream.float,
              p.name,
            );
          });

          var plannedCalloff = packagePlannedCalloff(p);

          p.coItems.forEach(function (it) {
            var snap = Object.assign({}, it);
            if (snap.issued && snap.issued > TODAY) snap.issued = null;
            if (snap.issued) return;
            toIssue.push({
              pkg: p.name,
              type: "Call-off",
              item: cleanActionItem(shortRef(snap.ref), p.name),
              revision: "—",
              status: "Call-off not placed",
              action: "Place call-off",
              actionCat: "CALL_OFF",
              when: dueText("Planned", plannedCalloff),
              float: coFloat,
              planDate: plannedCalloff,
            });
          });
        });

        var pkgSectionByName = {};

        assessed.forEach(function (a) {
          pkgSectionByName[a.pkg.name] = a.section;
        });

        [toIssue, toAddress, toChase].forEach(function (list) {
          list.forEach(function (it) {
            it.pkgSection = pkgSectionByName[it.pkg] || "OK";
          });
        });

        return { toIssue: toIssue, toAddress: toAddress, toChase: toChase };
      }

      var WHEN_LABEL_PREFIXES_TO_STRIP = ["Planned: ", "Comments due: "];

      function baseWhenLabel(it) {
        var label = String(it.when || "—")
          .split("·")[0]
          .trim();

        for (var i = 0; i < WHEN_LABEL_PREFIXES_TO_STRIP.length; i++) {
          var prefix = WHEN_LABEL_PREFIXES_TO_STRIP[i];
          if (label.indexOf(prefix) === 0) {
            label = label.slice(prefix.length);
            break;
          }
        }

        return label;
      }

      function dueBadgeHtml(it) {
        if (!it.planDate) {
          return '<span class="due-pill due-neutral">No date</span>';
        }

        var d = wdays(TODAY, it.planDate);

        if (d < 0) {
          return (
            '<span class="due-pill due-red">Overdue by ' +
            Math.abs(d) +
            "d</span>"
          );
        }

        if (d === 0) {
          return '<span class="due-pill due-orange">Due today</span>';
        }

        if (d <= 5) {
          return '<span class="due-pill due-orange">Due in ' + d + "d</span>";
        }

        return '<span class="due-pill due-green">Due in ' + d + "d</span>";
      }

      function renderFlatTaskRow(it) {
        return (
          '<div class="ai items">' +
          '<div class="aip">' +
          esc(it.pkg || "—") +
          "</div>" +
          '<div class="aii">' +
          esc(it.item || "—") +
          "</div>" +
          '<div class="ait">' +
          esc(it.type || "—") +
          "</div>" +
          '<div class="air">' +
          esc(it.revision || "—") +
          "</div>" +
          '<div class="ais">' +
          (it.status === "Comments overdue" || it.status === "C"
            ? '<span class="comments-overdue-text">' +

          '<div class="aia">' +

          "</div>" +
          '<div class="aiw">' +

      function sortByTimeLeft(arr) {
        return arr.slice().sort(function (a, b) {
          var da = a.planDate ? a.planDate.getTime() : Infinity;
          var db = b.planDate ? b.planDate.getTime() : Infinity;
          return da - db;
        });

      // ============================================================
      // 12. ACTIONS REPORT RENDERING
      // ============================================================
      function actionTaskSection(it) {
        var s = it.pkgSection || "OK";
        return s === "OK" ? "PLANNED" : s;
      }

      function actionSafeIdPart(s) {
        return String(s || "")
          .replace(/[^a-z0-9]+/gi, "_")
          .replace(/^_+|_+$/g, "")
          .toUpperCase();
      }

      function renderActionGroup(label, cls, items, uid) {
        if (!items.length) return "";

        var sortedItems = sortByTimeLeft(items);

        var sectionId = "ACRIT_" + actionSafeIdPart(uid);

        var h = '<div class="ua-section action-criticality">';
        h +=
          '<div class="ua-hdr ' +
          cls +
          '" data-tog="ua" data-id="' +
          sectionId +
          '">';
        h += '<div class="ua-title">' + esc(label) + "</div>";
        h +=
          '<span class="ua-badge">' +
          items.length +
          " item" +
          (items.length !== 1 ? "s" : "") +
          "</span>";
        h +=
          '<span class="sec-chev" id="uachv-' + sectionId + '">&#9660;</span>';
        h += "</div>";

        h += '<div class="ua-body" id="uab-' + sectionId + '">';
        h +=
          '<div class="ach items"><span>Package</span><span>Item</span><span>Type</span><span>Revision</span><span>Status</span><span>Action</span><span>Due Date</span><span>Time Left / Overdue</span></div>';

        sortedItems.forEach(function (it) {
          h += renderFlatTaskRow(it);
        });

        h += "</div></div>";

        return h;
      }

      function renderActionCriticalityGroups(items, uid) {
        var critical = items.filter(function (it) {

        });

        var approaching = items.filter(function (it) {
          return actionTaskSection(it) === "CRIT";
        });

        var pastPlanned = items.filter(function (it) {
          return actionTaskSection(it) === "PAST";
        });

        var onTrack = items.filter(function (it) {
          return actionTaskSection(it) === "PLANNED";
        });

        var h = "";

        h += renderActionGroup(
          "Level 3 Mitigation Required - Project Leads, Project Senior Management, Projects Director",
          "red",
          critical,
          uid + "_CRITICAL",
        );

        h += renderActionGroup(
          "Level 2 Approaching Critical - Project Leads, Project Senior Management",
          "orange",
          approaching,
          uid + "_APPROACHING",
        );

        h += renderActionGroup(
          "Level 1 Past Planned - Project Leads",
          "yellow",
          pastPlanned,
          uid + "_PAST_PLANNED",
        );

        h += renderActionGroup("On Track", "green", onTrack, uid + "_ON_TRACK");

      }

      function renderActionProcessDeliverables(issueItems, addressItems, uid) {

      function renderActionChasingGroups(chaseItems, uid) {

        });

        h += renderActionGroup(

          "Level 1 Past Planned - Project Leads",

      function actionItemsOfType(items, typeLabel) {
        return items.filter(function (it) {
          return it.type === typeLabel;

      function countActionTypeTasks(issueItems, addressItems, chaseItems) {

      }

      function renderActionTaskTypeDropdown(

        addressItems,

      function renderActionWindow(
        title,
        issueItems,
        addressItems,
        chaseItems,
        uid,
        openByDefault,
      ) {
        var id = "UA_" + uid;
        var total = issueItems.length + addressItems.length + chaseItems.length;
        var open = openByDefault || false;

        var h =
          '<div class="ua-section"><div class="ua-hdr" data-tog="ua" data-id="' +
          id +
          '">';
        h += '<div class="ua-title">' + title + "</div>";
        h +=
          '<span class="ua-badge">' +
          total +
          " task" +
          (total !== 1 ? "s" : "") +
          "</span>";
        h +=
          '<span class="sec-chev' +
          (open ? " open" : "") +
          '\" id="uachv-' +
          id +
          '">&#9660;</span></div>';

        h +=
          '<div class="ua-body' +
          (open ? " open" : "") +
          '\" id="uab-' +
          id +
          '">';

        if (!total) {
          h +=
            '<div style="padding:12px 14px;font-size:11px;color:var(--text3)">No tasks in this window.</div>';
        } else {
          function sectionRank(s) {
            return s === "MIT"
              ? 0
              : s === "CRIT"
                ? 1
                : s === "PAST"
                  ? 2
                  : s === "PLANNED"
                    ? 3
                    : 4;
          }

          function scoreGroup(items) {
            var worstRank = 4;
            var worstDate = Infinity;
            var worstCount = 0;
            items.forEach(function (it) {
              var r = sectionRank(actionTaskSection(it));
              var d = it.planDate ? it.planDate.getTime() : Infinity;
              if (r < worstRank) {
                worstRank = r;
                worstDate = d;
                worstCount = 1;
              } else if (r === worstRank) {
                worstCount++;
                if (d < worstDate) worstDate = d;
              }
            });
            return {
              rank: worstRank,
              worstDate: worstDate,
              worstCount: worstCount,
            };
          }

          function compareGroups(a, b) {
            if (a.score.rank !== b.score.rank)
              return a.score.rank - b.score.rank;
            if (a.score.worstDate !== b.score.worstDate)
              return a.score.worstDate - b.score.worstDate;
            return b.score.worstCount - a.score.worstCount;
          }

          var typeGroups = [
            {
              label: "Tech Sub ",
              items: actionItemsOfType(issueItems, "Tech Sub").concat(
                actionItemsOfType(addressItems, "Tech Sub"),
              ),
              issueItems: actionItemsOfType(issueItems, "Tech Sub"),
              addressItems: actionItemsOfType(addressItems, "Tech Sub"),
              chaseItems: [],
              uid: id + "_TECH_SUB",
              isChase: false,
            },
            {
              label: "Drawing ",
              items: actionItemsOfType(issueItems, "Drawings").concat(
                actionItemsOfType(addressItems, "Drawings"),
              ),
              issueItems: actionItemsOfType(issueItems, "Drawings"),
              addressItems: actionItemsOfType(addressItems, "Drawings"),
              chaseItems: [],
              uid: id + "_DRAWINGS",
              isChase: false,
            },
            {
              label: "Calculation ",
              items: actionItemsOfType(issueItems, "Calculations").concat(
                actionItemsOfType(addressItems, "Calculations"),
              ),
              issueItems: actionItemsOfType(issueItems, "Calculations"),
              addressItems: actionItemsOfType(addressItems, "Calculations"),
              chaseItems: [],
              uid: id + "_CALCULATIONS",
              isChase: false,
            },
            {
              label: "Sample ",
              items: actionItemsOfType(issueItems, "Samples").concat(
                actionItemsOfType(addressItems, "Samples"),
              ),
              issueItems: actionItemsOfType(issueItems, "Samples"),
              addressItems: actionItemsOfType(addressItems, "Samples"),
              chaseItems: [],
              uid: id + "_SAMPLES",
              isChase: false,
            },
            {
              label: "Call-off ",
              items: actionItemsOfType(issueItems, "Call-off"),
              issueItems: actionItemsOfType(issueItems, "Call-off"),
              addressItems: [],
              chaseItems: [],
              uid: id + "_CALL_OFF",
              isChase: false,
            },
            {
              label: "Client Chasing",
              items: chaseItems,
              issueItems: [],
              addressItems: [],
              chaseItems: chaseItems,
              uid: id + "_CHASING",
              isChase: true,
            },
          ];

          typeGroups.forEach(function (g) {
            g.score = scoreGroup(g.items);
          });

          typeGroups.sort(function (a, b) {
            if (a.isChase && !b.isChase) return 1;
            if (!a.isChase && b.isChase) return -1;
            return compareGroups(a, b);
          });

          typeGroups.forEach(function (g) {
            h += renderActionTaskTypeDropdown(
              g.label,
              g.issueItems,
              g.addressItems,
              g.chaseItems,
              g.uid,
              false,
              g.isChase,
            );
          });
        }

        h += "</div></div>";

        return h;
      }

      function renderActions(assessed) {
        var tasks = collectActionTasks(assessed);
        var toIssue = tasks.toIssue,
          toAddress = tasks.toAddress,
          toChase = tasks.toChase;

        var dayOfWeek = TODAY.getDay();
        var mondayOffset = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;

        var thisWeekStart = new Date(TODAY);
        thisWeekStart.setDate(thisWeekStart.getDate() + mondayOffset);
        thisWeekStart.setHours(0, 0, 0, 0);

        var thisWeekEnd = new Date(thisWeekStart);
        thisWeekEnd.setDate(thisWeekEnd.getDate() + 4);

        var nextWeekStart = new Date(thisWeekStart);
        nextWeekStart.setDate(nextWeekStart.getDate() + 7);

        var nextWeekEnd = new Date(thisWeekEnd);
        nextWeekEnd.setDate(nextWeekEnd.getDate() + 7);

        function bucketForTask(it) {
          if (!it.planDate) return "other";
          if (it.planDate <= thisWeekEnd) return "thisWeek";
          if (it.planDate <= nextWeekEnd) return "nextWeek";
          return "other";
        }

        function splitByTime(items) {
          var tw = [],
            nw = [],
            ot = [];
          items.forEach(function (it) {
            var b = bucketForTask(it);
            if (b === "thisWeek") tw.push(it);
            else if (b === "nextWeek") nw.push(it);
            else ot.push(it);
          });
          return { thisWeek: tw, nextWeek: nw, other: ot };
        }

        var issueW = splitByTime(toIssue);
        var addressW = splitByTime(toAddress);
        var chaseW = splitByTime(toChase);

        var h = '<div class="area-label">Upcoming Actions</div>';
        h += renderActionWindow(
          "Tasks This Week - " + fmt(thisWeekStart) + " to " + fmt(thisWeekEnd),
          issueW.thisWeek,
          addressW.thisWeek,
          chaseW.thisWeek,
          "THIS_WEEK",
          false,
        );
        h += renderActionWindow(
          "Tasks Next Week - " + fmt(nextWeekStart) + " to " + fmt(nextWeekEnd),
          issueW.nextWeek,
          addressW.nextWeek,
          chaseW.nextWeek,
          "NEXT_WEEK",
          false,
        );
        h += renderActionWindow(
          "All Other Outstanding Tasks",
          issueW.other,
          addressW.other,
          chaseW.other,
          "OTHER",
          false,
        );
        return h;
      }

      // ============================================================
      // 13. COMMENTS REPORT
      // ============================================================
      function computeOverdueCommentsList(assessed) {
        var tasks = collectActionTasks(assessed);
        return sortByTimeLeft(
          tasks.toChase.filter(function (it) {
            return it.status === "Comments overdue";
          }),
        );
      }

      function computeUpcomingCommentsList(assessed) {
        var tasks = collectActionTasks(assessed);
        return sortByTimeLeft(
          tasks.toChase.filter(function (it) {
            return it.status === "Awaiting comments";
          }),
        );
      }

      function commentCriticalKey(it) {
        return [
          String(it.pkg || ""),
          String(it.type || ""),
          String(it.item || ""),
          String(it.revision || ""),
          it.planDate instanceof Date ? it.planDate.getTime() : "",
          it.issued instanceof Date ? it.issued.getTime() : "",
        ].join("||");
      }

      function renderOverdueCommentRow(it) {
        var overdueDays = it.planDate ? wdays(TODAY, it.planDate) : null;
        var overdueLabel =
          overdueDays !== null
            ? "Overdue by " + Math.abs(overdueDays) + "d"
            : "—";

        var commentKey = commentCriticalKey(it);
        var criticalState =
          window.__criticalCommentState || (window.__criticalCommentState = {});

        var critical = criticalState[commentKey] === true;

        return (
          '<div class="cli-breakdown-table-row' +
          (critical ? " comment-critical" : "") +
          '">' +
          '<div class="cli-breakdown-table-cell">' +
          esc(it.pkg || "—") +
          "</div>" +
          '<div class="cli-breakdown-table-cell cli-breakdown-deliverable-cell">' +
          esc(it.item || "—") +
          "</div>" +
          '<div class="cli-breakdown-table-cell cli-breakdown-type-cell">' +
          esc(it.type || "—") +
          "</div>" +
          '<div class="cli-breakdown-table-cell cli-breakdown-revision-cell">' +
          esc(it.revision || "—") +
          "</div>" +
          '<div class="cli-breakdown-table-cell cli-breakdown-due-cell">' +
          (it.issued ? fmt(it.issued) : "—") +
          "</div>" +
          '<div class="cli-breakdown-table-cell cli-breakdown-due-cell">' +
          (it.planDate ? fmtFull(it.planDate) : "No date") +
          "</div>" +
          '<div class="cli-breakdown-table-cell cli-breakdown-status-cell cli-overdue-cell">' +
          esc(overdueLabel) +
          "</div>" +
          '<div class="cli-breakdown-table-cell cli-comment-critical-cell">' +
          '<label class="cli-comment-critical-toggle">' +
          '<input type="checkbox" data-comment-critical="' +
          attr(commentKey) +
          '"' +
          (critical ? " checked" : "") +
          ">" +
          "<span>Critical</span>" +
          "</label>" +
          "</div>" +
          "</div>"
        );
      }

      function renderUpcomingCommentRow(it) {
        var daysLeft = it.planDate ? wdays(TODAY, it.planDate) : null;
        var dueLabel =
          daysLeft !== null
            ? daysLeft <= 0
              ? "Due today"
              : "Due in " + daysLeft + "d"
            : "—";

        var soon = daysLeft !== null && daysLeft <= 5;
        var commentKey = commentCriticalKey(it);
        var criticalState =
          window.__criticalCommentState || (window.__criticalCommentState = {});

        var critical = criticalState[commentKey] === true;

        return (
          '<div class="cli-breakdown-table-row' +
          (critical ? " comment-critical" : "") +
          '">' +
          '<div class="cli-breakdown-table-cell">' +
          esc(it.pkg || "—") +
          "</div>" +
          '<div class="cli-breakdown-table-cell cli-breakdown-deliverable-cell">' +
          esc(it.item || "—") +
          "</div>" +
          '<div class="cli-breakdown-table-cell cli-breakdown-type-cell">' +
          esc(it.type || "—") +
          "</div>" +
          '<div class="cli-breakdown-table-cell cli-breakdown-revision-cell">' +
          esc(it.revision || "—") +
          "</div>" +
          '<div class="cli-breakdown-table-cell cli-breakdown-due-cell">' +
          (it.issued ? fmt(it.issued) : "—") +
          "</div>" +
          '<div class="cli-breakdown-table-cell cli-breakdown-due-cell">' +
          (it.planDate ? fmtFull(it.planDate) : "No date") +
          "</div>" +
          '<div class="cli-breakdown-table-cell cli-breakdown-status-cell ' +
          (soon ? "cli-upcoming-cell--soon" : "cli-upcoming-cell--ok") +
          '">' +
          esc(dueLabel) +
          "</div>" +
          '<div class="cli-breakdown-table-cell cli-comment-critical-cell">' +
          '<label class="cli-comment-critical-toggle">' +
          '<input type="checkbox" data-comment-critical="' +
          attr(commentKey) +
          '"' +
          (critical ? " checked" : "") +
          ">" +
          "<span>Critical</span>" +
          "</label>" +
          "</div>" +
          "</div>"
        );
      }

      function commentsTableHeaderHtml(statusHeading) {
        return (
          '<div class="cli-breakdown-table-head">' +
          "<div>Package</div>" +
          "<div>Item</div>" +
          "<div>Type</div>" +
          "<div>Revision</div>" +
          "<div>Issued</div>" +
          "<div>Due</div>" +
          "<div>" +
          esc(statusHeading) +
          "</div>" +
          "<div>Critical</div>" +
          "</div>"
        );
      }

      function renderCommentsReportPart(part) {
        var sectionTitle = part.title + (part.continued ? " — Continued" : "");

        var html =
          '<div class="cli-section-title">' + esc(sectionTitle) + "</div>";

        if (part.emptyMessage) {
          html +=
            '<div class="cli-breakdown-no-problems">' +
            esc(part.emptyMessage) +
            "</div>";

          return html;
        }

        html += '<div class="cli-breakdown-table cli-overdue-table">';
        html += commentsTableHeaderHtml(part.statusHeading);
        html += part.rows.join("");
        html += "</div>";

        return html;
      }

      function renderOverdueCommentsReport(data, assessed, title) {
        var overdue = computeOverdueCommentsList(assessed);
        var upcoming = computeUpcomingCommentsList(assessed);

        var pageLimit = CLI_PORTRAIT_PAGE_CONTENT_HEIGHT - 8;

        function commentsPageContent(parts) {
          var html = clientReportHeaderHtml(data, title, "Comments");

          parts.forEach(function (part) {
            html += renderCommentsReportPart(part);
          });

          return html;
        }

        function commentsPageFits(parts) {
          return measureClientHtml(commentsPageContent(parts)) <= pageLimit;
        }

        var pages = [[]];

        function addSection(
          sectionTitle,
          statusHeading,
          items,
          rowRenderer,
          emptyMessage,
        ) {
          var currentPage = pages[pages.length - 1];

          var part = {
            title: sectionTitle,
            statusHeading: statusHeading,
            rows: [],
            continued: false,
            emptyMessage: "",
          };

          if (!items.length) {
            part.emptyMessage = emptyMessage;
            currentPage.push(part);

            if (!commentsPageFits(currentPage) && currentPage.length > 1) {
              currentPage.pop();

              currentPage = [];
              pages.push(currentPage);
              currentPage.push(part);
            }

            return;
          }

          currentPage.push(part);

          items.forEach(function (item) {
            var rowHtml = rowRenderer(item);

            part.rows.push(rowHtml);

            if (commentsPageFits(currentPage)) {
              return;
            }

            part.rows.pop();

            if (!part.rows.length) {
              currentPage.pop();

              currentPage = [];
              pages.push(currentPage);

              part = {
                title: sectionTitle,
                statusHeading: statusHeading,
                rows: [rowHtml],
                continued: false,
                emptyMessage: "",
              };

              currentPage.push(part);
              return;
            }

            currentPage = [];
            pages.push(currentPage);

            part = {
              title: sectionTitle,
              statusHeading: statusHeading,
              rows: [rowHtml],
              continued: true,
              emptyMessage: "",
            };

            currentPage.push(part);
          });
        }

        addSection(
          "Overdue Comments",
          "Overdue",
          overdue,
          renderOverdueCommentRow,
          "No overdue comments.",
        );

        addSection(
          "Upcoming Comments",
          "Time left",
          upcoming,
          renderUpcomingCommentRow,
          "No comments currently awaited.",
        );

      function clientReportHeadingText(data, title, headingSuffix) {
        var projectCodeSource = String(
          (data && data.projName) || title || "",
        ).trim();
        var projectCodeMatch = projectCodeSource.match(/\b[A-Z]{2,}\d+\b/i);
        var clientProjectCode = projectCodeMatch
          ? projectCodeMatch[0].toUpperCase()
          : projectCodeSource;
        return (
          (clientProjectCode ? clientProjectCode + " " : "") +
          (headingSuffix || "Client Design Summary")
        );
      }

      function clientOutstandingProblemKey(
        packageName,
        typeLabel,
        reference,
        actionType,
      ) {
        return [
          packageName || "",
          typeLabel || "",
          reference || "",
          actionType || "",
        ]
          .map(function (value) {
            return String(value).trim().toLowerCase();
          })
          .join("|");
      }

      function collectClientOutstandingProblems(assessed, asOfDate) {
        asOfDate = asOfDate || TODAY;

        var problemsByKey = {};
        var processedDesignOwners = {};

        function addProblem(problem) {
          if (!problem || !problem.key) return;

          var existing = problemsByKey[problem.key];

          if (!existing) {
            problemsByKey[problem.key] = problem;
            return;
          }

          var existingDue = existing.due || new Date(9999, 0, 1);
          var candidateDue = problem.due || new Date(9999, 0, 1);

          if (candidateDue < existingDue) {
            problemsByKey[problem.key] = problem;
          }
        }

        function scanDeliverables(
          packageName,
          typeLabel,
          items,
          fallbackPlanned,
        ) {
          var groupedItems = byRefSorted(
            deliverableItemsAsOf(items || [], asOfDate),
          );

          Object.keys(groupedItems).forEach(function (reference) {
            var revisions = groupedItems[reference];
            var live = resolveEffectiveLiveItem(revisions);

            if (!live || isCompleteItem(live)) return;

            var issuedDate = effectiveIssuedDate(live);
            var displayState = getRevisionDisplayState(revisions, live);

            var previousStatus = displayState.previousStatus || "";

            var plannedDate =
              live.nextRevPlanned || live.planned || fallbackPlanned || null;

            var owner = "";
            var actionType = "";
            var requiredAction = "";
            var dueDate = plannedDate;

            if (!issuedDate) {
              var isStatusCReissue = previousStatus === "C";

              if (
                !isStatusCReissue &&
                (!plannedDate || plannedDate >= asOfDate)
              ) {
                return;
              }

              owner = "Holden";
              actionType = isStatusCReissue ? "reissue" : "issue";

              requiredAction = isStatusCReissue
                ? "Address Status C comments and reissue"
                : "Issue deliverable";
            } else if (live.statusRec === "C" && live.cmtsRec) {
              owner = "Holden";
              actionType = "reissue";
              requiredAction = "Address Status C comments and reissue";

              dueDate = live.nextRevPlanned || plannedDate;
            } else if (
              (live.statusRec === "A" || live.statusRec === "B") &&
              constructionFlagOn(live.constructionFlag) &&
              !live.constructionIssued
            ) {
              owner = "Holden";
              actionType = "construction-issue";
              requiredAction = "Issue approved deliverable for construction";
            } else if (live.cmtsBy && !live.cmtsRec) {
              owner = "Client";
              actionType = "comments";
              requiredAction = "Review and return comments";

              dueDate = live.cmtsBy || plannedDate;
            } else if (
              !live.cmtsRec &&
              !/^[ABC]$/i.test(String(live.statusRec || "").trim())
            ) {
              owner = "Holden";
              actionType = "confirm-status";
              requiredAction = "Confirm comments due date and current status";
            } else {
              return;
            }

            addProblem({
              key: clientOutstandingProblemKey(
                packageName,
                typeLabel,
                live.ref || reference,
                actionType,
              ),
              pkg: packageName,
              type: typeLabel,
              ref: live.ref || reference || "",
              title: live.title || "",
              revision: String(live.rc || "").trim() || "N/A",
              approvalStatus: /^[ABC]$/i.test(
                String(live.statusRec || "").trim(),
              )
                ? String(live.statusRec).trim().toUpperCase()
                : /^[ABC]$/i.test(previousStatus)
                  ? previousStatus.toUpperCase()
                  : "N/A",
              owner: owner,
              action: requiredAction,
              due: dueDate || null,
            });
          });
        }

        (assessed || []).forEach(function (a) {
          if (!a || a.isClosed) return;

          var p = a.pkg;

          [
            {
              key: "tsItems",
              label: "Tech Sub",
              planned: p.tsPlanned,
            },
            {
              key: "dwItems",
              label: "Drawings",
              planned: p.dwPlanned,
            },
            {
              key: "calcItems",
              label: "Calculations",
              planned: null,
            },
            {
              key: "smpItems",
              label: "Samples",
              planned: null,
            },
          ].forEach(function (stream) {
            var items = p[stream.key] || [];
            if (!items.length) return;

            var designOwner = items[0].sharedFromPackage || p.name;

            var processKey = designOwner + "|" + stream.key;

            if (processedDesignOwners[processKey]) return;
            processedDesignOwners[processKey] = true;

            scanDeliverables(designOwner, stream.label, items, stream.planned);
          });

          rfiItemsAsOf(p.rfiItems || [], asOfDate).forEach(function (it) {
            if (!rfiNeedsAction(it, a.isClosed)) return;

            addProblem({
              key: clientOutstandingProblemKey(
                p.name,
                "RFI",
                it.ref,
                "response",
              ),
              pkg: p.name,
              type: "RFI",
              ref: it.ref || "",
              title: it.title || "",
              owner: "Client",
              action: "Respond to RFI",
              due: it.required || null,
            });
          });

          (p.coItems || []).forEach(function (it) {
            if (it.issued && it.issued <= asOfDate) {
              return;
            }

            var plannedDate = packagePlannedCalloff(p) || p.critCO || null;

            if (!plannedDate) {
              return;
            }

            var packageAtProcurementRisk =
              a.section === "CRIT" || a.section === "MIT";

            if (plannedDate >= asOfDate && !packageAtProcurementRisk) {
              return;
            }

            addProblem({
              key: clientOutstandingProblemKey(
                p.name,
                "Call-Off",
                it.ref,
                "place-calloff",
              ),
              pkg: p.name,
              type: "Call-Off",
              ref: it.ref || "",
              title: it.title || "",
              owner: "Holden",
              action: "Place call-off / order",
              due: plannedDate,
            });
          });
        });

        return Object.values(problemsByKey).sort(function (a, b) {
          var aDue = a.due ? a.due.getTime() : Infinity;

          var bDue = b.due ? b.due.getTime() : Infinity;

          if (aDue !== bDue) {
            return aDue - bDue;
          }

          var typeDifference = String(a.type || "").localeCompare(
            String(b.type || ""),
          );

          if (typeDifference !== 0) {
            return typeDifference;
          }

          return String(a.ref || "").localeCompare(String(b.ref || ""));
        });
      }

      function clientProblemStatus(problem) {
        if (!problem.due) {
          return {
            cls: "red",
            text: "Date required",
          };
        }

        var days = wdays(TODAY, problem.due);

        if (days < 0) {
          return {
            cls: "red",
            text: Math.abs(days) + "d overdue",
          };
        }

        if (days === 0) {
          return {
            cls: "orange",
            text: "Due today",
          };
        }

        if (days <= 5) {
          return {
            cls: "orange",
            text: "Due in " + days + "d",
          };
        }

        return {
          cls: "neutral",
          text: "Due in " + days + "d",
        };
      }

      function renderClientOutstandingProblems(problems) {
        if (!problems.length) {
          return (

          html += '<div class="cli-breakdown-table-row">';

          html +=

          html +=

          html +=
            '<div class="cli-breakdown-table-cell cli-breakdown-owner-cell">' +

          html +=
            '<div class="cli-breakdown-table-cell cli-breakdown-due-cell">' +
            (problem.due ? fmtFull(problem.due) : "No date") +
            "</div>";

          html +=
            '<div class="cli-breakdown-table-cell cli-breakdown-status-cell">' +
            '<span class="cli-breakdown-problem-status ' +
            status.cls +
            '">' +
            esc(status.text) +
            "</span>" +
            "</div>";

          html += "</div>";
        });

        html += "</div>";

        return html;
      }

      function clientBreakdownPastPlannedDays(a) {
        var assessmentCells = [a.tsC, a.dwC, a.calcC, a.smpC, a.coC, a.rfiC];

        var overdueDays = assessmentCells
          .filter(function (cell) {
            return (
              cell &&
              cell.planned &&
              (cell.hasIssue || cell.programmeIssue) &&
              cell.planned < TODAY
            );
          })
          .map(function (cell) {
            return wdays(cell.planned, TODAY);
          })
          .filter(function (days) {
            return days > 0;
          });

        if (overdueDays.length) {
          return Math.max.apply(null, overdueDays);
        }

        var planStart = packagePlannedStart(a.pkg);

        if (planStart && planStart < TODAY) {
          return Math.max(0, wdays(planStart, TODAY));
        }

        return null;
      }

      function clientBreakdownStatusLabel(a) {
        var p = a.pkg;

        var forecastFloat =
          p.critCO && a.projectedFinish
            ? wdays(a.projectedFinish, p.critCO)
            : null;

        if (a.section === "MIT") {
          var daysOver =
            forecastFloat !== null && forecastFloat < 0
              ? Math.abs(forecastFloat)
              : a.minFloat !== null &&
                  a.minFloat !== undefined &&
                  a.minFloat < 0
                ? Math.abs(a.minFloat)
                : null;

          return daysOver !== null
            ? "Critical - " + daysOver + "d negative float"
            : "Critical";
        }

        if (a.section === "CRIT") {
          var daysRemaining =
            forecastFloat !== null
              ? Math.max(0, forecastFloat)
              : a.minFloat !== null && a.minFloat !== undefined
                ? Math.max(0, a.minFloat)
                : null;

          return daysRemaining !== null
            ? "Approaching critical - " + daysRemaining + "d float remaining"
            : "Approaching critical";
        }

        if (a.section === "PAST") {
          var daysPast = clientBreakdownPastPlannedDays(a);

          return daysPast !== null
            ? "Off plan - " + daysPast + "d past planned"
            : "Off plan";
        }

        return "";
      }

      function getClientBreakdownFieldValue(pkgName, field) {
        var packageData = window.__breakdownFieldData[pkgName] || {};

        return packageData[field] || "";
      }

      function saveClientBreakdownFieldValue(pkgName, field, value) {
        if (!window.__breakdownFieldData[pkgName]) {
          window.__breakdownFieldData[pkgName] = {};
        }

        window.__breakdownFieldData[pkgName][field] = value || "";
      }

      function clientBreakdownFieldEnabled(pkgName, field) {
        var packageState = window.__breakdownFieldState[pkgName] || {};

        return packageState[field] === true;
      }

      function getClientBreakdownFieldHeight(pkgName, field) {
        var packageHeights = window.__breakdownFieldHeights[pkgName] || {};

        var height = Number(packageHeights[field]);

        return Number.isFinite(height) && height >= 30
          ? Math.round(height)
          : null;
      }

      function saveClientBreakdownFieldHeight(pkgName, field, height) {
        if (!window.__breakdownFieldHeights[pkgName]) {
          window.__breakdownFieldHeights[pkgName] = {};
        }

        window.__breakdownFieldHeights[pkgName][field] = Math.max(
          30,
          Math.round(height),
        );
      }

      function clientBreakdownTextareaRows(value) {
        var text = String(value || "");

        if (!text) return 1;

        var rows = text.split("\n").reduce(function (total, line) {
          return total + Math.max(1, Math.ceil(line.length / 42));
        }, 0);

        return Math.max(1, Math.min(12, rows));
      }

      function renderClientBreakdownOption(pkgName, field, label, enabled) {
        return (
          '<label class="cli-breakdown-package-option">' +
          '<input type="checkbox" data-breakdown-option="' +
          field +
          '" data-pkg="' +
          attr(pkgName) +
          '"' +
          (enabled ? " checked" : "") +
          ">" +
          "<span>" +
          label +
          "</span>" +
          "</label>"
        );
      }

      function renderClientBreakdownField(
        pkgName,
        field,
        className,
        label,
        placeholder,
        value,
        enabled,
        height,
      ) {
        return (
          '<label class="cli-breakdown-field ' +
          className +
          '" style="display:' +
          (enabled ? "block" : "none") +
          '">' +
          "<span>" +
          label +
          "</span>" +
          '<textarea rows="' +
          clientBreakdownTextareaRows(value) +
          '"' +
          (height ? ' style="height:' + height + 'px"' : "") +
          ' data-breakdown-field="' +
          field +
          '" data-pkg="' +
          attr(pkgName) +
          '" placeholder="' +
          placeholder +
          '">' +
          esc(value) +
          "</textarea>" +
          '<div class="cli-breakdown-field-pdf-value" data-breakdown-field="' +
          field +
          '" style="min-height:' +
          (height || 34) +
          'px">' +
          esc(value) +
          "</div>" +
          "</label>"
        );
      }

      function renderClientPackageBreakdownBlock(a, problems) {
        var statusClass = ganttSectionBarClass(a.section);

        var pkgName = a.pkg.name;

        var calloffState =
          a.calloffState || calloffPlacementState(a.pkg, TODAY);

        var orderPlaced = calloffState.required && calloffState.allPlaced;

        var orderDate = orderPlaced
          ? calloffState.latestIssued
          : a.projectedFinish;

        var orderLabel = orderPlaced ? "Order placed:" : "Projected order:";

        var criticalOrderLabel = orderPlaced
          ? "Critical order (baseline):"
          : "⚠ Critical order:";

        var clientRequestValue = getClientBreakdownFieldValue(
          pkgName,
          "clientRequest",
        );

        var clientInformationValue = getClientBreakdownFieldValue(
          pkgName,
          "clientInformation",
        );

        var clientRequestEnabled = clientBreakdownFieldEnabled(
          pkgName,
          "clientRequest",
        );

        var clientInformationEnabled = clientBreakdownFieldEnabled(
          pkgName,
          "clientInformation",
        );

        var clientRequestHeight = getClientBreakdownFieldHeight(

        var clientInformationHeight = getClientBreakdownFieldHeight(

        return (
          '<div class="cli-breakdown-package status-' +

          '<div class="cli-breakdown-package-head">' +
          '<div class="cli-breakdown-package-name-wrap">' +

          "</span>" +
          "</div>" +
          "</div>" +
          '<div class="cli-breakdown-package-head-right">' +
          (a.orderedAtRiskState && a.orderedAtRiskState.orderedAtRisk
            ? '<span class="ordered-risk-badge">Ordered at risk</span>'
            : "") +
          '<div class="cli-breakdown-package-status">' +
          esc(clientBreakdownStatusLabel(a)) +
          "</div>" +
          "</div>" +
          "</div>" +

          '<div class="cli-breakdown-package-content">' +
          renderClientOutstandingProblems(problems || []) +
          '<div class="cli-breakdown-package-side">' +
          '<div class="cli-breakdown-package-controls no-pdf">' +
          '<div class="cli-breakdown-package-options">' +
          renderClientBreakdownOption(
            pkgName,
            "clientInformation",

          renderClientBreakdownOption(
            pkgName,
            "clientRequest",
            "Add client request",
            clientRequestEnabled,
          ) +
          "</div>" +
          "</div>" +
          '<div class="cli-breakdown-fields">' +
          renderClientBreakdownField(
            pkgName,
            "clientInformation",
            "cli-breakdown-client-information",
            "Client information",
            "Add relevant information for the client.",
            clientInformationValue,
            clientInformationEnabled,
            clientInformationHeight,
          ) +
          renderClientBreakdownField(
            pkgName,
            "clientRequest",
            "cli-breakdown-client-request",
            "Client request",
            "State clearly what is required from the client.",
            clientRequestValue,
            clientRequestEnabled,
            clientRequestHeight,
          ) +
          "</div>" +
          "</div>" +
          "</div>" +
          "</div>" +
          "</div>"
        );
      }

      function buildClientPackageBreakdownBlocks(assessed) {
        var criticalityOrder = {
          MIT: 0,
          CRIT: 1,
          PAST: 2,
        };

        var breakdownPackages = (assessed || [])
          .filter(function (a) {
            return (
              !a.isClosed &&
              a.section !== "OK" &&
              criticalityOrder[a.section] !== undefined
            );
          })
          .slice()
          .sort(compareClientPackageCriticality);

        if (!breakdownPackages.length) {
          return [];
        }

        var allProblems = collectClientOutstandingProblems(
          assessed || [],
          TODAY,
        );

        var blocks = [
          {
            type: "breakdown-title",
            html: "",
          },
        ];

        breakdownPackages.forEach(function (a) {
          var packageProblems = allProblems.filter(function (problem) {
            return problem.pkg === a.pkg.name;
          });

          blocks.push({
            type: "breakdown-package",
            html: renderClientPackageBreakdownBlock(a, packageProblems),
          });
        });

        return blocks;
      }

      function clientReportHeaderHtml(data, title, headingSuffix) {
        var h = "";
        h += '<div class="cli-cover-head">';
        h += '<div class="cli-cover-copy">';
        h +=
          '<div class="cli-cover-title">' +
          esc(clientReportHeadingText(data, title, headingSuffix)) +

      // ============================================================
      // 15. CLIENT MEASUREMENT & PAGINATION
      // ============================================================
      function measureClientBlocks(blocks) {
        var measurer = document.getElementById("cliPageMeasurer");

        if (!measurer) {
          measurer = document.createElement("div");
          measurer.id = "cliPageMeasurer";
          measurer.className = "cli-export-root";
          measurer.style.position = "absolute";
          measurer.style.visibility = "hidden";
          measurer.style.pointerEvents = "none";
          measurer.style.top = "-10000px";
          measurer.style.left = "-10000px";
          measurer.style.width = CLI_PAGE_WIDTH + "px";
          measurer.style.minHeight = "0";
          measurer.style.height = "auto";
          document.body.appendChild(measurer);
        }

        return blocks.map(function (block) {
          var isLandscapeBlock =
            block.type === "breakdown-title" ||
            block.type === "breakdown-package" ||
            block.type === "breakdown-measured-html";

          measurer.style.width =
            (isLandscapeBlock
              ? CLI_LANDSCAPE_PAGE_WIDTH
              : CLI_PORTRAIT_PAGE_WIDTH) + "px";

          var blockHeight = 0;

          if (block.type === "row") {
            blockHeight = CLI_GANTT_ROW_HEIGHT;
          } else if (block.type === "axis") {
            blockHeight = CLI_GANTT_HEADER_HEIGHT;
          } else {
            measurer.innerHTML =
              '<div style="display:flow-root">' + block.html + "</div>";

            var measuredWrapper = measurer.firstElementChild;

            blockHeight = measuredWrapper
              ? Math.ceil(measuredWrapper.getBoundingClientRect().height)
              : 0;
          }

          return Object.assign({}, block, {
            height: Math.max(0, blockHeight),
          });
        });
      }

      function measureClientHtml(html) {
        var measured = measureClientBlocks([
          {
            type: "measured-html",
            html: html || "",
          },
        ]);

        return measured.length ? measured[0].height : 0;
      }

      function paginateClientBlocks(blocks) {
        var pages = [];
        var breakdownPageLimit =
          CLI_LANDSCAPE_PAGE_CONTENT_HEIGHT - CLI_RUNNING_HEADER_HEIGHT - 6;

        var breakdownBlocks = blocks.filter(function (block) {
          return (
            block.type === "breakdown-title" ||
            block.type === "breakdown-package"
          );
        });

        var programmeBlocks = blocks.filter(function (block) {
          return (
            block.type !== "breakdown-title" &&
            block.type !== "breakdown-package"
          );
        });

        var leadingBlocks = programmeBlocks.filter(function (block) {
          return block.type !== "row";
        });

        var rowBlocks = programmeBlocks.filter(function (block) {
          return block.type === "row";
        });

        if (rowBlocks.length) {
          var firstPageRows = rowBlocks.slice(0, CLI_FIRST_PAGE_MAX_ROWS);

          pages.push(leadingBlocks.concat(firstPageRows));

          var rowIndex = CLI_FIRST_PAGE_MAX_ROWS;

          while (rowIndex < rowBlocks.length) {
            pages.push(
              rowBlocks.slice(
                rowIndex,
                rowIndex + CLI_CONTINUATION_PAGE_MAX_ROWS,
              ),
            );

            rowIndex += CLI_CONTINUATION_PAGE_MAX_ROWS;
          }
        } else {
          pages.push(leadingBlocks);
        }

        if (!breakdownBlocks.length) {
          return pages;
        }

        var breakdownTitle = breakdownBlocks[0];

        var packageBlocks = breakdownBlocks.filter(function (block) {
          return block.type === "breakdown-package";
        });

        if (!packageBlocks.length) {
          return pages;
        }

        var currentBreakdownPage = [breakdownTitle];

        var usedHeight =
          breakdownTitle.height ||
          measureClientLandscapeHtml(breakdownTitle.html);

        packageBlocks.forEach(function (block) {
          var blockHeight =
            block.height || measureClientLandscapeHtml(block.html);

          var pageAlreadyHasPackage = currentBreakdownPage.some(
            function (pageBlock) {
              return pageBlock.type === "breakdown-package";
            },
          );

          if (
            pageAlreadyHasPackage &&
            usedHeight + blockHeight > breakdownPageLimit
          ) {
            pages.push(currentBreakdownPage);

            currentBreakdownPage = [block];

            usedHeight = blockHeight;
          } else {
            currentBreakdownPage.push(block);

            usedHeight += blockHeight;
          }
        });

        if (currentBreakdownPage.length) {
          pages.push(currentBreakdownPage);
        }

        return pages;
      }

      function clientReportRunningHeaderHtml(sectionName) {
        return (
          '<div class="cli-running-header">' +
          '<span class="cli-running-header-wordmark"></span>' +
          '<span class="cli-running-header-section">' +
          esc(sectionName) +
          "</span>" +
          '<span class="cli-running-header-date">Report date: ' +
          fmtFull(TODAY) +
          "</span>" +
          "</div>"
        );
      }

      function hydrateClientRunningHeaderWordmarks() {
        var sourceSvg = document.querySelector(
          "#clientReportPreview .cli-cover-copy > .cli-cover-sub:not(.cli-report-date) svg",
        );

        if (!sourceSvg) return;

        document
          .querySelectorAll("#clientReportPreview .cli-running-header-wordmark")
          .forEach(function (wordmark) {
            wordmark.innerHTML = "";
            wordmark.appendChild(sourceSvg.cloneNode(true));
          });
      }

      function renderClientPagesHtml(pages) {
        return pages
          .map(function (pageBlocks, pageIndex) {
            var titleHtml = "";
            var axisHtml = "";
            var dividersHtml = "";
            var rowsHtml = "";
            var afterChartHtml = "";
            var rowCount = 0;
            var i = 0;

            var continuesRows =
              pageIndex > 0 &&
              pageBlocks.length &&
              pageBlocks[0].type === "row";

            if (continuesRows) {
              titleHtml =
                '<div class="cli-section-title">Active Package Program(continued)</div>' +
                clientGanttLegendHtml();
              axisHtml = pageBlocks[0].axisHtml || "";
              dividersHtml = pageBlocks[0].dividersHtml || "";
            }

            while (i < pageBlocks.length) {
              var block = pageBlocks[i];

              if (block.type === "axis") {
                axisHtml = block.html;
                dividersHtml = block.dividersHtml || dividersHtml;
                i++;
              } else if (block.type === "row") {
                while (i < pageBlocks.length && pageBlocks[i].type === "row") {
                  rowsHtml += pageBlocks[i].html;
                  rowCount++;
                  i++;
                }
              } else if (
                block.type === "breakdown-title" ||
                block.type === "breakdown-package"
              ) {
                afterChartHtml += block.html;
                i++;
              } else {
                titleHtml += block.html;
                i++;
              }
            }

            var chartHtml = "";

            if (axisHtml || rowsHtml) {
              var hLinesHtml = ganttHorizontalLinesHtml(
                rowCount,
                CLI_GANTT_HEADER_HEIGHT,
                CLI_GANTT_ROW_HEIGHT,
              );

              chartHtml =
                '<div class="cli-gantt-wrap">' +
                '<div class="cli-gantt-scale">' +
                axisHtml +
                "</div>" +
                '<div class="cli-gantt">' +
                rowsHtml +
                "</div>" +
                '<div class="cli-gantt-grid-overlay">' +
                dividersHtml +
                hLinesHtml +
                "</div>" +
                "</div>";
            }

            var containsProgramme = Boolean(axisHtml || rowsHtml);

            var orientationClass = containsProgramme
              ? "cli-page-portrait"
              : "cli-page-landscape";

            var runningHeaderHtml = "";

            if (pageIndex > 0) {
              runningHeaderHtml = clientReportRunningHeaderHtml(
                containsProgramme
                  ? "Active Package Program"
                  : "Package Breakdown",
              );
            }

            return (
              '<div class="cli-export-root cli-preview-page ' +
              orientationClass +
              '">' +
              runningHeaderHtml +
              titleHtml +
              chartHtml +
              afterChartHtml +
              "</div>"
            );
          })
          .join("");
      }

      function buildClientReportBlocks(data, assessed, title) {
        var blocks = [
          { type: "header", html: clientReportHeaderHtml(data, title) },
        ];

        blocks = blocks.concat(buildClientGanttBlocks(assessed || []));

        blocks = blocks.concat(
          buildClientPackageBreakdownBlocks(assessed || []),
        );

        return blocks;
      }
      // ============================================================
      // 16. CLIENT PREVIEW & EDITING STATE
      // ============================================================
      function renderClientReportPreview() {
        var container = document.getElementById("clientReportPreview");
        var downloadButton = document.getElementById("downloadClientPdfBtn");

        if (!container) return;

        if (!window.__lastReportData) {
          container.innerHTML =
            '<div class="cli-export-root cli-preview-page"><div class="cli-empty" style="padding:40px;text-align:center">Upload a tracker to see the client report preview.</div></div>';

          if (downloadButton) {
            downloadButton.disabled = true;
          }

          return;
        }

        var blocks = buildClientReportBlocks(
          window.__lastReportData,
          window.__lastAssessed,
          window.__lastReportTitle,
        );

        var measuredBlocks = measureClientBlocks(blocks);
        var pages = paginateClientBlocks(measuredBlocks);

        container.innerHTML = renderClientPagesHtml(pages);

        hydrateClientRunningHeaderWordmarks();
        observeClientBreakdownTextareaSizes();

        if (downloadButton) {
          downloadButton.disabled = false;
        }
      }

      function observeClientBreakdownTextareaSizes() {
        if (breakdownTextareaResizeObserver) {
          breakdownTextareaResizeObserver.disconnect();

          breakdownTextareaResizeObserver = null;
        }

        if (typeof ResizeObserver !== "function") {
          return;
        }

        breakdownTextareaResizeObserver = new ResizeObserver(function (
          entries,
        ) {
          var heightChanged = false;

          entries.forEach(function (entry) {
            var textarea = entry.target;

            if (!textarea || !textarea.isConnected) {
              return;
            }

            var currentHeight = Math.round(
              textarea.getBoundingClientRect().height,
            );

            var previousHeight = Number(
              textarea.getAttribute("data-observed-height"),
            );

            if (!previousHeight) {
              textarea.setAttribute(
                "data-observed-height",
                String(currentHeight),
              );

              return;
            }

            if (Math.abs(currentHeight - previousHeight) < 2) {
              return;
            }

            textarea.setAttribute(
              "data-observed-height",
              String(currentHeight),
            );

            saveClientBreakdownFieldHeight(
              textarea.getAttribute("data-pkg"),
              textarea.getAttribute("data-breakdown-field"),
              currentHeight,
            );

            heightChanged = true;
          });

          if (!heightChanged) {
            return;
          }

          clearTimeout(breakdownResizeRenderTimer);

          breakdownResizeRenderTimer = setTimeout(function () {
            var previousScrollY = window.scrollY;

            renderClientReportPreview();

            requestAnimationFrame(function () {
              window.scrollTo(0, previousScrollY);
            });
          }, 80);
        });

        document
          .querySelectorAll("#clientReportPreview [data-breakdown-field]")
          .forEach(function (textarea) {
            textarea.setAttribute(
              "data-observed-height",
              String(Math.round(textarea.getBoundingClientRect().height)),
            );

            breakdownTextareaResizeObserver.observe(textarea);
          });
      }
      function measureClientLandscapeHtml(html) {
        var measured = measureClientBlocks([
          {
            type: "breakdown-measured-html",
            html: html || "",
          },
        ]);

        return measured.length ? measured[0].height : 0;
      }

      function autofitClientBreakdownFieldsForPdf() {
        document
          .querySelectorAll("#clientReportPreview [data-breakdown-field]")
          .forEach(function (textarea) {
            var field = textarea.closest(".cli-breakdown-field");

            if (!field || window.getComputedStyle(field).display === "none") {
              return;
            }

            textarea.style.height = "auto";

            var fittedHeight = Math.max(
              30,
              Math.ceil(textarea.scrollHeight + 2),
            );

            saveClientBreakdownFieldHeight(
              textarea.getAttribute("data-pkg"),
              textarea.getAttribute("data-breakdown-field"),
              fittedHeight,
            );
          });
      }

      // ============================================================
      // 17. PDF EXPORT
      // ============================================================
      async function exportRenderedReportPdf(config) {
        var button = config.button;
        var pages = config.pages;

        if (!pages.length) {
          alert(config.noPagesMessage);
          return;
        }

        if (typeof window.html2canvas !== "function") {
          alert(
            "html2canvas did not load. Check your internet connection and refresh the page.",
          );
          return;
        }

        if (!window.jspdf || typeof window.jspdf.jsPDF !== "function") {
          alert(
            "jsPDF did not load. Check your internet connection and refresh the page.",
          );
          return;
        }

        var originalButtonText = button ? button.textContent : "Download PDF";

        if (button) {
          button.disabled = true;
          button.textContent = "Preparing PDF...";
        }

        try {
          if (document.fonts && document.fonts.ready) {
            await document.fonts.ready;
          }

          var jsPDF = window.jspdf.jsPDF;

          var firstPageIsLandscape =
            pages[0].classList.contains("cli-page-landscape");

          var pdf = new jsPDF({
            orientation: firstPageIsLandscape ? "landscape" : "portrait",
            unit: "mm",
            format: "a4",
            compress: true,
          });

          for (var pageIndex = 0; pageIndex < pages.length; pageIndex++) {
            var page = pages[pageIndex];

            var isLandscape = page.classList.contains("cli-page-landscape");
            var orientation = isLandscape ? "landscape" : "portrait";

            var canvasWidth = isLandscape
              ? CLI_LANDSCAPE_PAGE_WIDTH
              : CLI_PORTRAIT_PAGE_WIDTH;

            var canvasHeight = isLandscape
              ? CLI_LANDSCAPE_PAGE_HEIGHT
              : CLI_PORTRAIT_PAGE_HEIGHT;

            var pdfWidth = isLandscape ? 297 : 210;
            var pdfHeight = isLandscape ? 210 : 297;

            page.classList.add("pdf-capture");

            try {
              var canvas = await window.html2canvas(page, {
                scale: 2,
                useCORS: true,
                backgroundColor: "#ffffff",
                logging: false,
                width: canvasWidth,
                height: canvasHeight,
                windowWidth: canvasWidth,
                windowHeight: canvasHeight,
              });

              if (pageIndex > 0) {
                pdf.addPage("a4", orientation);
              }

              var pageImage = canvas.toDataURL("image/jpeg", 0.96);

              pdf.addImage(
                pageImage,
                "JPEG",
                0,
                0,
                pdfWidth,
                pdfHeight,
                undefined,
                "FAST",
              );
            } finally {
              page.classList.remove("pdf-capture");
            }
          }

          var reportTitle = String(
            window.__lastReportTitle || config.defaultTitle,
          )
            .trim()
            .replace(/[<>:"/\\|?*\u0000-\u001f]/g, "-")
            .replace(/\s+/g, " ");

          pdf.save(reportTitle + config.filenameSuffix);
        } catch (error) {
          console.error(config.consoleErrorPrefix, error);
          alert(config.errorMessage);
        } finally {
          if (button) {
            button.disabled = false;
            button.textContent = originalButtonText;
          }
        }
      }
