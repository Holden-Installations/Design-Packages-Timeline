    <style>
      /* ============================================================
         01. TOKENS & BASE
         ============================================================ */
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --red: #d02929;
        --red-bg: #ffebee;
        --red-border: #ffcdd2;
        --amber: #e65100;
        --amber-bg: #fff3e0;
        --amber-border: #ffe0b2;
        --green: #2e7d32;
        --green-bg: #e8f5e9;
        --green-border: #c8e6c9;
        --navy: #071827;
        --brand-blue: #6dddfc;
        --text: #1a1a2e;
        --text2: #4a5568;
        --text3: #4a5568;
        --border: #b9d2ec;
        --bg: linear-gradient(
          180deg,
          #ffffff 0%,
          #fdfefe 30%,
          #fbfdfe 55%,
          #f8fcfd 78%,
          color-mix(in srgb, var(--brand-blue) 18%, white) 100%
        );
        --orange: var(--amber);
        --orange-bg: #f8ddc9;
        --orange-border: var(--amber-border);
        --yellow: #fbc02d;
        --yellow-bg: #fff8e1;
        --yellow-border: #ffe8a3;
        --yellow-text: #071827;
        --yellow-ink: #8a5a00;

        --red-shade: #a91f1f;
        --orange-shade: #c84500;
        --yellow-shade: #f9a825;
        --green-shade: #246728;

        --grad-red: linear-gradient(135deg, var(--red), var(--red-shade));
        --grad-orange: linear-gradient(
          135deg,
          var(--amber),
          var(--orange-shade)
        );
        --grad-yellow: linear-gradient(
          135deg,
          var(--yellow),
          var(--yellow-shade)
        );
        --grad-green: linear-gradient(135deg, var(--green), var(--green-shade));

        interpolate-size: allow-keywords;
      }
      body {
        font-family: "Inter";
        color: var(--text);
        font-size: 13px;
        line-height: 1.5;
        background: transparent;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        background: var(--bg);
        pointer-events: none;
      }
      /* ============================================================
         02. APPLICATION SHELL
         ============================================================ */
      .hdr {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1000;

        background: #061523;
        padding: 14px 30px;
        display: grid;
        grid-template-columns: 250px minmax(360px, 1fr) 250px;
        align-items: center;
        gap: 24px;
        box-shadow: 0 4px 18px rgba(7, 24, 39, 0.28);
        min-height: 82px;
        width: 100%;
      }

      html {
        scrollbar-width: thin;
        scrollbar-color: rgba(7, 24, 39, 0.18) transparent;
      }

      ::-webkit-scrollbar {
        width: 11px;
        height: 11px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background-color: rgba(7, 24, 39, 0.18);
        background-clip: padding-box;
        border: 3px solid transparent;
        border-radius: 999px;
        transition: background-color 0.15s ease;
      }

      ::-webkit-scrollbar-thumb:hover {
        background-color: rgba(7, 24, 39, 0.32);
        background-clip: padding-box;
      }

      .logo {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-width: 0;
        text-align: center;
      }

      .logo > div {
        text-align: center;
      }

      .ln {
        font-size: 15px;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: 0.01em;
        line-height: 1.1;
      }

      .ls {
        font-size: 10px;
        font-weight: 650;
        color: rgba(255, 255, 255, 0.66);
        margin-top: 4px;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }

      .proj-info {
        text-align: center;
        color: white;
        line-height: 1.35;
        min-width: 0;
      }

      .proj-title {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.005em;
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .proj-details {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 8px;
        font-size: 10px;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.88);
      }

      .proj-details span {
        white-space: nowrap;
      }

      .hdr.report-loaded {
        grid-template-columns: auto minmax(0, 1fr) 250px;
      }

      .hdr.report-loaded .proj-info {
        justify-self: start;
        text-align: left;
      }

      .hdr.report-loaded .proj-details {
        justify-content: flex-start;
      }

      .hdr-actions {
        display: flex;
        grid-column: 3;
        grid-row: 1;
        justify-content: flex-end;
        gap: 8px;
        align-items: center;
        min-width: 0;
      }

      .hdr-uploadhide {
        display: none;
      }

      .btn {
        padding: 8px 13px;
        border-radius: 10px;
        font-size: 10px;
        font-family: "Inter";
        font-weight: 800;
        cursor: pointer;
        border: 1px solid rgba(255, 255, 255, 0.22);
        background: rgba(255, 255, 255, 0.07);
        color: #000000;
        transition:
          background 0.12s ease,
          border-color 0.12s ease,
          transform 0.12s ease,
          box-shadow 0.12s ease;
        white-space: nowrap;
      }

      .btn:hover {
        background: rgba(255, 255, 255, 0.13);
        border-color: rgba(255, 255, 255, 0.34);
        transform: translateY(-1px);
      }
      .btnp {
        background: var(--navy) !important;
        border-color: var(--navy) !important;
        color: #000000 !important;
        font-weight: 700 !important;
      }

      .hdr .btnp {
        background: var(--brand-blue) !important;
        border-color: var(--brand-blue) !important;
        color: #000000 !important;
        box-shadow: 0 2px 8px rgba(0, 153, 225, 0.25);
      }

      @media (max-width: 900px) {
        .hdr {
          grid-template-columns: 1fr;
          gap: 12px;
          padding: 14px 18px;
          text-align: center;
        }

        .hdr.report-loaded {
          grid-template-columns: 1fr;
        }

        .logo {
          justify-content: center;
        }

        .hdr-actions {
          grid-column: 1;
          grid-row: auto;
          justify-content: center;
          flex-wrap: wrap;
        }

        .proj-title {
          white-space: normal;
        }

        .hdr.report-loaded .proj-info {
          justify-self: center;
          text-align: center;
        }

        .hdr.report-loaded .proj-details {
          justify-content: center;
        }
      }
      /* ============================================================
         03. UPLOAD & REPORT NAVIGATION
         ============================================================ */
      .up-wrap {
        display: flex;
        align-items: center;
        justify-content: center;

        height: 100vh;
        padding: 106px 24px 24px;
        overflow: hidden;
      }
      .up-card {
        border: 1.5px solid var(--border);
        border-radius: 20px;
        padding: 40px 32px;
        text-align: center;
        background: #fff;
        max-width: 440px;
        width: 100%;
        box-shadow: 0 8px 28px rgba(7, 24, 39, 0.08);
        transition:
          border-color 0.15s ease,
          background-color 0.15s ease,
          box-shadow 0.15s ease;
      }
      .up-card:hover,
      .up-card.drag {
        border-color: var(--brand-blue);
        background: rgba(0, 153, 225, 0.05);
        box-shadow: 0 10px 32px rgba(0, 153, 225, 0.16);
      }

      .up-card .btnp {
        background: var(--navy) !important;
        border-color: var(--navy) !important;
        color: #fff !important;
        padding: 11px 24px !important;
        font-size: 12px !important;
        border-radius: 50px !important;
      }
      .up-icon {
        width: 52px;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 16px;
        border-radius: 15px;
        background: var(--brand-blue);
        color: #fff;
        box-shadow: 0 4px 12px rgba(0, 153, 225, 0.3);
      }
      .up-icon svg {
        width: 24px;
        height: 24px;
      }

        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .cli-breakdown-revision-cell,
      .cli-breakdown-approval-status-cell,
      .cli-breakdown-owner-cell,
      .cli-breakdown-due-cell,
      .cli-breakdown-status-cell {
        justify-content: center;
        text-align: center;
      }

      .cli-breakdown-revision-cell,
      .cli-breakdown-approval-status-cell {
        color: var(--navy);
        font-weight: 800;
        white-space: nowrap;
      }

      .cli-breakdown-due-cell {
        color: var(--navy);
        font-weight: 700;
        white-space: nowrap;
      }

      .cli-breakdown-problem-status {
        padding: 2px 5px;
        border: 1px solid;
        border-radius: 999px;
        line-height: 1.1;
      }

      .cli-breakdown-problem-status.red {
        color: var(--red);
        background: var(--red-bg);
        border-color: var(--red-border);
      }

      .cli-breakdown-problem-status.orange {
        color: var(--orange);
        background: var(--orange-bg);
        border-color: var(--orange-border);
      }

      .cli-breakdown-problem-status.neutral {
        color: #475569;
        background: #f1f5f9;
        border-color: #cbd5e1;
      }

      .cli-breakdown-no-problems {
        padding: 7px 8px;
        border: 1px dashed var(--border);
        border-radius: 5px;
        background: #f8fafc;
        color: var(--text3);
        font-size: 8px;
      }

      .cli-gantt-legend {
        display: grid;
        grid-template-columns:
          calc(
            var(--cli-gantt-side-padding, 14px) +
              var(--cli-gantt-name-column, 236px)
          )
          minmax(0, 1fr);
        align-items: center;
        gap: 0;
        margin: 0 0 8px;
        font-size: 9px;
        font-weight: 700;
        color: var(--text2);
      }

      .cli-gantt-status-legend {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 4px 8px;
        padding: 0 12px 0 14px;
      }

      .cli-gantt-timeline-legend {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 14px;
        padding-right: 14px;
      }

      .cli-gantt-status-item {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-width: 0;
        white-space: nowrap;
      }

      .cli-gantt-status-swatch {
        display: inline-block;
        width: 10px;
        height: 10px;
        border: 1px solid;
        border-radius: 2px;
        flex: 0 0 auto;
      }

      .cli-gantt-status-swatch.green {
        background: #d9eddb;
        border-color: var(--green);
      }

      .cli-gantt-status-swatch.yellow {
        background: #f9edb8;
        border-color: var(--yellow-shade);
      }

      .cli-gantt-status-swatch.orange {
        background: var(--orange-bg);
        border-color: var(--orange);
      }

      .cli-gantt-status-swatch.red {
        background: #f6d6d8;
        border-color: var(--red);
      }

      .cli-gantt-legend-item {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }

      .cli-gantt-legend-bar {
        display: inline-block;
        width: 24px;
        height: 6px;
        border: 0;
        border-radius: 1px;
        box-sizing: border-box;
      }

      .cli-gantt-legend-bar.baseline {
        background: var(--green);
      }

      .cli-gantt-legend-bar.actual {
        background: #1565c0;
      }

      .cli-gantt-legend-bar.remaining {
        background: #cbd5e1;
      }

      .cli-gantt-legend-diamond {
        display: inline-block;
        width: 9px;
        height: 9px;
        margin: 0 7px;
        background: var(--navy);
        border: 1px solid #ffffff;
        border-radius: 1px;
        transform: rotate(45deg);
        box-shadow: 0 0 0 1px rgba(7, 24, 39, 0.18);
        flex-shrink: 0;
      }

      .cli-gantt-legend-diamond.critical-order {
        background: var(--red);
        box-shadow: 0 0 0 1px rgba(198, 40, 40, 0.22);
      }
      .cli-empty {
        padding: 12px 14px;
        font-size: 11px;
        color: var(--text3);
        background: #ffffff;
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .cli-gantt {
        overflow: hidden;
        background: #ffffff;
      }

      .cli-gantt-row {
        display: grid;
        grid-template-columns: var(--cli-gantt-name-column) minmax(0, 1fr);
        gap: 0;
        height: var(--cli-gantt-row-height);
        padding: 0 var(--cli-gantt-side-padding);
        align-items: stretch;
        border-bottom: 1px solid var(--cli-gantt-grid-colour);
      }

      .cli-gantt-row:last-child {
        border-bottom: none;
      }

      .cli-gantt-name {
        position: relative;
        display: flex;
        align-items: center;
        min-width: 0;
        padding: 0 12px;
        border-right: 1px solid var(--cli-gantt-grid-colour);
        background: var(--package-status-bg, #ffffff);
        font-size: 8px;
        font-weight: 800;
        color: var(--navy);
        line-height: 1.35;
        overflow: visible;
      }

      .cli-gantt-name::before {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        right: 100%;
        width: var(--cli-gantt-side-padding);
        background: var(--package-status-bg, #ffffff);
      }

      .cli-gantt-name.status-red {
        --package-status-bg: #f6d6d8;
        color: #8f1f24;
      }

      .cli-gantt-name.status-orange {
        --package-status-bg: var(--orange-bg);
        color: #9a3d00;
      }

      .cli-gantt-name.status-yellow {
        --package-status-bg: #f9edb8;
        color: #715000;
      }

      .cli-gantt-name.status-green {
        --package-status-bg: #d9eddb;
        color: #245f29;
      }
      .cli-gantt-chart {
        min-width: 0;
        height: 100%;
      }
      .cli-gantt-scale {
        overflow: hidden;
        background: #f8fafc;
      }

      .cli-gantt.continued-top {
        border-radius: 0;
      }

      .cli-gantt-scale-row {
        display: grid;
        grid-template-columns: var(--cli-gantt-name-column) minmax(0, 1fr);
        gap: 0;
        height: var(--cli-gantt-header-height);
        padding: 0 var(--cli-gantt-side-padding);
        align-items: stretch;
        border-bottom: 1px solid var(--cli-gantt-grid-colour);
      }

      .cli-gantt-scale-label {
        display: flex;
        align-items: center;
        min-width: 0;
        padding: 0 12px;
        border-right: 1px solid var(--cli-gantt-grid-colour);
        font-size: 9px;
        font-weight: 800;
        color: var(--text3);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .cli-gantt-scale-track {
        position: relative;
        height: 100%;
        min-width: 0;
        background: #f8fafc;
      }
      .cli-gantt-scale-band {
        position: absolute;
        top: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 9px;
        font-weight: 800;
        color: var(--navy);
        overflow: hidden;
      }
      .cli-gantt-track {
        position: relative;
        width: 100%;
        height: 100%;
        min-width: 0;
        background: #ffffff;
      }

      .cli-gantt-wrap {
        --cli-gantt-name-column: 236px;
        --cli-gantt-side-padding: 14px;
        --cli-gantt-header-height: 26px;
        --cli-gantt-row-height: 26px;
        --cli-gantt-grid-colour: rgba(7, 24, 39, 0.18);

        position: relative;
        margin-top: 16px;
        overflow: visible;
        border: 1px solid var(--cli-gantt-grid-colour);
        background: #ffffff;
      }

      .cli-gantt-grid-overlay {
        position: absolute;
        top: 0;
        bottom: 0;
        left: calc(
          var(--cli-gantt-side-padding) + var(--cli-gantt-name-column)
        );
        right: var(--cli-gantt-side-padding);
        pointer-events: none;
      }

      .cli-gantt-hline {
        display: none;
      }
      .cli-gantt-divider {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 1px;
        background: rgba(7, 24, 39, 0.18);
        z-index: 2;
      }

      .cli-gantt-today-line {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 1px;
        background: var(--brand-blue);
        transform: translateX(-0.5px);
        z-index: 5;
        overflow: visible;
      }

      .cli-gantt-today-line::before {
        content: "Today";
        position: absolute;
        top: -16px;
        left: 50%;
        transform: translateX(-50%);
        padding: 2px 4px;
        border-radius: 3px;
        background: var(--brand-blue);
        color: #ffffff;
        font-size: 7px;
        font-weight: 800;
        line-height: 1;
        white-space: nowrap;
      }

      .cli-gantt-today-line::after {
        content: "";
        position: absolute;
        left: 50%;
        top: -8px;
        width: 1px;
        height: 8px;
        background: var(--brand-blue);
        transform: translateX(-50%);
      }
      .cli-gantt-bar {
        position: absolute;
        height: 6px;
        min-height: 6px;
        max-height: 6px;
        border: 0;
        border-radius: 1px;
        box-sizing: border-box;
        z-index: 1;
      }

      .cli-gantt-bar.baseline {
        top: 2px;
        background: var(--green);
      }

      .cli-gantt-bar.actual {
        top: 10px;
        background: #1565c0;
      }

      .cli-gantt-bar.remaining {
        top: 18px;
        background: #cbd5e1;
      }

      .cli-gantt-diamond {
        position: absolute;
        top: 50%;
        width: 10px;
        height: 10px;
        background: var(--navy);
        border: 1px solid #ffffff;
        border-radius: 2px;
        transform: translate(-50%, -50%) rotate(45deg);
        box-shadow: 0 0 0 1px rgba(7, 24, 39, 0.15);
        z-index: 3;
      }

      .cli-gantt-diamond.crit-calloff {
        background: var(--red);
        box-shadow: 0 0 0 1px rgba(198, 40, 40, 0.22);
      }
      /* ============================================================
         06. PROJECT REPORT
         ============================================================ */
      .sum-strip {
        padding: 16px;
        display: flex;
        gap: 16px;
      }

      .sum-card {
        margin-top: 80px;
        border-radius: 8px;
        padding: 8px 12px;
        display: flex;
        flex: 1 1 0;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 2px;
        border: 1px solid transparent;
        box-shadow: 0 3px 10px rgba(7, 24, 39, 0.1);
        min-height: 48px;
      }

      .sum-card.red {
        background: var(--grad-red);
        border-color: var(--red-shade);
      }

      .sum-card.orange {
        background: var(--grad-orange);
        border-color: var(--orange-shade);
      }

      .sum-card.yellow {
        background: var(--grad-yellow);
        border-color: var(--yellow-shade);
      }

      .sum-card.green {
        background: var(--grad-green);
        border-color: var(--green-shade);
      }

      .sum-num {
        font-size: 22px;
        font-weight: 700;
        line-height: 1;
        flex-shrink: 0;
        color: #fff !important;
        letter-spacing: -0.03em;
      }

      .sum-num.red,
      .sum-num.orange,
      .sum-num.green {
        color: #fff !important;
      }

      .sum-num.yellow {
        color: var(--yellow-text) !important;
      }
      .sum-lbl {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: rgba(255, 255, 255, 0.92) !important;
      }

      .sum-lbl.red,
      .sum-lbl.orange,
      .sum-lbl.green {
        color: rgba(255, 255, 255, 0.92) !important;
      }

      .sum-lbl.yellow {
        color: var(--yellow-text) !important;
      }

      .sum-card.yellow .sum-trend {
        color: var(--yellow-text) !important;
        background: rgba(7, 24, 39, 0.1);
      }

      .sum-trend {
        display: inline-block;
        font-size: 10px;
        font-weight: 600;
        white-space: nowrap;
        color: rgba(255, 255, 255, 0.82);
        background: rgba(255, 255, 255, 0.13);
        padding: 2px 6px;
        border-radius: 999px;
      }

      .sum-trend.bad,
      .sum-trend.good,
      .sum-trend.neutral {
        color: rgba(255, 255, 255, 0.88);
      }
      .main {
        padding: 6px 28px 40px;
      }
      .area-label {
        font-size: 20px;
        font-weight: 800;
        color: var(--navy);
        letter-spacing: -0.01em;
        margin: 40px 0 18px;
      }
      .main > .area-label:first-child {
        margin-top: 8px;
      }
      .sec-hdr {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 16px;
        cursor: pointer;
        user-select: none;
        border: 0;
        border-bottom: 1px solid rgba(7, 24, 39, 0.12);

        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.8),
          0 2px 5px rgba(7, 24, 39, 0.06);
      }
      .sec-title {
        font-size: 12px;
        font-weight: 600;
        flex: 1;
      }
      .sec-title.red {
        color: var(--red);
      }
      .sec-title.orange {
        color: var(--orange);
      }
      .sec-title.yellow {
        color: var(--yellow-text);
      }

      .sec-title.green {
        color: var(--green);
      }
      .sec-badge {
        font-size: 10px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 10px;
        color: #fff;
      }
      .sec-badge.red {
        background: var(--red);
      }
      .sec-badge.orange {
        background: var(--orange);
      }
      .sec-badge.yellow {
        background: var(--yellow);
        color: var(--yellow-text);
      }

      .sec-badge.green {
        background: var(--green);
      }
      .sec-chev {
        font-size: 10px;
        color: var(--text3);
        transition: transform 0.2s;
        flex-shrink: 0;
      }
      .sec-chev.open {
        transform: rotate(180deg);
      }
      .sec-body {
        display: none;
        background: #fff;
        border: 1px solid var(--border);
        border-top: none;
        border-radius: 0 0 10px 10px;
      }
      .sec-body.open {
        display: flow-root;
      }
      .pkg-name {
        font-weight: 800;
      }
      .pkg-row {
        display: grid;
        grid-template-columns: 200px 1fr 24px;
        gap: 10px;
        margin: 0;
        padding: 3px 14px;
        align-items: center;
        border-bottom: 0;
        cursor: pointer;
        background: #fff;
        transition: background 0.12s ease;
      }

      .pkg-warn {
        display: inline-block;
        margin-top: 5px;
        padding: 3px 8px;
        border: 1px solid var(--red-shade) !important;
        border-radius: 999px;
        background: var(--red) !important;
        color: #ffffff !important;
        font-size: 10px;
        font-weight: 800;
        line-height: 1.5;
      }
      .rfi-badge {
        display: inline-block;
        margin-top: 2px;
        padding: 3px 8px;
        border: 1px solid var(--orange-shade) !important;
        border-radius: 999px;
        background: var(--orange) !important;
        color: #ffffff !important;
        font-size: 10px;
        font-weight: 800;
      }
      .ordered-risk-badge {
        display: inline-flex;
        align-items: center;
        width: fit-content;
        margin-top: 4px;
        padding: 3px 8px;
        border: 1px solid var(--orange-shade);
        border-radius: 999px;
        background: var(--orange);
        color: #ffffff;
        font-size: 9px;
        font-weight: 800;
        line-height: 1.2;
        text-transform: uppercase;
        letter-spacing: 0.035em;
        white-space: nowrap;
      }

      .pkg-chev {
        font-size: 11px;
        color: var(--text3);
        transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
        text-align: center;
      }
      .pkg-chev.open {
        transform: rotate(180deg);
      }
      .tl-wrap {
        display: flex;
        flex-direction: column;
        gap: 0;
        position: relative;
        top: 2px;
      }
      .tl-bar-pair {
        display: flex;
        flex-direction: column;
        gap: 2px;
        position: relative;
      }

      .tl-hover-indicator {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 0;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.1s ease;
        z-index: 4;
      }

      .tl-hover-indicator.show {
        opacity: 1;
      }

      .tl-hover-line {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 1px;
        background: var(--navy);
        opacity: 0.55;
      }

      .tl-hover-label {
        position: absolute;
        bottom: 100%;
        left: 0;
        transform: translateX(-50%);
        margin-bottom: 4px;
        padding: 2px 5px;
        border-radius: 4px;
        background: #fff;
        border: 1px solid var(--border);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
        color: var(--navy);
        font-size: 9px;
        font-weight: 700;
        line-height: 1;
        white-space: nowrap;
      }

      .tl-hover-label--start {
        transform: translateX(0);
      }

      .tl-hover-label--end {
        transform: translateX(-100%);
      }

      .tl-zones {
        display: flex;
        height: 14px;
        border-radius: 7px;
        overflow: hidden;
        border: 1px solid var(--border);
      }
      .tl-zones.scaled {
        display: block;
        position: relative;
        background: #e8edf2;
        border: 0;
        box-shadow: inset 0 0 0 1px var(--border);
        transition: clip-path 1.1s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .tl-zones.scaled .tl-z-green,
      .tl-zones.scaled .tl-z-orange,
      .tl-zones.scaled .tl-z-red {
        position: absolute;
        top: 0;
      }
      .tl-z-green {
        height: 100%;
        background: #81c784;
      }
      .tl-z-orange {
        height: 100%;
        background: #ffb74d;
      }
      .tl-z-red {
        height: 100%;
        background: #c62828;
      }
      .tl-prog {
        position: relative;
        height: 14px;
        border-radius: 7px;
        background: #e8edf2;
        overflow: hidden;
        transition: clip-path 1.1s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .tl-done {
        position: absolute;
        top: 0;
        height: 100%;
        background: #1565c0;
      }
      .tl-remain {
        position: absolute;
        top: 0;
        height: 100%;
        background: #9ca3af;
      }
      .tl-labels {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 5px;
      }

        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 3px 8px;
        border-radius: 999px;
        font-size: 9px;
        font-weight: 800;
        line-height: 1.2;
        white-space: nowrap;
        border: 1px solid transparent;
        box-shadow: 0 1px 3px rgba(7, 24, 39, 0.08);
      }

      .tl-float-pill.green {
        background: var(--green);
        color: #ffffff;
        border-color: var(--green-shade);
      }

      .tl-float-pill.orange {
        background: var(--orange);
        color: #ffffff;
        border-color: var(--orange-shade);
      }

      .tl-float-pill.yellow {
        background: var(--yellow);
        color: #071827;
        border-color: var(--yellow-shade);
      }

      .tl-float-pill.red {
        background: var(--red);
        color: #ffffff;
        border-color: var(--red-shade);
      }

      .tl-float-pill.neutral {
        background: #e2e8f0;
        color: #334155;
        border-color: #cbd5e1;
      }
      .hover-tip {

        display: none;
        z-index: 9999;
        pointer-events: none;
        background: #1a1a2e;
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 6px;
        padding: 10px 12px;
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.22);
        font-size: 12px;
        line-height: 1.6;
        min-width: 230px;
        max-width: 300px;

      .hover-tip.show {
        display: block;

        display: none;
        background: #ffffff;
        border-top: 1px solid #dbe5ef;

      .pkg-expand.open {
        display: block;

        grid-template-columns: repeat(6, 1fr);
        gap: 12px;
        padding: 16px 18px 18px;

      .del-hdr {
        font-size: 9.5px;
        font-weight: 700;
        color: var(--navy);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        text-align: center;
        margin-bottom: 7px;
      }
      .dc {

        padding: 11px 12px;
        border: 1px solid #eef2f6;
        background: #fbfcfe;
        overflow: hidden;
        box-shadow: 0 1px 3px rgba(7, 24, 39, 0.06);
        transition:
          transform 0.18s cubic-bezier(0.16, 1, 0.3, 1),
          box-shadow 0.18s cubic-bezier(0.16, 1, 0.3, 1),
          border-color 0.18s ease;

      .dc:hover {
        transform: translateY(-2px);
        box-shadow:

      .tl-mark {
        position: absolute;
        top: calc(var(--yshift, 0px) + 5px);
        transform: translateX(calc(-50% + var(--xshift, 0px)));
        text-align: center;
        white-space: nowrap;
        padding: 2px 4px;
        border-radius: 4px;
        background: #fff;
        border: 1px solid var(--border);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        opacity: 0;
        transition: opacity 0.12s ease;
        z-index: 2;
      }

      .tl-mark-label {
        display: block;
        font-size: 9px;
        font-weight: 700;
        line-height: 1;
      }

      .tl-mark-date {
        display: block;
        margin-top: 1px;
        font-size: 9px;
        font-weight: 700;
        line-height: 1;
      }

      .pkg-row:hover .tl-mark {
        opacity: 1;
      }

      .tl-mark.planned {
        color: var(--green);
        background: var(--green-bg);
        border-color: var(--green-border);
      }

      .tl-mark.planfinish {
        color: var(--green);
        background: var(--green-bg);
        border-color: var(--green-border);
      }

      .tl-mark::before {
        display: none;
      }

      .tl-mark.start {
        transform: translateX(var(--xshift, 0px));
        text-align: left;
      }

      .tl-mark.end {
        transform: translateX(calc(-100% + var(--xshift, 0px)));
        text-align: right;
      }

      .tl-mark-tail {
        position: absolute;
        bottom: 0;
        overflow: visible;
        opacity: 0;
        transition: opacity 0.12s ease;
        pointer-events: none;
        z-index: 1;
      }

      .tl-mark-tail-fill {
        fill: #fff;
        stroke: none;
      }

      .tl-mark-tail-stroke {
        fill: none;
        stroke: var(--border);
        stroke-width: 1;
        stroke-linejoin: round;
        stroke-linecap: round;
      }

      .tl-mark-tail:has(+ .tl-mark.planned) .tl-mark-tail-fill,
      .tl-mark-tail:has(+ .tl-mark.planfinish) .tl-mark-tail-fill {
        fill: var(--green-bg);
      }

      .tl-mark-tail:has(+ .tl-mark.planned) .tl-mark-tail-stroke,
      .tl-mark-tail:has(+ .tl-mark.planfinish) .tl-mark-tail-stroke {
        stroke: var(--green-border);
      }

      .tl-mark-tail:has(+ .tl-mark.crit) .tl-mark-tail-fill {
        fill: var(--orange-bg);
      }

      .tl-mark-tail:has(+ .tl-mark.crit) .tl-mark-tail-stroke {
        stroke: var(--orange-border);
      }

      .tl-mark-tail:has(+ .tl-mark.calloff) .tl-mark-tail-fill {

        color: #ffffff !important;

      .tl-zone-note {

      .tl-zone-note.late { color: #ffffff; }
      .m-load {

      /* Keep the report's background layer behind content even if anything

      body::before { z-index: -1 !important; pointer-events: none !important; }

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
      // ============================================================
      // 01. RUNTIME CONFIGURATION & APPLICATION STATE
      // ============================================================
      var TODAY = new Date();
      TODAY.setHours(0, 0, 0, 0);

      var HOLIDAY_KEYS = new Set();

      var FIRST_ISSUE_REVISION = 0;

      window.__breakdownFieldState = window.__breakdownFieldState || {};

      window.__breakdownFieldData = window.__breakdownFieldData || {};

      window.__breakdownFieldHeights = window.__breakdownFieldHeights || {};

      var CLI_PORTRAIT_PAGE_WIDTH = 794;
      var CLI_PORTRAIT_PAGE_HEIGHT = 1122;

      var CLI_LANDSCAPE_PAGE_WIDTH = 1122;
      var CLI_LANDSCAPE_PAGE_HEIGHT = 794;

      var CLI_PAGE_PADDING = 30;

      var CLI_PORTRAIT_PAGE_CONTENT_HEIGHT =
        CLI_PORTRAIT_PAGE_HEIGHT - CLI_PAGE_PADDING * 2;

      var CLI_LANDSCAPE_PAGE_CONTENT_HEIGHT =
        CLI_LANDSCAPE_PAGE_HEIGHT - CLI_PAGE_PADDING * 2;

      var CLI_PAGE_WIDTH = CLI_PORTRAIT_PAGE_WIDTH;
      var CLI_PAGE_HEIGHT = CLI_PORTRAIT_PAGE_HEIGHT;
      var CLI_PAGE_CONTENT_HEIGHT = CLI_PORTRAIT_PAGE_CONTENT_HEIGHT;
      var CLI_GANTT_HEADER_HEIGHT = 26;
      var CLI_GANTT_ROW_HEIGHT = 26;

      var CLI_FIRST_PAGE_MAX_ROWS = 30;
      var CLI_CONTINUATION_PAGE_MAX_ROWS = 32;
      var CLI_RUNNING_HEADER_HEIGHT = 42;

      var breakdownTextareaResizeObserver = null;

      var breakdownResizeRenderTimer = null;

      var DROPDOWN_GLIDE_MS = 320;
      var activeDropdownScrollToken = 0;

      var hoverTipEl = null,
        hoverTipSrc = null;

      var timelineHoverEl = null;

      var lastSpacedTimelineRow = null;

      // ============================================================
      // 02. DATE / WORKING-DAY & GENERIC UTILITIES
      // ============================================================
      function dateKey(d) {
        if (!d) return "";

        var date = new Date(d);
        date.setHours(0, 0, 0, 0);

        return (
          date.getFullYear() +
          "-" +
          String(date.getMonth() + 1).padStart(2, "0") +
          "-" +
          String(date.getDate()).padStart(2, "0")
        );
      }

      function isWorkingDay(d) {
        if (!d) return false;

        var day = d.getDay();

        return day !== 0 && day !== 6 && !HOLIDAY_KEYS.has(dateKey(d));
      }

      function toDate(v) {
        if (!v) return null;
        if (v instanceof Date) {
          var d = new Date(v);
          d.setHours(0, 0, 0, 0);
          return d;
        }
        return null;
      }
      function fmt(d) {
        return d
          ? d.toLocaleDateString("en-GB", { day: "2-digit", month: "short" })
          : null;
      }
      function fmtFull(d) {
        return d
          ? d.toLocaleDateString("en-GB", {
              day: "2-digit",
              month: "2-digit",
              year: "numeric",
            })
          : "—";
      }

      function wdays(a, b) {
        if (!a || !b) return null;

        var s = new Date(a);
        var e = new Date(b);

        s.setHours(0, 0, 0, 0);
        e.setHours(0, 0, 0, 0);

        if (s.getTime() === e.getTime()) return 0;

        var n = 0;
        var dir = s < e ? 1 : -1;
        var cur = new Date(s);

        while (true) {
          cur.setDate(cur.getDate() + dir);

          if (isWorkingDay(cur)) {
            n += dir;
          }

          if (cur.getTime() === e.getTime()) break;
          if (dir === 1 && cur > e) break;
          if (dir === -1 && cur < e) break;
        }

        return n;
      }

      function addWdays(d, n) {
        if (!d || n === null || n === undefined) return null;

        var cur = new Date(d);
        cur.setHours(0, 0, 0, 0);

        var added = 0;
        var dir = n >= 0 ? 1 : -1;
        var target = Math.abs(n);

        while (added < target) {
          cur.setDate(cur.getDate() + dir);

          if (isWorkingDay(cur)) {
            added++;
          }
        }

        return cur;
      }
      function earliestDate(dates) {
        var valid = dates.filter(function (d) {
          return d;
        });
        return valid.length
          ? valid.reduce(function (earliest, d) {
              return d < earliest ? d : earliest;
            }, valid[0])
          : null;
      }
      function itemPlannedDates(items) {
        return items
          .map(function (it) {
            return it.planned;
          })
          .filter(function (d) {
            return d;
          });
      }
      function ownItems(items) {
        return (items || []).filter(function (it) {
          return !it.sharedFromPackage;
        });
      }

      function packagePlannedStart(p) {
        var hasTs = !!(p.tsItems || []).length;
        var hasDw = !!(p.dwItems || []).length;

        var tsDwStart;
        if (hasTs && !hasDw) {
          tsDwStart = p.tsPlanned;
        } else if (hasDw && !hasTs) {
          tsDwStart = p.dwPlanned;
        } else {
          tsDwStart = earliestDate([p.dwPlanned, p.tsPlanned]);
        }

        return (
          tsDwStart ||
          earliestDate(itemPlannedDates(p.smpItems || [])) ||
          p.supplierDecision ||
          p.critIssue
        );
      }
      function packageEnteredCalloffDate(p) {
        var earliest = null;

        (p.coItems || []).forEach(function (it) {
          if (it.planned && (!earliest || it.planned < earliest)) {
            earliest = it.planned;
          }
        });

        return p.coPlanned || earliest || null;
      }

      function packagePlannedFinish(p, planStart) {
        var enteredCalloffDate = packageEnteredCalloffDate(p);

        if (enteredCalloffDate) return enteredCalloffDate;

        return planStart && p.chain ? addWdays(planStart, p.chain) : planStart;
      }

      function packagePlannedCalloff(p) {
        return packagePlannedFinish(p, packagePlannedStart(p));
      }
      function worstFloat(values) {
        var valid = values.filter(function (v) {
          return v !== null && v !== undefined;
        });

        if (!valid.length) {
          return null;
        }

        return valid.reduce(function (min, v) {
          return v < min ? v : min;
        }, valid[0]);
      }
      function laterOf(a, b) {
        if (!a) return b;
        if (!b) return a;
        return a >= b ? a : b;
      }
      function clamp(v, lo, hi) {
        return Math.max(lo, Math.min(hi, v));
      }
      function esc(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function attr(s) {
        return esc(s).replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      }

      // ============================================================
      // 03. PARSING & SHARED-DESIGN UTILITIES
      // ============================================================
      function findHdr(rows, re) {
        for (var i = 0; i < rows.length; i++) {
          var row = rows[i] || [];

          for (var c = 0; c < row.length; c++) {
            if (row[c] && re.test(String(row[c]).trim())) return i;
          }

          var rowText = row
            .map(function (v) {
              return String(v || "")
                .trim()
                .toLowerCase();
            })
            .join("|");

          if (
            rowText.indexOf("rev no.") >= 0 &&
            rowText.indexOf("package") >= 0 &&
            rowText.indexOf("planned issue date") >= 0 &&
            rowText.indexOf("date issued") >= 0
          ) {
            return i;
          }
        }

        return -1;
      }

      function findColByHeader(headerRow, headerRe, fallback) {
        if (headerRow) {
          for (var ci = 0; ci < headerRow.length; ci++) {
            if (headerRe.test(String(headerRow[ci] || "").trim())) return ci;
          }
        }
        return fallback;
      }

      function normaliseDesignToken(token) {
        var value = String(token || "")
          .toLowerCase()
          .replace(/[^a-z0-9]/g, "");

        if (value.length > 4 && /ies$/.test(value)) {
          value = value.slice(0, -3) + "y";
        } else if (
          value.length > 4 &&
          /s$/.test(value) &&
          !/(?:ss|us)$/.test(value)
        ) {
          value = value.slice(0, -1);
        }

        return value;
      }

      function tokeniseDesignText(text) {
        var ignored = {
          package: true,
          work: true,
          install: true,
          installation: true,
          installed: true,
          supply: true,
          supplied: true,
          system: true,
          scope: true,
          subcontract: true,
          subcontractor: true,
          procurement: true,
          calloff: true,
          call: true,
          off: true,
          data: true,
          hall: true,
          dh: true,
          zone: true,
          area: true,
          level: true,
          floor: true,
          phase: true,
          block: true,
          sector: true,
          room: true,
          north: true,
          south: true,
          east: true,
          west: true,
          upper: true,
          lower: true,
          ground: true,
          mezzanine: true,
          drawing: true,
          document: true,
          technical: true,
          tech: true,
          submission: true,
          calculation: true,
          sample: true,
          initial: true,
          issue: true,
          revision: true,
          rev: true,
        };

        var seen = {};

        String(text || "")
          .replace(/([a-z])([0-9])/gi, "$1 $2")
          .replace(/([0-9])([a-z])/gi, "$1 $2")
          .split(/[^a-z0-9]+/i)
          .forEach(function (raw) {
            var token = normaliseDesignToken(raw);

            if (
              !token ||
              token.length < 2 ||
              /^\d+$/.test(token) ||
              ignored[token]
            ) {
              return;
            }

            seen[token] = true;
          });

        return Object.keys(seen).sort();
      }

      function packageNameDesignTokens(p) {
        return tokeniseDesignText(p.name || "");
      }

      function extractPackageLevel(name) {
        var match = String(name || "").match(
          /\bL(?:evel\s*)?(\d+(?:\.\d+)?)\b/i,
        );

        return match ? "L" + match[1] : null;
      }

      function streamSignature(items) {
        return (items || [])
          .map(function (it) {
            return String(it.ref || it.title || "")
              .trim()
              .toLowerCase();
          })
          .filter(Boolean)
          .sort()
          .join("|");
      }

      // ============================================================
      // 04. SHARED DESIGN RESOLUTION
      // ============================================================
      function resolveSharedDesignLinks(data) {
        var packages = Object.values(data.pkgs || {});
        var streams = ["tsItems", "dwItems", "calcItems", "smpItems"];
        var plannedFields = {
          tsItems: "tsPlanned",
          dwItems: "dwPlanned",
        };
        var families = {};

        packages.forEach(function (p) {
          var key = packageNameDesignTokens(p).join("|");
          if (!key) return;

          var level = extractPackageLevel(p.name);

          if (level) {
            key += "|level:" + level;
          }

          if (!families[key]) families[key] = [];
          families[key].push(p);
        });

        Object.values(families).forEach(function (family) {
          if (family.length < 2) return;

          streams.forEach(function (stream) {
            var sources = family.filter(function (p) {
              return (p[stream] || []).length > 0;
            });

            if (!sources.length) return;

            var signatures = Array.from(
              new Set(
                sources.map(function (p) {
                  return streamSignature(p[stream]);
                }),
              ),
            );

            // Multiple genuinely different sources = ambiguous, do not share.
            if (sources.length > 1 && signatures.length !== 1) return;

            var source = sources[0];

            family.forEach(function (target) {
              // Never overwrite an existing stream.
              if ((target[stream] || []).length) return;

              target[stream] = source[stream].map(function (item) {
                return Object.assign({}, item, {
                  sharedFromPackage: source.name,
                });
              });

              // Inherited Tech Sub / Drawing also inherits its planned date.
              var plannedField = plannedFields[stream];
              if (plannedField && source[plannedField]) {
                target[plannedField] = source[plannedField];
              }
            });
          });
        });
      }

      var PACKAGE_EXACT_ALIASES = [
        {
          source: "PH4-FOH-L0-Stud Walls",
          target: "FOH Fitout Stud Walls Ground Floor",
        },
        {
          source: "PH4-FOH-L0-Glazing",
          target: "FOH Fitout Glazing Ground Floor",
        },
        {
          source: "PH4-FOH-L0-Doors",
          target: "FOH Fitout Doors Ground Floor",
        },
        {
          source: "PH4-FOH-L0-Roller Shutter Door",
          target: "FOH Fitout Roller Shutter Door Ground Floor",
        },
        {
          source: "PH4-FOH-L0-Flooring",
          target: "FOH Fitout Flooring Ground Floor",
        },
      ];

      // ============================================================
      // 05. WORKBOOK PARSING / NORMALISATION
      // ============================================================
      function parseSheetRows(wb, sheetName) {
        var ws = wb.Sheets[sheetName];

        return ws
          ? XLSX.utils.sheet_to_json(ws, {
              header: 1,
              defval: null,
              cellDates: true,
            })
          : [];
      }

      function parseFindCell(rows, re) {
        for (var r = 0; r < rows.length; r++) {
          var row = rows[r] || [];

          for (var c = 0; c < row.length; c++) {
            if (re.test(String(row[c] || "").trim())) {
              return { row: r, col: c };
            }
          }
        }

        return null;
      }

      function parsePackageKey(v) {
        return String(v || "")
          .trim()
          .toLowerCase();
      }

      function parseAliasKey(v) {
        return String(v || "")
          .trim()
          .toLowerCase()
          .replace(/[\u2010-\u2015\u2212]/g, "-")
          .replace(/\s*-\s*/g, "-")
          .replace(/\s+/g, " ");
      }

      function parseRefKey(v) {
        return String(v == null ? "" : v)
          .trim()
          .toLowerCase();
      }

      function parseAddUnique(values, value) {
        if (values.indexOf(value) < 0) {
          values.push(value);
        }
      }

      function parsePackageCandidates(pkgLookup, value) {
        return (pkgLookup[parsePackageKey(value)] || []).slice();
      }

      function parseResolvePackage(pkgLookup, sourcePackage, details) {
        var exact = parsePackageCandidates(pkgLookup, sourcePackage);

        if (exact.length === 1) return exact[0];
        if (exact.length > 1) return null;

        var siblings = details.siblingCandidates || [];

        if (siblings.length === 1) return siblings[0];
        if (siblings.length > 1) return null;

        if (details.allowAlias) {
          var sourceKey = parseAliasKey(sourcePackage);

          for (var i = 0; i < PACKAGE_EXACT_ALIASES.length; i++) {
            if (parseAliasKey(PACKAGE_EXACT_ALIASES[i].source) !== sourceKey) {
              continue;
            }

            var alias = parsePackageCandidates(
              pkgLookup,
              PACKAGE_EXACT_ALIASES[i].target,
            );

            return alias.length === 1 ? alias[0] : null;
          }
        }

        if (details.allowAdjacent && !parsePackageKey(sourcePackage)) {
          var adjacent = parsePackageCandidates(
            pkgLookup,
            details.adjacentPackage,
          );

          if (adjacent.length === 1) return adjacent[0];
          if (adjacent.length > 1) return null;
        }

        return null;
      }

      function parseDropDowns(rows, data) {
        var rfiResponseDays = 5;

        var rfiSetting = parseFindCell(rows, /^rfi response time:?$/i);

        if (rfiSetting) {
          var configuredDays = rows[rfiSetting.row + 1]
            ? rows[rfiSetting.row + 1][rfiSetting.col]
            : null;

          if (
            typeof configuredDays === "number" &&
            Number.isFinite(configuredDays) &&
            configuredDays >= 0
          ) {
            rfiResponseDays = Math.round(configuredDays);
          }
        }

        var holiday = parseFindCell(rows, /^holidays?$/i);

        if (holiday) {
          for (var i = holiday.row + 1; i < rows.length; i++) {
            var holidayDate = toDate(rows[i] ? rows[i][holiday.col] : null);

            if (holidayDate) {
              HOLIDAY_KEYS.add(dateKey(holidayDate));
            }
          }
        }

        function valueBesideLabel(re) {
          for (var r = 0; r < rows.length; r++) {
            var row = rows[r];

            if (!row) continue;

            for (var c = 0; c < row.length - 1; c++) {
              if (row[c] && re.test(String(row[c]).trim())) {
                return row[c + 1];
              }
            }
          }

          return null;
        }

        var projectName = valueBesideLabel(/^project:\s*$/i);
        var projectNumber = valueBesideLabel(/^project no:\s*$/i);
        var clientName = valueBesideLabel(/^client:\s*$/i);

        if (projectName) {
          data.projName = String(projectName);
        }

        if (projectNumber) {
          data.projNum = String(projectNumber);
        }

        if (clientName) {
          data.client = String(clientName);
        }

        return rfiResponseDays;
      }

      function parsePackages(rows, data, pkgLookup) {
        var packageCell = parseFindCell(rows, /^Package$/);

        var packageHdr = packageCell ? packageCell.row : -1;

        var header = packageHdr >= 0 ? rows[packageHdr] : null;

        var packageNameCol = findColByHeader(header, /^package$/i, 14);

        var siteCol = findColByHeader(header, /^onsite date$/i, 15);

        var leadOrderCol = findColByHeader(
          header,
          /^lead time from order$/i,
          16,
        );

        var leadDrawingCol = findColByHeader(
          header,
          /^lead time from drawing$/i,
          17,
        );

        var designDurationCol = findColByHeader(
          header,
          /^approx design period$/i,
          18,
        );

        var approvalCol = findColByHeader(header, /^approval period$/i, 19);

        var firstRevCol = findColByHeader(header, /^first rev period$/i, 20);

        var secondRevCol = findColByHeader(header, /^second rev period$/i, 21);

        var supplierDecisionCol = findColByHeader(
          header,
          /^supplier\/subcontractor decision$/i,
          22,
        );

        var techPlannedCol = findColByHeader(
          header,
          /^initial issue date tech calcs?\. and subs?\.?$/i,
          23,
        );

        var drawingPlannedCol = findColByHeader(
          header,
          /^initial issue date drawings$/i,
          24,
        );

        var calloffPlannedCol = findColByHeader(
          header,
          /^initial issue date for call off'?s$/i,
          -1,
        );

        var startRow = packageHdr >= 0 ? packageHdr + 1 : 2;
        var commercialOnly = false;

        for (var i = startRow; i < rows.length; i++) {
          var r = rows[i];

          if (!r || !r[packageNameCol]) continue;

          var pname = String(r[packageNameCol]).trim();

          if (pname.toLowerCase() === "commercial only packages") {
            commercialOnly = true;
            continue;
          }

          if (commercialOnly) {
            continue;
          }

          if (!pname || pname === "Package") {
            continue;
          }

          var site = toDate(r[siteCol]);

          var leadFromOrder = Number(r[leadOrderCol] || 0);

          var leadFromDrawing = Number(r[leadDrawingCol] || 0);

          var designDuration = Number(r[designDurationCol] || 0);

          var ap = Number(r[approvalCol] || 10);
          var fr = Number(r[firstRevCol] || 5);
          var sr = Number(r[secondRevCol] || 5);

          var supplierDecision = toDate(r[supplierDecisionCol]);

          var tsp = toDate(r[techPlannedCol]);
          var dwp = toDate(r[drawingPlannedCol]);

          var critCO = site
            ? addWdays(site, -Math.max(leadFromOrder, leadFromDrawing))
            : null;

          var chain = sr + ap + fr + ap;

          var critIssue = critCO ? addWdays(critCO, -chain) : null;

          data.pkgs[pname] = {
            name: pname,
            site: site,
            critCO: critCO,
            critIssue: critIssue,

            supplierDecision: supplierDecision,

            designStart: earliestDate([tsp, dwp]) || supplierDecision,

            designDuration: designDuration,

            leadFromOrder: leadFromOrder,
            leadFromDrawing: leadFromDrawing,

            tsPlanned: tsp,
            dwPlanned: dwp,

            coPlanned:
              calloffPlannedCol >= 0
                ? toDate(r[calloffPlannedCol]) || null
                : null,

            criticalDates: {
              techSub: critIssue,
              drawings: critIssue,
              calculations: critIssue,
              samples: critIssue,
              calloff: critCO,
            },

            approvalPeriod: ap,
            firstRevPeriod: fr,
            secondRevPeriod: sr,
            chain: chain,

            tsItems: [],
            dwItems: [],
            calcItems: [],
            smpItems: [],
            coItems: [],
            rfiItems: [],
          };

          var key = parsePackageKey(pname);

          if (!pkgLookup[key]) {
            pkgLookup[key] = [];
          }

          parseAddUnique(pkgLookup[key], pname);
        }
      }

      function parseDeliverableSheet(wb, data, pkgLookup, config) {
        var rows = parseSheetRows(wb, config.sheet);

        if (!rows.length) return;

        var hdr = findHdr(rows, config.header);

        if (hdr < 0) return;

        var header = rows[hdr];

        var flagCol = findColByHeader(header, /construction issue or not/i, 13);

        var titleCol = findColByHeader(
          header,
          /^(?:title|description|document title|document description|drawing title|calculation title|sample title)$/i,
          -1,
        );

        var siblingPackagesByRef = {};

        for (var i = hdr + 1; i < rows.length; i++) {
          var siblingRow = rows[i];

          if (!siblingRow || !siblingRow[0]) {
            continue;
          }

          if (String(siblingRow[3] || "").toLowerCase() === "deleted") {
            continue;
          }

          if (String(siblingRow[11] || "").toLowerCase() === "deleted") {
            continue;
          }

          var ref = parseRefKey(siblingRow[0]);

          var exact = parsePackageCandidates(
            pkgLookup,
            siblingRow[config.pkgCol],
          );

          if (!ref || exact.length !== 1) {
            continue;
          }

          if (!siblingPackagesByRef[ref]) {
            siblingPackagesByRef[ref] = [];
          }

          parseAddUnique(siblingPackagesByRef[ref], exact[0]);
        }

        for (var i = hdr + 1; i < rows.length; i++) {
          var r = rows[i];

          if (!r || !r[0]) continue;

          var pkg = parseResolvePackage(pkgLookup, r[config.pkgCol], {
            siblingCandidates: siblingPackagesByRef[parseRefKey(r[0])] || [],
          });

          if (!pkg || !data.pkgs[pkg]) {
            continue;
          }

          if (String(r[3] || "").toLowerCase() === "deleted") {
            continue;
          }

          if (String(r[11] || "").toLowerCase() === "deleted") {
            continue;
          }

          data.pkgs[pkg][config.store].push({
            ref: String(r[0]),

            title: titleCol >= 0 ? String(r[titleCol] || "") : "",

            rev: Number(r[1] || 0),

            rc: String(r[2] || ""),

            planned:
              toDate(r[7]) ||
              (config.plannedField
                ? data.pkgs[pkg][config.plannedField] || null
                : null),

            issued: toDate(r[8]),
            cmtsBy: toDate(r[9]),
            cmtsRec: toDate(r[10]),

            statusRec: String(r[11] || ""),

            constructionIssued: toDate(r[12]),

            constructionFlag: r[flagCol],

            itemType: String(r[14] || ""),

            nextRevPlanned: toDate(r[19]),
          });
        }

        var historyByRef = {};

        Object.values(data.pkgs).forEach(function (pkg) {
          (pkg[config.store] || []).forEach(function (item) {
            var key = parseRefKey(item.ref);

            if (!key) return;

            if (!historyByRef[key]) {
              historyByRef[key] = [];
            }

            historyByRef[key].push(item);
          });
        });

        Object.keys(historyByRef).forEach(function (key) {
          var items = historyByRef[key].slice().sort(function (a, b) {
            return Number(a.rev || 0) - Number(b.rev || 0);
          });

          var history = items.map(function (item) {
            return {
              rev: item.rev,
              rc: item.rc,
              planned: item.planned,
              statusRec: item.statusRec,
              issued: item.issued,
              cmtsRec: item.cmtsRec,
              constructionIssued: item.constructionIssued,
            };
          });

          items.forEach(function (item) {
            item.revisionHistory = history;
          });
        });
      }

      function parseDeliverables(wb, data, pkgLookup) {
        [
          ["Tech Subs", /document no/i, "tsItems", "tsPlanned"],
          ["Drawings", /drawing no/i, "dwItems", "dwPlanned"],
          ["Calculations", /calculation no/i, "calcItems", "tsPlanned"],
          ["Samples", /sample no/i, "smpItems", null],
        ].forEach(function (config) {
          parseDeliverableSheet(wb, data, pkgLookup, {
            sheet: config[0],
            header: config[1],
            pkgCol: 4,
            store: config[2],
            plannedField: config[3],
          });
        });
      }

      function parseCallOffs(wb, data, pkgLookup) {
        var sheetName =
          wb.SheetNames.find(function (n) {
            return /call off/i.test(n);
          }) || "Call Off's";

        var rows = parseSheetRows(wb, sheetName);

        var hdr = findHdr(rows, /call off no/i);

        if (hdr < 0) return;

        for (var i = hdr + 1; i < rows.length; i++) {
          var r = rows[i];

          if (!r || !r[0]) continue;

          var pkg = parseResolvePackage(pkgLookup, r[3], {});

          if (!pkg || !data.pkgs[pkg]) {
            continue;
          }

          data.pkgs[pkg].coItems.push({
            ref: String(r[0]),
            title: String(r[4] || ""),
            planned: toDate(r[5]),
            issued: toDate(r[6]),
          });
        }
      }

      function parseRFIs(wb, data, pkgLookup, rfiResponseDays) {
        var sheetName = wb.SheetNames.find(function (n) {
          return /^rfi'?s?$/i.test(n.trim());
        });

        if (!sheetName) return;

        var rows = parseSheetRows(wb, sheetName);

        var headerCell = parseFindCell(rows, /^rfi\s*no\.?$/i);

        if (!headerCell) return;

        var hdr = headerCell.row;

        var header = rows[hdr];

        var noCol = findColByHeader(header, /^rfi\s*no\.?$/i, 0);

        var statusCol = findColByHeader(header, /^status$/i, 1);

        var pkgCol = findColByHeader(header, /^package$/i, 2);

        var transmittalCol = findColByHeader(header, /^transmittal no\.?$/i, 3);

        var titleCol = findColByHeader(header, /^title$/i, 4);

        var issuedCol = findColByHeader(header, /^date issued$/i, 5);

        var requiredCol = findColByHeader(
          header,
          /^date response required$/i,
          6,
        );

        var receivedCol = findColByHeader(
          header,
          /^date response received$/i,
          7,
        );

        var typeCol = findColByHeader(header, /^type$/i, 9);

        for (var i = hdr + 1; i < rows.length; i++) {
          var r = rows[i];

          if (!r) continue;

          var rfiNo = r[noCol];

          var pkgValue = r[pkgCol];

          if (rfiNo === null && pkgValue === null) {
            continue;
          }

          var pkg = parseResolvePackage(pkgLookup, pkgValue, {
            allowAlias: true,
            allowAdjacent: true,
            adjacentPackage: r[transmittalCol],
          });

          if (!pkg || !data.pkgs[pkg]) {
            continue;
          }

          var issued = toDate(r[issuedCol]);

          var storedRequired = toDate(r[requiredCol]);

          data.pkgs[pkg].rfiItems.push({
            ref: String(rfiNo != null ? rfiNo : ""),

            status: String(r[statusCol] || "").trim(),

            title: String(r[titleCol] || ""),

            issued: issued,

            required:
              storedRequired ||
              (issued ? addWdays(issued, rfiResponseDays) : null),

            received: toDate(r[receivedCol]),

            type: String(r[typeCol] || ""),
          });
        }
      }

      function parseWB(wb) {
        var data = {
          projName: "",
          projNum: "",
          client: "",
          pkgs: {},
        };

        var pkgLookup = {};

        HOLIDAY_KEYS.clear();

        var dropDownRows = parseSheetRows(wb, "Drop Downs");

        var rfiResponseDays = parseDropDowns(dropDownRows, data);

        parsePackages(dropDownRows, data, pkgLookup);

        parseDeliverables(wb, data, pkgLookup);

        parseCallOffs(wb, data, pkgLookup);

        parseRFIs(wb, data, pkgLookup, rfiResponseDays);

        resolveSharedDesignLinks(data);

        return data;
      }

      // ============================================================
      // 06. REVISION & BUSINESS-RULE UTILITIES
      // ============================================================
      function byRefSorted(items) {
        var m = {};

        items.forEach(function (it) {
          if (!m[it.ref]) m[it.ref] = [];
          m[it.ref].push(it);
        });

        Object.keys(m).forEach(function (ref) {
          m[ref].sort(function (a, b) {
            return a.rev - b.rev;
          });
        });

        return m;
      }

      function getRevisionDisplayState(revs, live) {
        var history =
          live &&
          Array.isArray(live.revisionHistory) &&
          live.revisionHistory.length
            ? live.revisionHistory
            : revs;

        var liveRevision = Number((live && live.rev) || 0);
        var liveRevisionCode = String((live && live.rc) || "")
          .trim()
          .toUpperCase();

        var liveIndex = -1;

        for (
          var historyIndex = history.length - 1;
          historyIndex >= 0;
          historyIndex--
        ) {
          var historyRevision = Number(history[historyIndex].rev || 0);
          var historyRevisionCode = String(history[historyIndex].rc || "")
            .trim()
            .toUpperCase();

          if (
            historyRevision === liveRevision &&
            historyRevisionCode === liveRevisionCode
          ) {
            liveIndex = historyIndex;
            break;
          }
        }

        if (liveIndex < 0) {
          liveIndex = history.length;
        }

        var previousStatusItem = null;

        for (var i = liveIndex - 1; i >= 0; i--) {
          var status = String(history[i].statusRec || "")
            .trim()
            .toUpperCase();

          if (status === "A" || status === "B" || status === "C") {
            previousStatusItem = history[i];
            break;
          }
        }

        var previousStatus = previousStatusItem
          ? String(previousStatusItem.statusRec || "")
              .trim()
              .toUpperCase()
          : "";

        var previousRevision = previousStatusItem
          ? String(previousStatusItem.rc || "").trim()
          : "";

        var issuedDate = effectiveIssuedDate(live);
        var currentStatus = "";
        var liveStatus = String(live.statusRec || "")
          .trim()
          .toUpperCase();

        if (liveStatus === "A" || liveStatus === "B" || liveStatus === "C") {
          currentStatus = liveStatus;
        } else if (!issuedDate) {
          currentStatus = "Not issued";
        } else if (
          live.cmtsBy &&
          !live.cmtsRec &&
          wdays(TODAY, live.cmtsBy) < 0
        ) {
          currentStatus = "Comments overdue";
        } else if (live.cmtsBy && !live.cmtsRec) {
          currentStatus = "Awaiting comments";
        } else {
          currentStatus = "Issued";
        }

        return {
          currentStatus: currentStatus,
          previousStatus: previousStatus,
          previousRevision: previousRevision,
        };
      }

      function constructionFlagOn(v) {
        if (v === 1 || v === true) return true;
        var s = String(v || "")
          .trim()
          .toLowerCase();
        return s === "1" || s === "yes" || s === "true" || s === "y";
      }

      function effectiveIssuedDate(it) {
        if (!it) return null;
        return it.issued || it.constructionIssued || null;
      }

      function isCloseOutRevision(it) {
        return /^C\d+$/i.test(String((it && it.rc) || "").trim());
      }

      function revisionNumber(it) {
        var n = Number((it && it.rev) || 0);
        return Number.isFinite(n) ? n : FIRST_ISSUE_REVISION;
      }

      function isFirstIssue(it) {
        return revisionNumber(it) === FIRST_ISSUE_REVISION;
      }

      function isReissue(it) {
        return revisionNumber(it) > FIRST_ISSUE_REVISION;
      }

      function itemCompletionDate(it) {
        if (!it) return null;

        if (it.constructionIssued) return it.constructionIssued;

        var status = String(it.statusRec || "")
          .trim()
          .toUpperCase();

        if (status === "A") {
          return it.cmtsRec || effectiveIssuedDate(it) || TODAY;
        }

        if (isCloseOutRevision(it)) {
          return effectiveIssuedDate(it);
        }

        return null;
      }

      function isCompleteItem(it) {
        return !!itemCompletionDate(it);
      }
      function itemStartDate(it) {
        return effectiveIssuedDate(it);
      }

      function resolveEffectiveLiveItem(revs) {
        if (!revs || !revs.length) return null;

        var live = revs[revs.length - 1];

        if (isCompleteItem(live)) {
          return live;
        }

        if (effectiveIssuedDate(live)) {
          return live;
        }

        for (var i = revs.length - 2; i >= 0; i--) {
          var prev = revs[i];

          if (isCompleteItem(prev)) {
            return prev;
          }

          if (
            String(prev.statusRec || "")
              .trim()
              .toUpperCase() === "C"
          ) {
            break;
          }
        }

        return live;
      }

      function getEffectiveLiveItems(items) {
        var byRef = byRefSorted(items);
        return Object.values(byRef)
          .map(function (revs) {
            return resolveEffectiveLiveItem(revs);
          })
          .filter(function (it) {
            return it;
          });
      }

      function designStreamsClosed(p, asOfDate) {
        var tsAsOf = deliverableItemsAsOf(p.tsItems, asOfDate);
        var dwAsOf = deliverableItemsAsOf(p.dwItems, asOfDate);
        var calcAsOf = deliverableItemsAsOf(p.calcItems, asOfDate);
        var smpAsOf = deliverableItemsAsOf(p.smpItems, asOfDate);

        function allRefsClosed(items) {
          var byRef = byRefSorted(items);
          return Object.keys(byRef).every(function (ref) {
            var revs = byRef[ref];
            var latest = revs[revs.length - 1];
            return isCompleteItem(latest);
          });
        }

        return (
          (tsAsOf.length === 0 || allRefsClosed(tsAsOf)) &&
          (dwAsOf.length === 0 || allRefsClosed(dwAsOf)) &&
          (calcAsOf.length === 0 || allRefsClosed(calcAsOf)) &&
          (smpAsOf.length === 0 || allRefsClosed(smpAsOf))
        );
      }

      function calloffPlacementState(p, asOfDate) {
        var items = (p.coItems || []).map(function (it) {
          var snapshot = Object.assign({}, it);

          if (snapshot.issued && snapshot.issued > asOfDate) {
            snapshot.issued = null;
          }

          return snapshot;
        });

        var issuedItems = items.filter(function (it) {
          return it.issued && it.issued <= asOfDate;
        });

        var required = items.length > 0;
        var anyPlaced = issuedItems.length > 0;
        var allPlaced = required && issuedItems.length === items.length;

        var latestIssued = null;

        issuedItems.forEach(function (it) {
          if (!latestIssued || it.issued > latestIssued) {
            latestIssued = it.issued;
          }
        });

        return {
          items: items,
          required: required,
          anyPlaced: anyPlaced,
          allPlaced: allPlaced,
          latestIssued: latestIssued,
          outstandingCount: required ? items.length - issuedItems.length : 0,
        };
      }

      function orderedAtRiskState(p, asOfDate) {
        var calloffState = calloffPlacementState(p, asOfDate);

        var atRiskCalloffs = calloffState.items.filter(function (it) {
          return (
            it.issued &&
            it.issued <= asOfDate &&
            !designStreamsClosed(p, it.issued)
          );
        });

        var firstAtRiskDate = null;

        atRiskCalloffs.forEach(function (it) {
          if (!firstAtRiskDate || it.issued < firstAtRiskDate) {
            firstAtRiskDate = it.issued;
          }
        });

        return {
          orderedAtRisk: atRiskCalloffs.length > 0,
          atRiskCalloffs: atRiskCalloffs,
          firstAtRiskDate: firstAtRiskDate,
        };
      }

      function isClosedPackage(p, asOfDate) {
        var hasAnyRecords =
          ownItems(p.tsItems).length > 0 ||
          ownItems(p.dwItems).length > 0 ||
          ownItems(p.calcItems).length > 0 ||
          ownItems(p.smpItems).length > 0 ||
          (p.coItems || []).length > 0;

        if (!hasAnyRecords) return false;

        var calloffState = calloffPlacementState(p, asOfDate);

        var calloffComplete = !calloffState.required || calloffState.allPlaced;

        return designStreamsClosed(p, asOfDate) && calloffComplete;
      }

      function remainingApprovalForItem(it, p, asOfDate) {
        if (!it) return 0;
        if (isCompleteItem(it)) return 0;

        var ap = p.approvalPeriod || 0;
        var fr = p.firstRevPeriod || 0;

        var full = p.chain || 0;
        var issuedDate = effectiveIssuedDate(it);

        if (!issuedDate) {
          if (isReissue(it)) {
            return fr + ap;
          }

          return full;
        }

        if (issuedDate && it.cmtsBy && !it.cmtsRec) {
          var commentDays = wdays(asOfDate, it.cmtsBy);
          commentDays = commentDays !== null ? Math.max(0, commentDays) : ap;

          if (isFirstIssue(it)) {
            return commentDays + fr + ap;
          }

          return commentDays;
        }

        if (it.statusRec === "C" && it.cmtsRec) {
          return fr + ap;
        }

        if (it.statusRec === "B") return fr;

        if (it.statusRec === "A" && constructionFlagOn(it.constructionFlag)) {
          return 2;
        }

        return full;
      }

      function remainingApprovalForItems(items, p, asOfDate) {
        var liveItems = getEffectiveLiveItems(
          deliverableItemsAsOf(items, asOfDate),
        );

        if (!liveItems.length) {
          return 0;
        }

        return liveItems.reduce(function (max, it) {
          return Math.max(max, remainingApprovalForItem(it, p, asOfDate));
        }, 0);
      }

      function remainingApprovalForPackage(p, asOfDate) {
        var tsRemaining = remainingApprovalForItems(p.tsItems, p, asOfDate);
        var dwRemaining = remainingApprovalForItems(p.dwItems, p, asOfDate);
        var calcRemaining = remainingApprovalForItems(p.calcItems, p, asOfDate);
        var smpRemaining = remainingApprovalForItems(p.smpItems, p, asOfDate);

        var designRemaining = Math.max(
          tsRemaining,
          dwRemaining,
          calcRemaining,
          smpRemaining,
        );

        var calloffState = calloffPlacementState(p, asOfDate);

        var coOutstanding = calloffState.required && !calloffState.allPlaced;

        var calloffRemaining = coOutstanding ? 1 : 0;

        return Math.max(designRemaining, calloffRemaining);
      }

      function deliverableIsClosed(items, asOfDate) {
        var liveItems = getEffectiveLiveItems(
          deliverableItemsAsOf(items, asOfDate),
        );

        return (
          liveItems.length > 0 &&
          liveItems.every(function (it) {
            return isCompleteItem(it);
          })
        );
      }

      function designFloatForItems(items, p, asOfDate, baseCalloffFloat) {
        if (
          !items.length ||
          baseCalloffFloat === null ||
          baseCalloffFloat === undefined
        ) {
          return null;
        }

        if (deliverableIsClosed(items, asOfDate)) {
          return null;
        }

        var remaining = remainingApprovalForItems(items, p, asOfDate);

        return baseCalloffFloat - remaining;
      }
      function sectionFromFloatAndIssue(f, hasIssue, currentWindowReached) {
        if (!currentWindowReached && !hasIssue) {
          return "OK";
        }

        if (f !== null && f !== undefined && f < 0) return "MIT";
        if (f !== null && f !== undefined && f >= 0 && f <= 5) return "CRIT";

        return "OK";
      }

      function sectionFromProjectedFinish(
        projectedFinish,
        plannedFinish,
        critCO,
        planStart,
        asOfDate,
      ) {
        var plannedStartReached = planStart ? asOfDate >= planStart : true;

        if (planStart && critCO && planStart > critCO) {
          return "MIT";
        }

        if (!plannedStartReached) {
          return "OK";
        }

        if (projectedFinish && critCO && projectedFinish > critCO) {
          return "MIT";
        }

        var floatToCritical =
          projectedFinish && critCO ? wdays(projectedFinish, critCO) : null;

        if (floatToCritical !== null && floatToCritical <= 5) {
          return "CRIT";
        }

        if (
          projectedFinish &&
          plannedFinish &&
          projectedFinish > plannedFinish
        ) {
          return "PAST";
        }

        return "OK";
      }

      function worstSectionName(sections) {
        if (sections.indexOf("MIT") >= 0) return "MIT";
        if (sections.indexOf("CRIT") >= 0) return "CRIT";
        if (sections.indexOf("PAST") >= 0) return "PAST";
        return "OK";
      }

      function applyFloatClass(cell, section) {
        if (!cell || !cell.hasItems) return cell;

        if (
          cell.status === "Closed" ||
          cell.float === null ||
          cell.float === undefined
        ) {
          cell.fCls = "fn";
          return cell;
        }

        if (section === "MIT") {
          cell.fCls = "fr";
        } else if (section === "CRIT") {
          cell.fCls = "fo";
        } else if (section === "PAST") {
          cell.fCls = "fy";
        } else {
          cell.fCls = "fg";
        }

        return cell;
      }

      function dueCountdown(dueDate) {
        if (!dueDate) {
          return { text: "No date", cls: "due-neutral" };
        }

        var d = wdays(TODAY, dueDate);

        if (d < 0) {
          return { text: Math.abs(d) + "d overdue", cls: "due-red" };
        }
        if (d === 0) {
          return { text: "Due today", cls: "due-red" };
        }
        if (d <= 5) {
          return { text: "Due in " + d + "d", cls: "due-orange" };
        }

        return { text: "Due in " + d + "d", cls: "due-green" };
      }

      function itemDueInfo(it, colPlanned) {
        if (isCompleteItem(it)) {
          return {
            text: "—",
            cls: "due-neutral",
            kind: "complete",
            date: null,
            dateLabel: null,
          };
        }

        var issuedDate = effectiveIssuedDate(it);
        var dueDate = null;
        var kind = "none";
        var dateLabel = null;

        if (!issuedDate) {
          dueDate = it.planned || colPlanned || null;
          kind = "not-issued";
          dateLabel = "Planned";
        } else if (it.statusRec === "C" && it.cmtsRec) {
          dueDate = it.nextRevPlanned || null;
          kind = "next-revision";
          dateLabel = "Next revision due";
        } else if (it.cmtsBy && !it.cmtsRec) {
          dueDate = it.cmtsBy;
          kind = "comments-due";
          dateLabel = "Comments due";
        }

        var info = dueCountdown(dueDate);
        info.kind = kind;
        info.date = dueDate;
        info.dateLabel = dateLabel;
        return info;
      }

      function mkNote(scenario, dLP, fI, count, type) {
        var c =
          count && count > 1
            ? count + " " + (type || "item") + "s"
            : type || "Item";
        if (scenario === "holden_overdue")
          return c + " not issued — " + dLP + "d past planned date";
        if (scenario === "holden_overdue_C")
          return (
            c +
            " not issued (awaiting reissue after Status C) — " +
            dLP +
            "d past planned date"
          );
        if (scenario === "cmts_overdue")
          return "Comments " + dLP + "d past due date";
        if (scenario === "cmts_due_soon") return "Comments due in " + dLP + "d";
        if (scenario === "closed")
          return "Approved — issue for construction required";
        if (scenario === "closed_B_reissue")
          return (
