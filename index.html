            "Status B received — P" +
            dLP +
            " reissue planned but not programme-critical"
          );
        if (scenario === "co_overdue")
          return "Not placed — " + dLP + "d past planned date";
        if (scenario === "placed") return "Placed — no further action required";
        return "";
      }

      function deliverableItemsAsOf(items, asOfDate) {
        return items.map(function (it) {
          var snapshot = Object.assign({}, it);

          if (snapshot.issued && snapshot.issued > asOfDate) {
            snapshot.issued = null;
          }

          if (
            snapshot.constructionIssued &&
            snapshot.constructionIssued > asOfDate
          ) {
            snapshot.constructionIssued = null;
          }

          if (!effectiveIssuedDate(snapshot)) {
            snapshot.cmtsRec = null;
            snapshot.statusRec = "";
          } else if (snapshot.cmtsRec && snapshot.cmtsRec > asOfDate) {
            snapshot.cmtsRec = null;
            snapshot.statusRec = "";
          }

          if (Array.isArray(snapshot.revisionHistory)) {
            snapshot.revisionHistory = snapshot.revisionHistory.map(
              function (historyItem) {
                var historySnapshot = Object.assign({}, historyItem);

                if (
                  historySnapshot.issued &&
                  historySnapshot.issued > asOfDate
                ) {
                  historySnapshot.issued = null;
                }

                if (
                  historySnapshot.constructionIssued &&
                  historySnapshot.constructionIssued > asOfDate
                ) {
                  historySnapshot.constructionIssued = null;
                }

                if (
                  !historySnapshot.issued &&
                  !historySnapshot.constructionIssued
                ) {
                  historySnapshot.cmtsRec = null;
                  historySnapshot.statusRec = "";
                } else if (
                  historySnapshot.cmtsRec &&
                  historySnapshot.cmtsRec > asOfDate
                ) {
                  historySnapshot.cmtsRec = null;
                  historySnapshot.statusRec = "";
                }

                return historySnapshot;
              },
            );
          }

          return snapshot;
        });
      }

      // ============================================================
      // 07. ASSESSMENT ENGINE
      // ============================================================
      function assessDel(items, colPlanned, fI, asOfDate) {
        asOfDate = asOfDate || TODAY;
        items = deliverableItemsAsOf(items, asOfDate);
        if (!items.length) return { hasItems: false };
        var byRef = byRefSorted(items);
        var refs = Object.keys(byRef);

        var cellState = {
          hasItems: true,
          hasIssue: false,
          programmeIssue: false,
          status: "",
          sCls: "",
          planned: null,
          pCls: "",
          float: null,

          fCls: "fn",
          dot: "",
          note: "",
          nCls: "n",
          colPlanned: colPlanned,
          liveItems: [],
        };

        var worstPriority = 99;
        var allEffClosed = true;
        var earliestPlanned = null;
        refs.forEach(function (ref) {
          var revs = byRef[ref];
          var live = revs[revs.length - 1];
          var prev = revs.length > 1 ? revs[revs.length - 2] : null;
          var issuedDate = effectiveIssuedDate(live);
          var initialPlanned = live.planned || colPlanned || null;
          var revisionDisplayState = getRevisionDisplayState(revs, live);
          var prevStatus = revisionDisplayState.previousStatus || "";

          cellState.liveItems.push(
            Object.assign({}, live, {
              currentStatus: revisionDisplayState.currentStatus,
              previousStatus: revisionDisplayState.previousStatus,
              previousRevision: revisionDisplayState.previousRevision,
            }),
          );

          var effClosed = false;
          var effStatus = "";

          function realStatusLetter(item) {
            var s = String((item && item.statusRec) || "")
              .trim()
              .toUpperCase();
            return s === "A" || s === "B" ? s : "";
          }

          if (isCompleteItem(live)) {
            effClosed = true;
            effStatus = realStatusLetter(live);
          } else if (!issuedDate && prev && isCompleteItem(prev)) {
            effClosed = true;
            effStatus = realStatusLetter(prev);
          }

          if (effClosed) {
            if (!cellState.hasIssue && !cellState.dot) {
              cellState.dot = effStatus;
            }
            return;
          }

          allEffClosed = false;

          var liveDueDate = itemDueInfo(live, colPlanned).date;
          if (
            liveDueDate &&
            (!earliestPlanned || liveDueDate < earliestPlanned)
          ) {
            earliestPlanned = liveDueDate;
          }

          if (issuedDate) {
            if (live.statusRec === "C" && live.cmtsRec) {
              if (5 < worstPriority) {
                worstPriority = 5;
                cellState.hasIssue = true;
                cellState.programmeIssue = true;
                cellState.dot = "C";
                cellState.status = "Reissue required";
                cellState.sCls = "sr";
                var reissueDue = live.nextRevPlanned || colPlanned;
                cellState.planned = initialPlanned;
                cellState.pCls =
                  reissueDue && reissueDue < asOfDate ? "sr" : "";
                cellState.float = fI;
                cellState.fCls =
                  fI !== null && fI <= 0
                    ? "fr"
                    : fI !== null && fI <= 5
                      ? "fr"
                      : "fa";
                cellState.note =
                  "Status C received " +
                  fmt(live.cmtsRec) +
                  " — address comments and reissue";
                cellState.nCls = fI !== null && fI < 0 ? "r" : "a";
              }
            } else if (live.cmtsBy && !live.cmtsRec) {
              var d = wdays(asOfDate, live.cmtsBy);
              if (d !== null && d < 0) {
                if (2 < worstPriority) {
                  worstPriority = 2;
                  cellState.hasIssue = true;
                  cellState.programmeIssue = false;
                  cellState.dot = "";
                  cellState.status = "Cmts overdue";
                  cellState.sCls = "sr";
                  cellState.planned = initialPlanned;
                  cellState.pCls = "sr";
                  cellState.float = fI;
                  cellState.fCls =
                    fI !== null && fI <= 0
                      ? "fr"
                      : fI !== null && fI <= 5
                        ? "fr"
                        : "fa";
                  cellState.note = mkNote(
                    "cmts_overdue",
                    Math.abs(d),
                    fI,
                    1,
                    "",
                  );
                  cellState.nCls = fI !== null && fI < 0 ? "r" : "a";
                }
              } else if (d !== null && d <= 2) {
                if (3 < worstPriority) {
                  worstPriority = 3;
                  cellState.hasIssue = false;
                  cellState.dot = "";
                  cellState.status = "Cmts due " + d + "d";
                  cellState.sCls = "sa";
                  cellState.planned = initialPlanned;
                  cellState.pCls = "sa";
                  cellState.float = fI;
                  cellState.fCls = fI !== null && fI <= 5 ? "fr" : "fa";
                  cellState.note = mkNote("cmts_due_soon", d, fI, 1, "");
                  cellState.nCls = "a";
                }
              } else {
                if (worstPriority === 99) {
                  cellState.dot = "";
                  cellState.status = "Issued";
                  cellState.sCls = "";
                  cellState.planned = initialPlanned;
                  cellState.pCls = d !== null && d <= 2 ? "sa" : "";
                  cellState.float = fI;
                  cellState.fCls =
                    fI !== null && fI > 10
                      ? "fg"
                      : fI !== null && fI > 5
                        ? "fa"
                        : "fr";
                }
              }
            } else if (
              (live.statusRec === "A" || live.statusRec === "B") &&
              constructionFlagOn(live.constructionFlag) &&
              !live.constructionIssued
            ) {
              if (4 < worstPriority) {
                worstPriority = 4;
                cellState.hasIssue = true;
                cellState.programmeIssue = true;
                cellState.dot = live.statusRec;
                cellState.status = "Issue for construction";
                cellState.sCls = "sa";
                cellState.float = fI;
                cellState.fCls =
                  fI !== null && fI <= 0
                    ? "fr"
                    : fI !== null && fI <= 5
                      ? "fr"
                      : "fa";
                cellState.note =
                  "Status " +
                  live.statusRec +
                  " received — construction issue required";
                cellState.nCls = fI !== null && fI < 0 ? "r" : "a";
              }
            } else if (live.statusRec === "A") {
              if (worstPriority === 99) {
                cellState.dot = live.statusRec;
                cellState.status = "Closed";
                cellState.sCls = "sg";
                cellState.note = mkNote("closed", 0, null, 1, "");
                cellState.nCls = "g";
              }
            } else {
              if (worstPriority === 99) {
                cellState.status = "Issued";
                cellState.sCls = "";
                cellState.planned = initialPlanned;
                cellState.pCls = "";
                cellState.float = fI;
                cellState.fCls =
                  fI !== null && fI > 10
                    ? "fg"
                    : fI !== null && fI > 5
                      ? "fa"
                      : "fr";
                cellState.note =
                  "Issued " +
                  fmt(issuedDate) +
                  " — awaiting comments/status update";
                cellState.nCls = "n";
              }
            }
          } else {
            var planDate = live.planned || colPlanned;
            if (planDate && planDate < asOfDate) {
              var dLate = wdays(planDate, asOfDate);
              var scenario =
                prevStatus === "C" ? "holden_overdue_C" : "holden_overdue";
              if (1 < worstPriority) {
                worstPriority = 1;
                cellState.hasIssue = true;
                cellState.programmeIssue = true;
                cellState.status = "Overdue";
                cellState.sCls = "sr";
                cellState.dot = prevStatus || "";
                cellState.planned = planDate;
                cellState.pCls = "sr";
                cellState.float = fI;
                cellState.fCls =
                  fI !== null && fI <= 0
                    ? "fr"
                    : fI !== null && fI <= 5
                      ? "fr"
                      : "fa";
                cellState.note = mkNote(scenario, dLate, fI, 1, "");
                cellState.nCls = fI !== null && fI < 0 ? "r" : "a";
              }
            } else {
              if (worstPriority === 99) {
                cellState.dot = prevStatus || "";
                cellState.status = "Not issued";
                cellState.sCls = "";
                cellState.planned = planDate;
                cellState.pCls = "";
                cellState.float = fI;
                cellState.fCls =
                  fI !== null && fI > 10
                    ? "fg"
                    : fI !== null && fI > 5
                      ? "fa"
                      : "fr";
              }
            }
          }
        });

        if (allEffClosed && worstPriority === 99) {
          cellState.status = "Closed";
          cellState.sCls = "sg";
          cellState.note = mkNote("closed", 0, null, 1, "");
          cellState.nCls = "g";
          cellState.float = null;
          cellState.fCls = "fn";
          cellState.dueInfo = { text: "Closed", cls: "due-green" };
        } else {
          cellState.dueInfo = dueCountdown(earliestPlanned);
        }

        return cellState;
      }

      function getWorkStart(p, asOfDate) {
        var ws = null;

        [p.tsItems, p.dwItems, p.calcItems, p.smpItems].forEach(
          function (rawItems) {
            var items = deliverableItemsAsOf(rawItems, asOfDate);

            items.forEach(function (it) {
              var s = itemStartDate(it);

              if (s && (!ws || s < ws)) {
                ws = s;
              }
            });
          },
        );

        return ws;
      }

      function packageActualFinishDate(p, asOfDate) {
        var coItemsAsOf = p.coItems.map(function (it) {
          var snapshot = Object.assign({}, it);
          if (snapshot.issued && snapshot.issued > asOfDate) {
            snapshot.issued = null;
          }
          return snapshot;
        });

        var latestCOIssued = null;
        coItemsAsOf.forEach(function (it) {
          if (it.issued && (!latestCOIssued || it.issued > latestCOIssued)) {
            latestCOIssued = it.issued;
          }
        });

        var liveDesignItems = getEffectiveLiveItems(
          deliverableItemsAsOf(p.tsItems, asOfDate),
        ).concat(
          getEffectiveLiveItems(deliverableItemsAsOf(p.dwItems, asOfDate)),
          getEffectiveLiveItems(deliverableItemsAsOf(p.calcItems, asOfDate)),
          getEffectiveLiveItems(deliverableItemsAsOf(p.smpItems, asOfDate)),
        );

        var workEnd = null;
        liveDesignItems.forEach(function (it) {
          var c = itemCompletionDate(it);
          if (c && (!workEnd || c > workEnd)) {
            workEnd = c;
          }
        });

        return laterOf(latestCOIssued, workEnd) || null;
      }

      function rfiIsAnswered(it) {
        return !!(it && it.received);
      }

      function rfiIsManuallyClosed(it) {
        return !!(it && /^closed$/i.test(String(it.status || "").trim()));
      }

      function rfiNeedsAction(it, isPkgClosed) {
        if (!it) return false;
        if (isPkgClosed) return false;
        return !rfiIsAnswered(it) && !rfiIsManuallyClosed(it);
      }

      function rfiIsOverdue(it, asOfDate, isPkgClosed) {
        if (!rfiNeedsAction(it, isPkgClosed) || !it.required) return false;
        return it.required < asOfDate;
      }

      function rfiItemsAsOf(items, asOfDate) {
        return (items || [])
          .map(function (it) {
            if (!it.issued || it.issued > asOfDate) return null;
            var snapshot = Object.assign({}, it);
            if (snapshot.received && snapshot.received > asOfDate) {
              snapshot.received = null;
            }
            return snapshot;
          })
          .filter(function (it) {
            return it;
          });
      }

      function assessRfi(items, asOfDate, isPkgClosed) {
        asOfDate = asOfDate || TODAY;
        var snapshot = rfiItemsAsOf(items, asOfDate);
        if (!snapshot.length) return { hasItems: false };

        var cellState = {
          hasItems: true,
          hasIssue: false,
          status: "",
          sCls: "",
          planned: null,
          pCls: "",
          float: null,
          fCls: "fn",
          note: "",
          nCls: "n",
          liveItems: snapshot,
        };

        var worstPriority = 99;

        snapshot.forEach(function (it) {
          var answered = rfiIsAnswered(it);
          var manuallyClosed = rfiIsManuallyClosed(it);
          var daysToRequired = it.required
            ? wdays(asOfDate, it.required)
            : null;
          var priority, apply;

          if (answered) {
            priority = 6;
            apply = function () {
              cellState.status = "Answered";
              cellState.sCls = "sg";
              cellState.note = "Answered " + fmt(it.received);
              cellState.nCls = "g";
            };
          } else if (manuallyClosed) {
            priority = 5;
            apply = function () {
              cellState.status = "Closed";
              cellState.sCls = "sg";
              cellState.note = "Marked closed";
              cellState.nCls = "g";
            };
          } else if (isPkgClosed) {
            priority = 4;
            apply = function () {
              cellState.status = "Closed — unanswered";
              cellState.sCls = "sa";
              cellState.planned = it.required;
              cellState.float = daysToRequired;
              cellState.fCls = "fy";
              cellState.note = "Package closed before a response was received";
              cellState.nCls = "a";
            };
          } else if (daysToRequired !== null && daysToRequired < 0) {
            priority = 1;
            apply = function () {
              cellState.hasIssue = true;
              cellState.status = "Overdue";
              cellState.sCls = "sr";
              cellState.planned = it.required;
              cellState.pCls = "sr";
              cellState.float = daysToRequired;
              cellState.fCls = "fr";
              cellState.note =
                Math.abs(daysToRequired) + "d overdue for response";
              cellState.nCls = "r";
            };
          } else if (daysToRequired !== null && daysToRequired <= 2) {
            priority = 2;
            apply = function () {
              cellState.status = "Due " + daysToRequired + "d";
              cellState.sCls = "sa";
              cellState.planned = it.required;
              cellState.pCls = "sa";
              cellState.float = daysToRequired;
              cellState.fCls = "fo";
              cellState.note = "Response due in " + daysToRequired + "d";
              cellState.nCls = "a";
            };
          } else {
            priority = 3;
            apply = function () {
              cellState.status = "Awaiting response";
              cellState.sCls = "";
              cellState.planned = it.required;
              cellState.float = daysToRequired;
              cellState.fCls =
                daysToRequired !== null && daysToRequired > 10 ? "fg" : "fa";
            };
          }

          if (priority < worstPriority) {
            worstPriority = priority;
            apply();
          }
        });

        return cellState;
      }

      function summariseRfis(p, asOfDate, isPkgClosed) {
        var items = rfiItemsAsOf(p.rfiItems, asOfDate);
        var open = 0;
        var overdue = 0;
        items.forEach(function (it) {
          if (rfiNeedsAction(it, isPkgClosed)) open++;
          if (rfiIsOverdue(it, asOfDate, isPkgClosed)) overdue++;
        });
        return { total: items.length, open: open, overdue: overdue };
      }
      function assessDesignStream(
        items,
        plannedDate,
        pkg,
        asOfDate,
        availableToCalloff,
        plannedStartReached,
      ) {
        var float = designFloatForItems(
          ownItems(items),
          pkg,
          asOfDate,
          availableToCalloff,
        );

        var assessment = assessDel(items, plannedDate, float, asOfDate);

        var section = sectionFromFloatAndIssue(
          float,
          assessment.programmeIssue,
          plannedStartReached,
        );

        applyFloatClass(assessment, section);

        return {
          float: float,
          assessment: assessment,
          section: section,
        };
      }

      function assessCalloff(
        pkg,
        calloffState,
        plannedFinish,
        planStart,
        asOfDate,
      ) {
        var coNI = calloffState.items.filter(function (it) {
          return !it.issued;
        });

        var coAnyPlaced = calloffState.anyPlaced;
        var coPlaced = calloffState.required && calloffState.allPlaced;

        var calloffFloat = pkg.critCO ? wdays(asOfDate, pkg.critCO) : null;

        var plannedStartReached = planStart ? asOfDate >= planStart : true;

        var coC = {
          hasItems: true,
          hasIssue: false,
          status: "—",
          sCls: "",
          float: null,
          fCls: "fn",
          note: "",
          nCls: "n",
        };

        if (coPlaced) {
          coC.status = "Placed";
          coC.sCls = "sg";
          coC.note = mkNote("placed", 0, null, 1, "");
          coC.nCls = "g";
          coC.float = null;
        } else {
          coC.float = calloffFloat;

          if (
            plannedFinish &&
            plannedFinish < asOfDate &&
            plannedStartReached &&
            coNI.length
          ) {
            coC.hasIssue = true;

            var d = wdays(plannedFinish, asOfDate);

            if (coAnyPlaced) {
              coC.status =
                calloffFloat !== null && calloffFloat < 0
                  ? "Partially placed - overdue & critical"
                  : "Partially placed - overdue";
            } else {
              coC.status =
                calloffFloat !== null && calloffFloat < 0
                  ? "Overdue & critical"
                  : "Overdue";
            }

            coC.sCls = calloffFloat !== null && calloffFloat < 0 ? "sr" : "sa";

            coC.note = coAnyPlaced
              ? "Partially placed - " +
                coNI.length +
                " call-off" +
                (coNI.length === 1 ? "" : "s") +
                " outstanding"
              : mkNote("co_overdue", d, calloffFloat, 1, "");

            coC.nCls = calloffFloat !== null && calloffFloat < 0 ? "r" : "a";
          } else if (coNI.length) {
            coC.status = coAnyPlaced ? "Partially placed" : "Not issued";

            if (coAnyPlaced) {
              coC.note =
                coNI.length +
                " call-off" +
                (coNI.length === 1 ? "" : "s") +
                " still outstanding";
            }
          }
        }

        return coC;
      }

      function assess(pkg, asOfDate) {
        asOfDate = asOfDate || TODAY;

        var planStart = packagePlannedStart(pkg);

        var remainingApprovalDays = remainingApprovalForPackage(pkg, asOfDate);
        var plannedFinish = packagePlannedFinish(pkg, planStart);

        var workStart = getWorkStart(pkg, asOfDate);
        var notStarted = !workStart;

        var greyStartDate = notStarted
          ? laterOf(planStart, asOfDate)
          : asOfDate;

        var designComplete = designStreamsClosed(pkg, asOfDate);

        var projectedFinish = notStarted
          ? planStart && asOfDate < planStart
            ? addWdays(greyStartDate, wdays(planStart, plannedFinish))
            : addWdays(greyStartDate, remainingApprovalDays)
          : designComplete && remainingApprovalDays <= 0
            ? packageActualFinishDate(pkg, asOfDate) || greyStartDate
            : addWdays(greyStartDate, remainingApprovalDays);

        var availableToCalloff =
          pkg.critCO && greyStartDate ? wdays(greyStartDate, pkg.critCO) : null;

        var plannedNegFloat =
          projectedFinish && pkg.critCO && projectedFinish > pkg.critCO;

        var plannedStartReached = planStart ? asOfDate >= planStart : true;

        var ts = assessDesignStream(
          pkg.tsItems,
          pkg.tsPlanned,
          pkg,
          asOfDate,
          availableToCalloff,
          plannedStartReached,
        );

        var dw = assessDesignStream(
          pkg.dwItems,
          pkg.dwPlanned,
          pkg,
          asOfDate,
          availableToCalloff,
          plannedStartReached,
        );

        var calc = assessDesignStream(
          pkg.calcItems,
          pkg.tsPlanned,
          pkg,
          asOfDate,
          availableToCalloff,
          plannedStartReached,
        );

        var smp = assessDesignStream(
          pkg.smpItems,
          planStart,
          pkg,
          asOfDate,
          availableToCalloff,
          plannedStartReached,
        );

        var fTS = ts.float;
        var fDW = dw.float;
        var fCAL = calc.float;
        var fSMP = smp.float;

        var tsC = ts.assessment;
        var dwC = dw.assessment;
        var calcC = calc.assessment;
        var smpC = smp.assessment;

        var isPkgClosed = isClosedPackage(pkg, asOfDate);

        var rfiC = assessRfi(pkg.rfiItems, asOfDate, isPkgClosed);

        var calloffState = calloffPlacementState(pkg, asOfDate);

        var orderedRisk = orderedAtRiskState(pkg, asOfDate);

        var coC = assessCalloff(
          pkg,
          calloffState,
          plannedFinish,
          planStart,
          asOfDate,
        );

        var coEarliest = plannedFinish;

        var tsSection = ts.section;
        var dwSection = dw.section;
        var calcSection = calc.section;
        var smpSection = smp.section;

        var coSection =
          coC.status === "Placed" ||
          coC.float === null ||
          coC.float === undefined
            ? "OK"
            : coC.float < 0
              ? "MIT"
              : coC.float <= 5
                ? "CRIT"
                : "OK";

        applyFloatClass(coC, coSection);

        var minFloat = worstFloat([fTS, fDW, fCAL, fSMP, coC.float]);

        var projectionSection = sectionFromProjectedFinish(
          projectedFinish,
          plannedFinish,
          pkg.critCO,
          planStart,
          asOfDate,
        );

        var procurementComplete =
          calloffState.required && calloffState.allPlaced;

        var section;

        if (procurementComplete) {
          section = worstSectionName([
            tsC.hasIssue ? (plannedNegFloat ? "MIT" : "PAST") : "OK",

            dwC.hasIssue ? (plannedNegFloat ? "MIT" : "PAST") : "OK",

            calcC.hasIssue ? (plannedNegFloat ? "MIT" : "PAST") : "OK",

            smpC.hasIssue ? (plannedNegFloat ? "MIT" : "PAST") : "OK",
          ]);
        } else {
          section = worstSectionName([
            projectionSection,
            tsSection,
            dwSection,
            calcSection,
            smpSection,
            coSection,
          ]);
        }

        return {
          section: section,
          minFloat: minFloat,
          fI: minFloat,
          fCO: coC.float,
          plannedNegFloat: plannedNegFloat,
          remainingApprovalDays: remainingApprovalDays,
          plannedFinish: plannedFinish,
          projectedFinish: projectedFinish,

          tsC: tsC,
          dwC: dwC,
          calcC: calcC,
          smpC: smpC,
          coC: coC,

          calloffState: calloffState,
          orderedAtRiskState: orderedRisk,
          rfiC: rfiC,

          coEarliest: coEarliest,

          deliverableFloats: {
            techSub: fTS,
            drawings: fDW,
            calculations: fCAL,
            samples: fSMP,
          },

          deliverableSections: {
            techSub: tsSection,
            drawings: dwSection,
            calculations: calcSection,
            samples: smpSection,
            calloff: coSection,
          },
        };
      }
      function packageHasAnyTrackedItems(p) {
        return (
          p.tsItems.length > 0 ||
          p.dwItems.length > 0 ||
          p.calcItems.length > 0 ||
          p.smpItems.length > 0 ||
          p.coItems.length > 0 ||
          p.rfiItems.length > 0
        );
      }

      function computeAssessedList(data, asOfDate) {
        var pkgList = Object.values(data.pkgs).filter(
          packageHasAnyTrackedItems,
        );
        return pkgList.map(function (p) {
          var a = assess(p, asOfDate);
          a.pkg = p;
          a.isClosed = isClosedPackage(p, asOfDate);
          return a;
        });
      }

      function getSummaryCounts(data, asOfDate, filterFn) {
        var packages = Object.values(data.pkgs).filter(function (p) {
          return (
            packageHasAnyTrackedItems(p) &&
            !isClosedPackage(p, asOfDate) &&
            (!filterFn || filterFn(p))
          );
        });
        var counts = { mitigation: 0, critical: 0, past: 0, onTrack: 0 };
        packages.forEach(function (p) {
          var section = assess(p, asOfDate).section;
          if (section === "MIT") counts.mitigation++;
          else if (section === "CRIT") counts.critical++;
          else if (section === "PAST") counts.past++;
          else if (section === "OK") counts.onTrack++;
        });
        return counts;
      }

      function updateSummaryComparison(current, previous) {
        [
          { id: "sT1", key: "mitigation", increaseGood: false },
          { id: "sT2", key: "critical", increaseGood: false },
          { id: "sT3", key: "past", increaseGood: false },
          { id: "sT4", key: "onTrack", increaseGood: true },
        ].forEach(function (metric) {
          var el = document.getElementById(metric.id);
          el.className = "sum-trend neutral";
          var difference = current[metric.key] - previous[metric.key];
          if (difference === 0) {
            el.textContent = "→ no change";
            return;
          }
          var movementGood = metric.increaseGood
            ? difference > 0
            : difference < 0;
          el.className = "sum-trend " + (movementGood ? "good" : "bad");
          el.textContent =
            (difference > 0 ? "↑ +" : "↓ ") + difference + " vs last week";
        });
      }

      // ============================================================
      // 08. TIMELINE MODEL & GANTT UTILITIES
      // ============================================================
      function latestDate(dates) {
        var valid = dates.filter(function (d) {
          return d;
        });
        return valid.length
          ? valid.reduce(function (latest, d) {
              return d > latest ? d : latest;
            }, valid[0])
          : null;
      }

      function markerClass(pct) {
        if (pct <= 3) return " start";
        if (pct >= 97) return " end";
        return "";
      }

      function spaceTimelineMarkers(markers) {
        var sorted = markers.slice().sort(function (a, b) {
          return a.pct - b.pct;
        });

        var byDate = {};

        sorted.forEach(function (m) {
          if (!m.date) return;
          var key = dateKey(m.date);
          (byDate[key] = byDate[key] || []).push(m);
        });

        Object.keys(byDate).forEach(function (key) {
          var group = byDate[key];
          if (group.length !== 2) return;

          group[0].calloffPair = true;
          group[1].calloffPair = true;

          var leftMarker = group[0].pct <= group[1].pct ? group[0] : group[1];
          var rightMarker = leftMarker === group[0] ? group[1] : group[0];

          leftMarker.calloffPairSide = "left";
          rightMarker.calloffPairSide = "right";
        });

        sorted.forEach(function (m) {
          m.yShift = 0;
          m.xShift = 0;
        });

        return markers;
      }

      function renderTimelineMarker(m) {
        var xShift = m.xShift || 0;
        var yShift = m.yShift || 0;

        var dateHtml = m.date
          ? '<span class="tl-mark-date">' + fmt(m.date) + "</span>"
          : "";

        var alignClass = m.calloffPairSide
          ? m.calloffPairSide === "left"
            ? " end"
            : " start"
          : markerClass(m.pct);

        var pairKeyAttr = m.calloffPair
          ? ' data-tl-pair-key="' + dateKey(m.date) + '"'
          : "";

        return (
          '<svg class="tl-mark-tail" xmlns="http://www.w3.org/2000/svg"></svg>' +
          '<span class="tl-mark ' +
          m.cls +
          alignClass +
          '" data-tl-pct="' +
          m.pct +
          '"' +
          pairKeyAttr +
          ' style="left:' +
          m.pct +
          "%;--xshift:" +
          xShift +
          "px;--yshift:" +
          yShift +
          'px">' +
          '<span class="tl-mark-label">' +
          m.label +
          "</span>" +
          dateHtml +
          "</span>"
        );
      }

      function buildTimelineModel(cfg) {
        var sameDayComplete =
          cfg.progressEndClass === "finish" &&
          cfg.progressStart &&
          cfg.progressEndDate &&
          cfg.progressStart.getTime() === cfg.progressEndDate.getTime();

        var progressRenderEndDate = sameDayComplete
          ? addWdays(cfg.progressStart, 1)
          : cfg.progressEndDate;

        var timelineStart =
          earliestDate([
            cfg.workStart,
            cfg.progressStart,
            cfg.planStart,
            cfg.critCO,
          ]) || TODAY;

        var timelineEnd =
          latestDate([
            cfg.site,
            cfg.plannedFinish,
            cfg.projectedFinish,
            cfg.progressEndDate,
            progressRenderEndDate,
            cfg.critCO ? addWdays(cfg.critCO, 5) : null,
            cfg.showToday ? TODAY : null,
          ]) || addWdays(timelineStart, 1);

        var totalSpan = wdays(timelineStart, timelineEnd);
        if (!totalSpan || totalSpan <= 0) {
          timelineEnd = addWdays(timelineStart, 1);
          totalSpan = 1;
        }

        function datePct(d) {
          return d
            ? clamp((wdays(timelineStart, d) / totalSpan) * 100, 0, 100)
            : 0;
        }

        var greenLeftPct = datePct(cfg.planStart || timelineStart);
        var greenRightPct = datePct(
          cfg.plannedFinish || cfg.planStart || timelineStart,
        );
        var greenPct = Math.max(0, greenRightPct - greenLeftPct);

        var orangeLeftDate = cfg.plannedFinish;
        var orangeLeftPct = datePct(orangeLeftDate);
        var orangeRightPct = datePct(cfg.critCO);
        var orangeDays =
          orangeLeftDate && cfg.critCO ? wdays(orangeLeftDate, cfg.critCO) : 0;
        var orangePct =
          orangeDays > 0 ? Math.max(0, orangeRightPct - orangeLeftPct) : 0;

        var redLeftPct = datePct(cfg.critCO);
        var redPct = cfg.critCO ? Math.max(0, 100 - redLeftPct) : 0;

        var doneLeftPct = datePct(cfg.progressStart);
        var doneRightPct =
          cfg.progressStart && progressRenderEndDate
            ? datePct(progressRenderEndDate)
            : doneLeftPct;

        var donePct = Math.max(0, doneRightPct - doneLeftPct);

        if (sameDayComplete) {
          donePct = Math.max(donePct, 2);
        }

        var greyLeftPct =
          cfg.remainingApprovalDays > 0 ? datePct(cfg.greyStartDate) : 0;
        var greyRightPct =
          cfg.remainingApprovalDays > 0 ? datePct(cfg.projectedFinish) : 0;
        var greyWidthPct =
          cfg.remainingApprovalDays > 0
            ? Math.max(0, greyRightPct - greyLeftPct)
            : 0;

        var programmeMarkers = [];

        if (cfg.planStart) {
          programmeMarkers.push({
            cls: "planned",
            pct: datePct(cfg.planStart),
            label: "Plan start",
            date: cfg.planStart,
          });
        }

        if (cfg.plannedFinish) {
          programmeMarkers.push({
            cls: "planfinish",
            pct: datePct(cfg.plannedFinish),
            label: "Planned CO",
            date: cfg.plannedFinish,
          });
        }

        if (cfg.critCO) {
          programmeMarkers.push({
            cls: "calloff",
            pct: datePct(cfg.critCO),
            label: "Critical CO",
            date: cfg.critCO,
          });
        }

        if (cfg.site) {
          programmeMarkers.push({
            cls: "finish",
            pct: datePct(cfg.site),
            label: "Site",
            date: cfg.site,
          });
        }

        var progressMarkers = [];

        if (cfg.progressStart) {
          progressMarkers.push({
            cls: "done",
            pct: datePct(cfg.progressStart),
            label: "Started",
            date: cfg.progressStart,
          });
        }

        if (cfg.showToday && cfg.workStart) {
          var todayPct = datePct(TODAY);
          var startPct = datePct(cfg.progressStart);
          var finishPct = datePct(cfg.projectedFinish);

          if (
            Math.abs(todayPct - startPct) > 8 &&
            Math.abs(todayPct - finishPct) > 8
          ) {
            progressMarkers.push({
              cls: "today",
              pct: todayPct,
              label: "Today",
              date: TODAY,
            });
          }
        }

        if (cfg.projectedFinish) {
          progressMarkers.push({
            cls: cfg.progressEndClass || "finish",
            pct: datePct(cfg.projectedFinish),
            label: cfg.progressEndLabel,
            date: cfg.progressEndDisplayDate,
          });
        }

        return {
          greenLeftPct: greenLeftPct,
          greenPct: greenPct,
          orangeLeftPct: orangeLeftPct,
          orangePct: orangePct,
          redLeftPct: redLeftPct,
          redPct: redPct,
          doneLeftPct: doneLeftPct,
          donePct: donePct,
          greyLeftPct: greyLeftPct,
          greyWidthPct: greyWidthPct,
          programmeMarkers: spaceTimelineMarkers(programmeMarkers),
          progressMarkers: spaceTimelineMarkers(progressMarkers),
          floatLabel: cfg.floatLabel,
          floatColor: cfg.floatColor,
          startLabel: fmt(timelineStart),
          endLabel: fmt(timelineEnd),
          timelineStart: timelineStart,
          totalSpan: totalSpan,
        };
      }

      function floatPillClass(tl) {
        if (tl.floatColor === "var(--red)") return "red";
        if (tl.floatColor === "var(--orange)") return "orange";
        if (tl.floatColor === "var(--yellow-ink)") return "yellow";
        if (tl.floatColor === "var(--green)") return "green";
        return "neutral";
      }

      function floatPillMarkup(tl) {
        return (
          '<span class="tl-float-pill ' +
          floatPillClass(tl) +
          '">' +
          esc(tl.floatLabel) +
          "</span>"
        );
      }

      function renderTimeline(tl, hideFloatPill) {
        var h = '<div class="tl-wrap">';

        h += '<div class="tl-axis programme">';
        tl.programmeMarkers.forEach(function (m) {
          h += renderTimelineMarker(m);
        });
        h += "</div>";

        h +=
          '<div class="tl-bar-pair" data-tl-start="' +
          dateKey(tl.timelineStart) +
          '" data-tl-span="' +
          tl.totalSpan +
          '">';

        h +=
          '<div class="tl-zones scaled tl-reveal" style="clip-path:inset(0 100% 0 0 round 7px)">';
        if (tl.greenPct > 0)
          h +=
            '<div class="tl-z-green" style="left:' +
            tl.greenLeftPct +
            "%;width:" +
            tl.greenPct +
            '%"></div>';
        if (tl.orangePct > 0)
          h +=
            '<div class="tl-z-orange" style="left:' +
            tl.orangeLeftPct +
            "%;width:" +
            tl.orangePct +
            '%"></div>';
        if (tl.redPct > 0)
          h +=
            '<div class="tl-z-red" style="left:' +
            tl.redLeftPct +
            "%;width:" +
            tl.redPct +
            '%"></div>';
        h += "</div>";

        h +=
          '<div class="tl-prog tl-reveal" style="clip-path:inset(0 100% 0 0 round 7px)">';
        if (tl.donePct > 0)
          h +=
            '<div class="tl-done" style="left:' +
            tl.doneLeftPct +
            "%;width:" +
            tl.donePct +
            '%"></div>';
        if (tl.greyWidthPct > 0)
          h +=
            '<div class="tl-remain" style="left:' +
            tl.greyLeftPct +
            "%;width:" +
            tl.greyWidthPct +
            '%"></div>';
        h += "</div>";

        h += "</div>";

        h += '<div class="tl-axis progress">';
        tl.progressMarkers.forEach(function (m) {
          h += renderTimelineMarker(m);
        });
        h += "</div>";

        if (!hideFloatPill) {
          h +=
            '<div class="tl-labels"><span></span>' +
            floatPillMarkup(tl) +
            "</div>";
        }
        h += "</div>";

        return h;
      }

      function computePackageTimeline(a) {
        var p = a.pkg;

        var planStart = packagePlannedStart(p);

        var workEnd = null;

        var tsAsOf = deliverableItemsAsOf(p.tsItems, TODAY);
        var dwAsOf = deliverableItemsAsOf(p.dwItems, TODAY);
        var calcAsOf = deliverableItemsAsOf(p.calcItems, TODAY);
        var smpAsOf = deliverableItemsAsOf(p.smpItems, TODAY);
        var liveDesignItems = getEffectiveLiveItems(tsAsOf).concat(
          getEffectiveLiveItems(dwAsOf),
          getEffectiveLiveItems(calcAsOf),
          getEffectiveLiveItems(smpAsOf),
        );

        var workStart = getWorkStart(p, TODAY);

        liveDesignItems.forEach(function (it) {
          var c = itemCompletionDate(it);

          if (c && (!workEnd || c > workEnd)) {
            workEnd = c;
          }
        });

        var allDesignComplete =
          liveDesignItems.length === 0 ||
          liveDesignItems.every(function (it) {
            return isCompleteItem(it);
          });

        var calloffState = calloffPlacementState(p, TODAY);

        var coPlaced = !calloffState.required || calloffState.allPlaced;

        var actualFinish = packageActualFinishDate(p, TODAY);

        var allPackageComplete = allDesignComplete && coPlaced;

        var remainingApprovalDays = remainingApprovalForPackage(p, TODAY);
        var plannedFinish = packagePlannedFinish(p, planStart);

        var notStarted = !workStart;

        var greyStartDate = notStarted ? laterOf(planStart, TODAY) : TODAY;

        var projectedFinish = notStarted
          ? planStart && TODAY < planStart
            ? addWdays(greyStartDate, wdays(planStart, plannedFinish))
            : addWdays(greyStartDate, remainingApprovalDays)
          : allDesignComplete && remainingApprovalDays <= 0
            ? actualFinish || greyStartDate
            : addWdays(greyStartDate, remainingApprovalDays);

        var progressStart = workStart;
        var progressEndDate = allPackageComplete
          ? actualFinish
          : workStart
            ? TODAY
            : null;

        var finishLabel;
        var finishDisplayDate = null;

        if (allPackageComplete) {
          finishLabel = "Complete";
          finishDisplayDate = projectedFinish;
        } else if (allDesignComplete && !coPlaced) {
          finishLabel = "Call-off outstanding";
        } else if (remainingApprovalDays > 0) {
          finishLabel = "Finish";
          finishDisplayDate = projectedFinish;
        } else {
          finishLabel = "Today";
          finishDisplayDate = TODAY;
        }

        var programmeOverrunDays =
          a.plannedNegFloat && p.critCO && projectedFinish
            ? Math.abs(wdays(p.critCO, projectedFinish))
            : null;

        var floatLabel = a.plannedNegFloat
          ? "⚠ Programme Risk" +
            (programmeOverrunDays !== null
              ? " - " +
                programmeOverrunDays +
                " day" +
                (programmeOverrunDays === 1 ? "" : "s") +
                " over"
              : " as entered")
          : a.minFloat !== null
            ? a.minFloat < 0
              ? Math.abs(a.minFloat) + "d past critical"
              : a.minFloat + "d float remaining"
            : "On track";

        var floatColor = a.plannedNegFloat
          ? "var(--red)"
          : a.minFloat !== null && a.minFloat < 0
            ? "var(--red)"
            : a.minFloat !== null && a.minFloat <= 5
              ? "var(--orange)"
              : a.section === "PAST"
                ? "var(--yellow-ink)"
                : a.section === "OK"
                  ? "var(--green)"
                  : "var(--orange)";

        var tl = buildTimelineModel({
          planStart: planStart,
          plannedFinish: plannedFinish,
          critIssue: p.critIssue,
          critCO: p.critCO,
          site: p.site,
          workStart: workStart,
          progressStart: progressStart,
          progressEndDate: progressEndDate,
          greyStartDate: greyStartDate,
          projectedFinish: projectedFinish,
          remainingApprovalDays: remainingApprovalDays,
          progressEndLabel: finishLabel,
          progressEndDisplayDate: finishDisplayDate,
          progressEndClass: allPackageComplete ? "finish" : "today",
          showToday: true,
          floatLabel: floatLabel,
          floatColor: floatColor,
        });

        return {
          tl: tl,
          planStart: planStart,
          plannedFinish: plannedFinish,
          projectedFinish: projectedFinish,
          actualStart: progressStart,
          actualEnd: progressEndDate,
        };
      }

      function calDays(a, b) {
        return Math.round((b.getTime() - a.getTime()) / 86400000);
      }

      function computeClientGanttScale(openAssessed) {
        var starts = [TODAY];
        var ends = [];

        openAssessed.forEach(function (a) {
          var timelineData = computePackageTimeline(a);

          if (timelineData.planStart) {
            starts.push(timelineData.planStart);
          }

          if (timelineData.actualStart) {
            starts.push(timelineData.actualStart);
          }

          if (a.pkg.critCO) {
            ends.push(a.pkg.critCO);
          }

          if (timelineData.projectedFinish) {
            ends.push(timelineData.projectedFinish);
          }

          if (timelineData.plannedFinish) {
            ends.push(timelineData.plannedFinish);
          }

          if (timelineData.actualEnd) {
            ends.push(timelineData.actualEnd);
          }
        });

        var rawStart = earliestDate(starts) || TODAY;
        var rawEnd = latestDate(ends) || addWdays(rawStart, 30);

        if (rawEnd.getTime() <= rawStart.getTime()) {
          rawEnd = addWdays(rawStart, 1);
        }

        var start = new Date(rawStart.getFullYear(), rawStart.getMonth(), 1);
        var end = new Date(rawEnd.getFullYear(), rawEnd.getMonth() + 1, 0);

        var totalDays = Math.max(1, calDays(start, end));

        return {
          start: start,
          end: end,
          totalDays: totalDays,
          datePct: function (d) {
            return d ? clamp((calDays(start, d) / totalDays) * 100, 0, 100) : 0;
          },
        };
      }

      function buildGanttMonthBands(scale) {
        var bands = [];
        var cursor = new Date(
          scale.start.getFullYear(),
          scale.start.getMonth(),
          1,
        );

        while (cursor.getTime() <= scale.end.getTime()) {
          var nextMonth = new Date(
            cursor.getFullYear(),
            cursor.getMonth() + 1,
            1,
          );
          var bandStart = cursor > scale.start ? cursor : scale.start;
          var bandEnd = nextMonth < scale.end ? nextMonth : scale.end;
          var leftPct = scale.datePct(bandStart);
          var widthPct = Math.max(0, scale.datePct(bandEnd) - leftPct);

          bands.push({
            label: cursor.toLocaleDateString("en-GB", {
              month: "short",
              year:
                cursor.getFullYear() !== scale.start.getFullYear()
                  ? "2-digit"
                  : undefined,
            }),
            leftPct: leftPct,
            widthPct: widthPct,
          });

          cursor = nextMonth;
        }

        return bands;
      }

      function ganttDividersHtml(bands) {
        return bands
          .map(function (band) {
            return band.leftPct > 0.3
              ? '<div class="cli-gantt-divider" style="left:' +
                  band.leftPct +
                  '%"></div>'
              : "";
          })
          .join("");
      }

      function ganttHorizontalLinesHtml(rowCount, headerHeightPx, rowHeightPx) {
        var h = "";

        for (var i = 0; i <= rowCount; i++) {
          var topPx = headerHeightPx + i * rowHeightPx;
          h +=
            '<div class="cli-gantt-hline" style="top:' + topPx + 'px"></div>';
        }

        return h;
      }

      function renderClientGanttScaleHtml(bands) {
        var h = '<div class="cli-gantt-scale-row">';
        h += '<div class="cli-gantt-scale-label">Package</div>';
        h += '<div class="cli-gantt-scale-track">';

        bands.forEach(function (band) {
          h +=
            '<div class="cli-gantt-scale-band" style="left:' +
            band.leftPct +
            "%;width:" +
            band.widthPct +
            '%">' +
            esc(band.label) +
            "</div>";
        });

        h += "</div></div>";
        return h;
      }

      function clientGanttLegendHtml() {
        return (
          '<div class="cli-gantt-legend">' +
          '<div class="cli-gantt-status-legend">' +
          '<span class="cli-gantt-status-item">' +
          '<span class="cli-gantt-status-swatch green"></span>' +
          "On track" +
          "</span>" +
          '<span class="cli-gantt-status-item">' +
          '<span class="cli-gantt-status-swatch yellow"></span>' +
          "Off plan" +
          "</span>" +
          '<span class="cli-gantt-status-item">' +
          '<span class="cli-gantt-status-swatch orange"></span>' +
          "Approaching critical" +
          "</span>" +
          '<span class="cli-gantt-status-item">' +
          '<span class="cli-gantt-status-swatch red"></span>' +
          "Critical" +
          "</span>" +
          "</div>" +
          '<div class="cli-gantt-timeline-legend">' +
          '<span class="cli-gantt-legend-item">' +
          '<span class="cli-gantt-legend-bar baseline"></span>' +
          "Baseline programme" +
          "</span>" +
          '<span class="cli-gantt-legend-item">' +
          '<span class="cli-gantt-legend-bar actual"></span>' +
          "Work completed" +
          "</span>" +
          '<span class="cli-gantt-legend-item">' +
          '<span class="cli-gantt-legend-bar remaining"></span>' +
          "Remaining work" +
          "</span>" +
          '<span class="cli-gantt-legend-item">' +
          '<span class="cli-gantt-legend-diamond critical-order"></span>' +
          "Critical order date" +
          "</span>" +
          '<span class="cli-gantt-legend-item">' +
          '<span class="cli-gantt-legend-diamond"></span>' +
          "Baseline site installation date" +
          "</span>" +
          "</div>" +
          "</div>"
        );
      }

      function clientPackageSeverityValue(a) {
        if (a.section === "MIT") {
          if (a.plannedNegFloat && a.pkg.critCO && a.projectedFinish) {
            return Math.abs(wdays(a.pkg.critCO, a.projectedFinish));
          }

          return a.minFloat !== null && a.minFloat !== undefined
            ? Math.abs(a.minFloat)
            : 0;
        }

        if (a.section === "CRIT") {
          return a.minFloat !== null && a.minFloat !== undefined
            ? a.minFloat
            : Infinity;
        }

        if (a.section === "PAST") {
          return clientBreakdownPastPlannedDays(a) || 0;
        }

        return 0;
      }

      function compareClientPackageCriticality(a, b) {
        var criticalityOrder = {
          MIT: 0,
          CRIT: 1,
          PAST: 2,
          OK: 3,
        };

        var aRank =
          criticalityOrder[a.section] !== undefined
            ? criticalityOrder[a.section]
            : 3;

        var bRank =
          criticalityOrder[b.section] !== undefined
            ? criticalityOrder[b.section]
            : 3;

        if (aRank !== bRank) {
          return aRank - bRank;
        }

        if (a.section === "OK") {
          var aPlannedStart = packagePlannedStart(a.pkg);

          var bPlannedStart = packagePlannedStart(b.pkg);

          if (aPlannedStart && bPlannedStart) {
            var dateDifference =
              aPlannedStart.getTime() - bPlannedStart.getTime();

            if (dateDifference !== 0) {
              return dateDifference;
            }
          } else if (aPlannedStart) {
            return -1;
          } else if (bPlannedStart) {
            return 1;
          }

          return String(a.pkg.name).localeCompare(String(b.pkg.name));
        }

        var aSeverity = clientPackageSeverityValue(a);
        var bSeverity = clientPackageSeverityValue(b);

        if (a.section === "CRIT") {
          return aSeverity - bSeverity;
        }

        return bSeverity - aSeverity;
      }

      function buildClientGanttBlocks(assessed) {
        var nextMonthIndex = TODAY.getMonth() + 1;
        var lastDayOfTargetMonth = new Date(
          TODAY.getFullYear(),
          nextMonthIndex + 1,
          0,
        ).getDate();

        var oneMonthFromToday = new Date(
          TODAY.getFullYear(),
          nextMonthIndex,
          Math.min(TODAY.getDate(), lastDayOfTargetMonth),
        );

        var openAssessed = (assessed || [])
          .filter(function (a) {
            if (a.isClosed) return false;

            var plannedStart = packagePlannedStart(a.pkg);
            var workStart = getWorkStart(a.pkg, TODAY);

            var isActive = Boolean(workStart);
            var shouldBeActive = plannedStart && plannedStart <= TODAY;
            var startingWithinOneMonth =
              plannedStart &&
              plannedStart > TODAY &&
              plannedStart <= oneMonthFromToday;

            return isActive || shouldBeActive || startingWithinOneMonth;
          })
          .slice()
          .sort(compareClientPackageCriticality);

        if (!openAssessed.length) {
          return [
            {
              type: "title",
              html:
                '<div class="cli-section-title">Active Package Program</div>' +
                '<div class="cli-empty">No active packages to display.</div>',
            },
          ];
        }

        var scale = computeClientGanttScale(openAssessed);
        var bands = buildGanttMonthBands(scale);

        var todayPct = scale.datePct(TODAY);

        var todayLineHtml =
          '<div class="cli-gantt-today-line" style="left:' +
          todayPct +
          '%" title="Current date: ' +
          fmt(TODAY) +
          '"></div>';

        var dividersHtml = ganttDividersHtml(bands) + todayLineHtml;

        var axisHtml = renderClientGanttScaleHtml(bands);

        var blocks = [
          {
            type: "title",
            html:
              '<div class="cli-section-title">Active Package Program</div>' +
              clientGanttLegendHtml(),
            axisHtml: axisHtml,
            dividersHtml: dividersHtml,
          },
          {
            type: "axis",
            html: axisHtml,
            axisHtml: axisHtml,
            dividersHtml: dividersHtml,
          },
        ];

        openAssessed.forEach(function (a) {
          var p = a.pkg;

          var packageStatusClass = ganttSectionBarClass(a.section);

      function ganttSectionBarClass(section) {
        if (section === "MIT") return "red";
        if (section === "CRIT") return "orange";
        if (section === "PAST") return "yellow";
        return "green";
      }

      function renderClientGanttRow(a, scale) {
        var p = a.pkg;
        var timelineData = computePackageTimeline(a);

        var baselineStart = timelineData.planStart;
        var baselineEnd = timelineData.plannedFinish;

        var actualStart = timelineData.actualStart;
        var actualEnd = timelineData.actualEnd;

        var remainingStart = laterOf(
          actualEnd || timelineData.planStart,
          TODAY,
        );

        var remainingEnd =
          timelineData.projectedFinish || timelineData.plannedFinish;

        var todayPct = scale.datePct(TODAY);

        function renderBar(type, startDate, endDate, label) {
          if (!startDate || !endDate) return "";
          if (endDate.getTime() < startDate.getTime()) return "";

          var leftPct = scale.datePct(startDate);
          var widthPct = Math.max(0.6, scale.datePct(endDate) - leftPct);

          if (type === "actual" && leftPct + widthPct > todayPct) {
            leftPct = Math.max(0, todayPct - widthPct);
            widthPct = todayPct - leftPct;
          }

          return (
            '<div class="cli-gantt-bar ' +
            type +
            '" style="left:' +
            leftPct +
            "%;width:" +
            widthPct +
            '%" title="' +
            esc(label) +
            ": " +
            fmt(startDate) +
            " to " +
            fmt(endDate) +
            '"></div>'
          );
        }

        var h = '<div class="cli-gantt-track">';

        h += renderBar(
          "baseline",
          baselineStart,
          baselineEnd,
          "Baseline programme",
        );

        h += renderBar("actual", actualStart, actualEnd, "Work completed");

        if (
          remainingStart &&
          remainingEnd &&
          remainingEnd.getTime() > remainingStart.getTime()
        ) {
          h += renderBar(
            "remaining",
            remainingStart,
            remainingEnd,
            "Remaining work",
          );
        }

        if (p.critCO) {
          h +=
            '<div class="cli-gantt-diamond crit-calloff" style="left:' +
            scale.datePct(p.critCO) +
            '%" title="Critical call-off date: ' +
            fmt(p.critCO) +
            '"></div>';
        }

        if (p.site) {
          h +=
            '<div class="cli-gantt-diamond" style="left:' +
            scale.datePct(p.site) +
            '%" title="Site date: ' +
            fmt(p.site) +
            '"></div>';
        }

        h += "</div>";
        return h;
      }

      function packageDisplaySectionRank(section) {
        return (
          {
            MIT: 4,
            CRIT: 3,
            PAST: 2,
            OK: 1,
          }[section] || 0
        );
      }

      function compareDisplayAssessments(a, b) {
        var rankDifference =
          packageDisplaySectionRank(b.section) -
          packageDisplaySectionRank(a.section);

        if (rankDifference !== 0) return rankDifference;

        if (!!a.plannedNegFloat !== !!b.plannedNegFloat) {
          return a.plannedNegFloat ? -1 : 1;
        }

        var aFloat =
          a.minFloat === null || a.minFloat === undefined ? 9999 : a.minFloat;

        var bFloat =
          b.minFloat === null || b.minFloat === undefined ? 9999 : b.minFloat;

        return aFloat - bFloat;
      }

      function animateMetricCount(el, target) {
        if (!el) return;

        target = Math.round(Number(target)) || 0;

        window.clearInterval(el._metricAnimTimer);

        el.textContent = "0";

        if (target <= 0) return;

        var totalDuration = 900;
        var stepMs = Math.max(8, totalDuration / target);
        var current = 0;

        el._metricAnimTimer = window.setInterval(function () {
          current++;
          el.textContent = String(current);

          if (current >= target) {
            window.clearInterval(el._metricAnimTimer);
          }
        }, stepMs);
      }

      function animateReportEntry() {
        var container = document.getElementById("mainBody");
        if (!container) return;

        Array.prototype.forEach.call(container.children, function (el, i) {
          el.animate(
            [
              { opacity: 0, transform: "translateY(24px)" },
              { opacity: 1, transform: "translateY(0)" },
            ],
            {
              duration: 700,
              delay: Math.min(i, 10) * 60,
              easing: "cubic-bezier(0.16, 1, 0.3, 1)",
              fill: "both",
            },
          );
        });
      }

      function animateReportTimelineBars(scopeEl) {
        var container = scopeEl || document.getElementById("mainBody");
        if (!container) return;

        var bars = container.querySelectorAll(".tl-reveal");
        if (!bars.length) return;

        bars.forEach(function (bar) {
          bar.style.transition = "none";
          bar.style.clipPath = "inset(0 100% 0 0 round 7px)";
        });

        bars[0].getBoundingClientRect();

        requestAnimationFrame(function () {
          bars.forEach(function (bar) {
            bar.style.transition = "";
          });

          window.setTimeout(function () {
            bars.forEach(function (bar) {
              bar.style.clipPath = "inset(0 0% 0 0 round 7px)";
            });
          }, 200);
        });
      }

      function subItemStatusInfo(it) {
        if (isCompleteItem(it)) {
          return { cls: "green", label: "Closed" };
        }

        var issuedDate = effectiveIssuedDate(it);

        if (!issuedDate) {
          var planDate = it.planned;

          if (planDate) {
            var notIssuedDays = wdays(TODAY, planDate);

            if (notIssuedDays < 0) {
              return { cls: "red", label: "Overdue — not issued" };
            }
            if (notIssuedDays <= 5) {
              return { cls: "orange", label: "Not yet issued" };
            }
            return { cls: "green", label: "Not yet issued" };
          }

          return { cls: "orange", label: "Not yet issued" };
        }

        if (it.statusRec === "C" && it.cmtsRec) {
          return { cls: "red", label: "Reissue required" };
        }

        if (it.cmtsBy && !it.cmtsRec) {
          var d = wdays(TODAY, it.cmtsBy);
          if (d !== null && d < 0) {
            return { cls: "red", label: "Comments overdue" };
          }
          if (d !== null && d <= 5) {
            return { cls: "orange", label: "Comments due soon" };
          }
          return { cls: "green", label: "Awaiting comments" };
        }

        if (
          (it.statusRec === "A" || it.statusRec === "B") &&
          constructionFlagOn(it.constructionFlag) &&
          !it.constructionIssued
        ) {
          return { cls: "orange", label: "Issue for construction" };
        }

        return { cls: "neutral", label: it.currentStatus || "Issued" };
      }

      function calloffItemStatusInfo(it, plannedDate) {
        if (it.issued) {
          return { cls: "green", label: "Placed" };
        }
        if (!plannedDate) {
          return { cls: "neutral", label: "Not placed" };
        }

        var d = wdays(TODAY, plannedDate);

        if (d <= 0) {
          return { cls: "red", label: "Overdue — not placed" };
        }
        if (d <= 5) {
          return { cls: "orange", label: "Not yet placed" };
        }
        return { cls: "green", label: "Not yet placed" };
      }

      function rfiItemStatusInfo(it) {
        if (rfiIsAnswered(it)) {
          return { cls: "green", label: "Answered" };
        }
        if (rfiIsManuallyClosed(it)) {
          return { cls: "neutral", label: "Closed" };
        }
        if (it.required && it.required < TODAY) {
          return { cls: "red", label: "Overdue" };
        }
        if (it.required) {
          return { cls: "orange", label: "Awaiting response" };
        }
        return { cls: "neutral", label: "Awaiting response" };
      }

      function revisionHistoryHtml(it) {
        var history = Array.isArray(it.revisionHistory)
          ? it.revisionHistory
          : [];
        if (!history.length) return "";

        var liveRev = Number(it.rev || 0);
        var liveRc = String(it.rc || "")
          .trim()
          .toUpperCase();

        var priorRevisions = history
          .filter(function (rev) {
            var revNum = Number(rev.rev || 0);
            var revCode = String(rev.rc || "")
              .trim()
              .toUpperCase();
            return !(revNum === liveRev && revCode === liveRc);
          })
          .slice()
          .reverse();

        if (!priorRevisions.length) return "";

        var h = '<details class="revision-history">';
        h += '<summary class="revision-history-hdr">Revision history</summary>';
        h += '<div class="revision-history-list">';

        priorRevisions.forEach(function (rev) {
          var label = rev.rc
            ? esc(String(rev.rc))

          '<div class="section"><div class="sec-hdr ' +
          cls +
          '" data-tog="sec" data-id="' +
          id +
          '">';
        h2 +=
          (hideDot ? "" : '<div class="sec-dot ' + cls + '"></div>') +
          '<div class="sec-title ' +
          cls +
          '">' +
          title +
          "</div>";
        h2 +=
          '<span class="sec-badge ' +
          cls +
          '">' +
          items.length +
          " package" +
          (items.length !== 1 ? "s" : "") +

        h2 += '<span class="sec-chev" id="chv_' + id + '">&#9660;</span></div>';
        h2 += '<div class="sec-body" id="sb_' + id + '">';
        if (!items.length) {
          h2 +=
            '<div style="padding:12px 14px;font-size:11px;color:var(--text3)">No packages in this category.</div>';

              o.assessment.orderedAtRiskState &&
              o.assessment.orderedAtRiskState.orderedAtRisk
            ) {

            }

            var rfiSummaryClosed = summariseRfis(o.pkg, TODAY, true);
            if (rfiSummaryClosed.total > 0) {
              var unansweredCount = rfiItemsAsOf(o.pkg.rfiItems, TODAY).filter(
                function (it) {
                  return !rfiIsAnswered(it) && !rfiIsManuallyClosed(it);
                },
              ).length;
              if (unansweredCount > 0) {
                h2 +=
                  '<div class="rfi-badge">' +

                  (unansweredCount !== 1 ? "s" : "") +

              }
            }
            h2 += "</div>";
            var planStart = packagePlannedStart(o.pkg);
            var closedPlannedFinish = packagePlannedCalloff(o.pkg);

            var outcomeLabel =
              o.daysLateCO !== null && o.daysLateCO > 0
                ? o.daysLateCO + "d late delivery"
                : o.daysLateIssue !== null && o.daysLateIssue > 0
                  ? o.daysLateIssue + "d late, no site impact"
                  : "Completed on plan";

            var outcomeColor =
              cls === "red"
                ? "var(--red)"
                : cls === "orange"
                  ? "var(--orange)"
                  : cls === "yellow"
                    ? "var(--yellow-text)"
                    : cls === "amber"
                      ? "var(--amber)"
                      : "var(--green)";

            var closedStart = o.earliestIssue || planStart;
            var closedFinish = o.effectiveFinish || o.latestCO || closedStart;

            var closedTimeline = buildTimelineModel({
              planStart: planStart,
              plannedFinish: closedPlannedFinish,
              critIssue: o.pkg.critIssue,
              critCO: o.pkg.critCO,
              site: o.pkg.site,
              workStart: closedStart,
              progressStart: closedStart,
              progressEndDate: closedFinish,
              greyStartDate: null,
              projectedFinish: closedFinish,
              remainingApprovalDays: 0,
              progressEndLabel: "Complete",
              progressEndDisplayDate: closedFinish,
              progressEndClass: "finish",
              showToday: false,
              floatLabel: outcomeLabel,
              floatColor: outcomeColor,
            });

            h2 += renderTimeline(closedTimeline);
            h2 +=
              '<div class="pkg-chev" id="pc-' + pid + '">&#9660;</div></div>';
            h2 += '<div class="pkg-expand" id="exp-' + pid + '">';

            h2 +=
              '<div style="padding:10px 14px;font-size:11px;color:var(--text2);line-height:1.9">';
            if (o.daysLateCO !== null && o.daysLateCO > 0) {
              h2 +=
                "<strong>Outcome:</strong> Approval chain completed " +
                o.daysLateCO +
                " working days past critical call-off date.<br>";
              h2 += o.latestCO
                ? "<strong>Call-off placed:</strong> " +
                  fmt(o.latestCO) +
                  "<br>"
                : "<strong>Completed:</strong> " +
                  (o.effectiveFinish ? fmt(o.effectiveFinish) : "—") +
                  "<br>";
              h2 +=
                "<strong>Critical date was:</strong> " +
                fmt(o.pkg.critCO) +
                "<br>";
              h2 +=
                "<strong>Site impact:</strong> Delivery delayed " +
                o.daysLateCO +
                " working days";
            } else if (o.daysLateIssue !== null && o.daysLateIssue > 0) {
              h2 +=
                "<strong>Outcome:</strong> Issue was " +
                o.daysLateIssue +
                " working days late against planned date but completed within float.<br>";
              h2 +=
                "<strong>Site impact:</strong> None — float absorbed the delay.";
            } else {
              h2 +=
                "<strong>Outcome:</strong> Completed on or before planned date.<br><strong>Site impact:</strong> None.";
            }
            h2 += "</div>";

            h2 += renderPackageDetailGrid(o.assessment);

            h2 += "</div>";
          });
        }
        h2 += "</div></div>";
