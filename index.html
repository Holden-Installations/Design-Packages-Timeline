      function dropdownGlideEase(t) {
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }

      function ensureDropdownCentreSpace() {
        var spacer = document.getElementById("dropdown-centre-spacer");

        if (!spacer) {
          spacer = document.createElement("div");
          spacer.id = "dropdown-centre-spacer";
          spacer.setAttribute("aria-hidden", "true");
          spacer.style.width = "100%";
          spacer.style.pointerEvents = "none";
          document.body.appendChild(spacer);
        }

        if (document.getElementById("upSec").style.display !== "none") {
          spacer.style.height = "0px";
          return;
        }

        spacer.style.height = Math.round(window.innerHeight / 2) + "px";
      }

      function centreTriggerDuringGlide(trigger, duration) {
        if (!trigger) return;

        var token = ++activeDropdownScrollToken;
        var startScrollY = window.scrollY;
        var startTime = performance.now();

        function animateScroll(currentTime) {
          if (
            token !== activeDropdownScrollToken ||
            !document.body.contains(trigger)
          ) {
            return;
          }

          var progress = Math.min((currentTime - startTime) / duration, 1);

          var easedProgress = dropdownGlideEase(progress);
          var triggerRect = trigger.getBoundingClientRect();

          var triggerDocumentCentre =
            window.scrollY + triggerRect.top + triggerRect.height / 2;

          var targetScrollY = triggerDocumentCentre - window.innerHeight / 2;

          var maximumScrollY = Math.max(
            0,
            document.documentElement.scrollHeight - window.innerHeight,
          );

          targetScrollY = Math.max(0, Math.min(targetScrollY, maximumScrollY));

          window.scrollTo(
            0,
            startScrollY + (targetScrollY - startScrollY) * easedProgress,
          );

          if (progress < 1) {
            requestAnimationFrame(animateScroll);
          }
        }

        requestAnimationFrame(animateScroll);
      }

      function glidePanel(panel, shouldOpen, trigger) {
        if (!panel) return;

        var duration = DROPDOWN_GLIDE_MS;
        var isPkgCard = panel.classList.contains("pkg-expand");
        var easing = "cubic-bezier(0.16, 1, 0.3, 1)";

        panel._glideToken = (panel._glideToken || 0) + 1;
        var token = panel._glideToken;
        var currentHeight = panel.getBoundingClientRect().height;

        panel.style.transition = "none";
        panel.style.display = "block";
        panel.style.overflow = "hidden";
        panel.style.height = currentHeight + "px";
        panel.style.opacity = currentHeight > 0 ? "1" : "0";

        var pkgItems = isPkgCard
          ? panel.querySelectorAll(".del-grid > div")
          : null;

        if (isPkgCard) {
          panel.style.transformOrigin = "top center";
          panel.style.transform =
            currentHeight > 0
              ? "translateY(0) scale(1)"
              : "translateY(-6px) scale(0.985)";

          pkgItems.forEach(function (el) {
            el.getAnimations().forEach(function (anim) {
              anim.cancel();
            });
          });

          if (shouldOpen) {
            pkgItems.forEach(function (el) {
              el.style.opacity = "0";
              el.style.transform = "translateY(6px)";
            });
          } else {
            pkgItems.forEach(function (el) {
              el.style.removeProperty("opacity");
              el.style.removeProperty("transform");
            });
          }
        }

        if (shouldOpen) {
          panel.classList.add("open");
        } else {
          panel.classList.remove("open");
        }

        var targetHeight = shouldOpen ? panel.scrollHeight : 0;

        void panel.offsetHeight;

        panel.style.transition =
          "height " +
          duration +
          "ms " +
          easing +
          ", opacity " +
          duration +
          "ms " +
          easing +
          (isPkgCard ? ", transform " + duration + "ms " + easing : "");

        if (shouldOpen && trigger) {
          centreTriggerDuringGlide(trigger, duration);
        }

        requestAnimationFrame(function () {
          if (panel._glideToken !== token) return;

          panel.style.height = targetHeight + "px";
          panel.style.opacity = shouldOpen ? "1" : "0";

          if (isPkgCard) {
            panel.style.transform = shouldOpen
              ? "translateY(0) scale(1)"
              : "translateY(-6px) scale(0.985)";
          }

          if (isPkgCard && shouldOpen) {
            requestAnimationFrame(function () {
              if (panel._glideToken !== token) return;
              animatePkgCardEntry(pkgItems);
            });
          }
        });

        window.setTimeout(function () {
          if (panel._glideToken !== token) return;

          panel.style.removeProperty("display");
          panel.style.removeProperty("height");
          panel.style.removeProperty("opacity");
          panel.style.removeProperty("overflow");
          panel.style.removeProperty("transition");
          panel.style.removeProperty("transform");
          panel.style.removeProperty("transform-origin");
        }, duration + 30);
      }

      function animatePkgCardEntry(items) {
        if (!items || !items.length) return;

        items.forEach(function (item, i) {
          item.getAnimations().forEach(function (anim) {
            anim.cancel();
          });
          item.style.removeProperty("opacity");
          item.style.removeProperty("transform");

          var anim = item.animate(
            [
              { opacity: 0, transform: "translateY(6px)" },
              { opacity: 1, transform: "translateY(0)" },
            ],
            {
              duration: 380,
              delay: Math.min(i, 6) * 45,
              easing: "cubic-bezier(0.16, 1, 0.3, 1)",
              fill: "both",
            },
          );

          anim.onfinish = function () {
            item.style.removeProperty("opacity");
            item.style.removeProperty("transform");
          };
        });
      }

      function parseDateKey(key) {
        if (!key) return null;
        var parts = key.split("-");
        if (parts.length !== 3) return null;
        var y = Number(parts[0]),
          m = Number(parts[1]),
          d = Number(parts[2]);
        if (!y || !m || !d) return null;
        return new Date(y, m - 1, d);
      }

      function updateTimelineHover(bar, e) {
        var start = parseDateKey(bar.getAttribute("data-tl-start"));
        var span = Number(bar.getAttribute("data-tl-span") || 0);
        if (!start || !span) return;

        var rect = bar.getBoundingClientRect();
        if (!rect.width) return;

        var pct = clamp(((e.clientX - rect.left) / rect.width) * 100, 0, 100);
        var offset = Math.round((pct / 100) * span);
        var hoveredDate = addWdays(start, offset);
        if (!hoveredDate) return;

        var indicator = getTimelineHoverIndicator();
        if (indicator.parentElement !== bar) bar.appendChild(indicator);

        indicator.style.left = pct + "%";

        var label = indicator.querySelector(".tl-hover-label");
        label.textContent = fmt(hoveredDate);
        label.classList.toggle("tl-hover-label--start", pct < 6);
        label.classList.toggle("tl-hover-label--end", pct > 94);

        indicator.classList.add("show");
      }

      function hideTimelineHover() {
        if (timelineHoverEl) timelineHoverEl.classList.remove("show");
      }

      function spaceOutTimelineMarkers(pkgRow) {
        var axes = pkgRow.querySelectorAll(".tl-axis");

        Array.prototype.forEach.call(axes, function (axis) {
          var marks = axis.querySelectorAll(".tl-mark");
          if (!marks.length) return;

          Array.prototype.forEach.call(marks, function (mark) {
            mark.style.setProperty("--xshift", "0px");
          });

          var axisRect = axis.getBoundingClientRect();
          if (!axisRect.width) return;

          var gap = 4;
          var tailHeight = 5;
          var tailBaseHalfWidth = 4;
          var tailOverlap = 1;
          var isProgramme = axis.classList.contains("programme");

          var items = Array.prototype.map.call(marks, function (mark) {
            var rect = mark.getBoundingClientRect();
            return {
              mark: mark,
              pct: Number(mark.getAttribute("data-tl-pct")) || 0,
              left: rect.left - axisRect.left,
              width: rect.width,
              pairKey: mark.getAttribute("data-tl-pair-key"),
            };
          });

          items.sort(function (a, b) {
            return a.left - b.left;
          });

          var prevRight = null;
          var prevPairKey = null;

          items.forEach(function (item) {
            var shift = 0;

            var requiredGap =
              item.pairKey && item.pairKey === prevPairKey ? 0 : gap;

            if (prevRight !== null && item.left < prevRight + requiredGap) {
              shift = prevRight + requiredGap - item.left;
              item.mark.style.setProperty("--xshift", shift + "px");
            }

            prevRight = item.left + shift + item.width;
            prevPairKey = item.pairKey;

            var tail = item.mark.previousElementSibling;
            if (!tail || !tail.classList.contains("tl-mark-tail")) return;

            var tipX = (item.pct / 100) * axisRect.width;

            var align = item.mark.classList.contains("start")
              ? "start"
              : item.mark.classList.contains("end")
                ? "end"
                : "center";

            var baseX =
              align === "start"
                ? item.left + shift
                : align === "end"
                  ? item.left + shift + item.width
                  : item.left + shift + item.width / 2;

            var tailWidth = tailBaseHalfWidth * 2;

            var baseLeftXAbs, baseRightXAbs;

            if (align === "start") {
              baseLeftXAbs = baseX;
              baseRightXAbs = baseX + tailWidth;
            } else if (align === "end") {
              baseLeftXAbs = baseX - tailWidth;
              baseRightXAbs = baseX;
            } else {
              baseLeftXAbs = baseX - tailBaseHalfWidth;
              baseRightXAbs = baseX + tailBaseHalfWidth;
            }

            var minX = Math.min(tipX, baseLeftXAbs);
            var maxX = Math.max(tipX, baseRightXAbs);
            var w = Math.max(1, maxX - minX);

            var localTipX = tipX - minX;
            var baseLeftX = baseLeftXAbs - minX;
            var baseRightX = baseRightXAbs - minX;

            var totalHeight = tailHeight + tailOverlap;

            var baseY = isProgramme ? 0 : totalHeight;
            var tipY = isProgramme ? totalHeight : 0;
            var midY = totalHeight * 0.5;

            var dBody;

            if (align === "start") {
              dBody =
                "M" +
                baseLeftX +
                " " +
                baseY +
                " L" +
                baseLeftX +
                " " +
                tipY +
                " L" +
                localTipX +
                " " +
                tipY +
                " Q" +
                (baseRightX + (localTipX - baseRightX) * 0.4) +
                " " +
                midY +
                " " +
                baseRightX +
                " " +
                baseY;
            } else if (align === "end") {
              dBody =
                "M" +
                baseRightX +
                " " +
                baseY +
                " L" +
                baseRightX +
                " " +
                tipY +
                " L" +
                localTipX +
                " " +
                tipY +
                " Q" +
                (baseLeftX + (localTipX - baseLeftX) * 0.4) +
                " " +
                midY +
                " " +
                baseLeftX +
                " " +
                baseY;
            } else {
              dBody =
                "M" +
                baseLeftX +
                " " +
                baseY +
                " Q" +
                (baseLeftX + (localTipX - baseLeftX) * 0.4) +
                " " +
                midY +
                " " +
                localTipX +
                " " +
                tipY +
                " Q" +
                (baseRightX + (localTipX - baseRightX) * 0.4) +
                " " +
                midY +
                " " +
                baseRightX +
                " " +
                baseY;
            }

            tail.setAttribute("width", w);
            tail.setAttribute("height", totalHeight);
            tail.setAttribute("viewBox", "0 0 " + w + " " + totalHeight);
            tail.style.left = minX + "px";
            tail.innerHTML =
              '<path class="tl-mark-tail-fill" d="' +
              dBody +
              ' Z"></path>' +
              '<path class="tl-mark-tail-stroke" d="' +
              dBody +
              '"></path>';
          });
        });
      }

      function getDetailsContent(details) {
        var children = details.children;

        for (var i = 0; i < children.length; i++) {
          if (
            children[i].classList.contains("subitems-list") ||
            children[i].classList.contains("revision-details") ||
            children[i].classList.contains("revision-history-list") ||
            children[i].classList.contains("revision-history-details")
          ) {

        return null;

      function glideDetails(details, shouldOpen, trigger) {
        if (!details) return;

        var content = getDetailsContent(details);

        if (!content) {
          details.open = shouldOpen;
          return;
        }

        var duration = DROPDOWN_GLIDE_MS;

        if (details._glideTimer) {
          clearTimeout(details._glideTimer);
        }

        if (shouldOpen) {
          details.open = true;

          content.style.transition = "none";
          content.style.height = "0px";
          content.style.opacity = "0";
          content.style.overflow = "hidden";

          void content.offsetHeight;

          var targetHeight = content.scrollHeight;

          content.style.transition =
            "height " +
            duration +
            "ms cubic-bezier(0.4, 0, 0.2, 1), " +
            "opacity " +
            duration +
            "ms cubic-bezier(0.4, 0, 0.2, 1)";

          if (trigger) {
            centreTriggerDuringGlide(trigger, duration);
          }

          requestAnimationFrame(function () {
            content.style.height = targetHeight + "px";
            content.style.opacity = "1";
          });

          details._glideTimer = setTimeout(function () {
            content.style.removeProperty("height");
            content.style.removeProperty("opacity");
            content.style.removeProperty("overflow");
            content.style.removeProperty("transition");
          }, duration + 30);

          return;
        }

        if (!details.open) return;

        content.style.transition = "none";
        content.style.height = content.scrollHeight + "px";
        content.style.opacity = "1";
        content.style.overflow = "hidden";

        void content.offsetHeight;

        content.style.transition =
          "height " +
          duration +
          "ms cubic-bezier(0.4, 0, 0.2, 1), " +
          "opacity " +
          duration +
          "ms cubic-bezier(0.4, 0, 0.2, 1)";

        requestAnimationFrame(function () {
          content.style.height = "0px";
          content.style.opacity = "0";
        });

        details._glideTimer = setTimeout(function () {
          details.open = false;

          content.style.removeProperty("height");
          content.style.removeProperty("opacity");
          content.style.removeProperty("overflow");
          content.style.removeProperty("transition");
        }, duration + 30);
      }

      function handleFile(e) {

        e.target.value = "";

      function processFile(f) {
        var r = new FileReader();
        r.onload = function (e) {
          try {
            var wb = XLSX.read(e.target.result, {
              type: "array",
              cellDates: true,

            var data = parseWB(wb);
            renderReport(data, f.name.replace(/\.[^.]+$/, ""));
          } catch (err) {
            alert("Error: " + err.message);

        };
        r.readAsArrayBuffer(f);

          if (!window.__breakdownFieldState[pkgName]) {
            window.__breakdownFieldState[pkgName] = {};

          window.__breakdownFieldState[pkgName][option] = element.checked;

          renderClientReportPreview();

      document.addEventListener("click", function (e) {

        function closeById(bodyPrefix, chevPrefix, id) {
          var b = document.getElementById(bodyPrefix + id);
          var c = document.getElementById(chevPrefix + id);

          if (b) glidePanel(b, false);

        function closeSiblingSections(activeEl, activeId) {
          var wrapper = activeEl.parentElement;

// bundled monday SDK above has its own internal console.error calls) —
// gets reported automatically, with no need to find and wire each call
// site individually. The original console.error still runs first, so
// devtools output is completely unchanged; this only adds reporting.
//
// monday's own platform script (loaded into every custom-view iframe for
// its own telemetry) reassigns console.error AFTER this script runs,
// which would silently overwrite a simple one-time override. Using a
// property accessor instead of a plain assignment means any later
// reassignment (console.error = something) is caught by our setter and
// wrapped, rather than replacing our hook outright — so both monday's
// tracking and ours keep working no matter what assigns to it, or when.
(function () {

  var colArg = useIds ? "(ids: $cols)" : "";
  var cvFrag =
    "id type text column { title } ... on MirrorValue { display_value } ... on StatusValue { label } " +
    "... on BoardRelationValue { display_value }";
  var q =
    "query ($ids: [ID!]" + (useIds ? ", $cols: [String!]" : "") + ") { items(ids: $ids, limit: " + CHUNK + ") {" +
    " id name board { id } column_values" + colArg + " { " + cvFrag + " }" +
    " parent_item { id subitems { id name column_values" + colArg + " { " + cvFrag + " } } } } }";
  function toRec(it) {
    var f = {};
    (it.column_values || []).forEach(function (cv) {
      var key = mNorm(cv.column && cv.column.title);
      if (key && f[key] === undefined) f[key] = mVal(cv);
    });
    return { id: it.id, name: it.name, f: f };
  }
  var chunks = [];
  for (var i = 0; i < ids.length; i += CHUNK) chunks.push(ids.slice(i, i + CHUNK));
  var done = 0;
  await mPool(
    chunks.map(function (chunk) {
      return async function () {
        var vars = { ids: chunk };
        if (useIds) vars.cols = mState.linkedColIds;
        var res = await mApiRetry(q, vars);
        (res.data.items || []).forEach(function (it) {
          var rec = toRec(it);
          rec.boardId = it.board && it.board.id;
          rec.history = it.parent_item && it.parent_item.subitems ? it.parent_item.subitems.map(toRec) : null;
          out[it.id] = rec;
        });
        done++;
        mProgress(0.35 + 0.63 * (done / chunks.length));
      };
    }),
    PARALLEL,
  );
  return out;
}

// =====================================================================
// BUILD `data` IN THE TRACKER'S SHAPE
// =====================================================================
function mRevisionItem(rec, ref, title, idx) {
  return {
    ref: ref,
    title: title || mPick(rec, ["title"]),
    rev: idx,
    rc: mPick(rec, ["revision code"]),
    planned: mDate(mPick(rec, ["planned issue date"])),
    issued: mDate(mPick(rec, ["actual issue date"])),
    cmtsBy: mDate(mPick(rec, ["date comments required"])),
    cmtsRec: mDate(mPick(rec, ["date comments received"])),
    statusRec: mLetter(mPick(rec, ["status received"])) || mLetter(mPick(rec, ["current status"])),
    constructionIssued: mDate(mPick(rec, ["construction issue date"])),
    constructionFlag: /issue for construction/i.test(mPick(rec, ["chain position"])) ? 1 : 0,
    itemType: "",
    nextRevPlanned: null,
    _void: /void/i.test(mPick(rec, ["version"])) || mLetter(mPick(rec, ["status received"])) === "VOID",
    _H: mNum(mPick(rec, ["holden review time"])),
    _Hrev: mNum(mPick(rec, ["holden review time(revision)", "holden review time (revision)"])),
    _C: mNum(mPick(rec, ["client review time"])),
  };
}

function mBuildData() {
  var raw = mState.raw;
  var linked = raw.linked;
  var data = { projName: "", projNum: "", client: "", pkgs: {} };
  mState.meta = {};
  mState.missingReview = [];
  var projects = {};

  raw.items.forEach(function (item) {
    var val = {}, links = {};
    item.column_values.forEach(function (cv) {
      val[cv.id] = mVal(cv);
      if (cv.linked_item_ids) links[cv.id] = cv.linked_item_ids;
    });
    var g = function (k) { return mState.pkgCol[k] ? val[mState.pkgCol[k]] || "" : ""; };
    var L = function (k) { return mState.pkgCol[k] ? links[mState.pkgCol[k]] || [] : []; };

    var project = g("project");
    if (project) projects[project] = true;
    if (mState.projectFilter && project !== mState.projectFilter) return;

    // Lead time: Supplier Lead Time mirror, else Material Order "Lead Time (days)".
    var lead = mNum(g("leadTime"));
    L("procurement").forEach(function (id) {
      var rec = linked[id];
      if (!rec) return;
      var key = Object.keys(rec.f).find(function (t) { return /^lead time/.test(t); });
      var n = key ? mNum(rec.f[key]) : null;
      if (n && (!lead || n > lead)) lead = n;
    });
    var leadKnown = !!(lead && lead > 0);

    var site = mDate(g("siteInstall"));
    var plannedStart = mDate(g("plannedStart"));
    var plannedFinish = mDate(g("plannedFinish"));
    // With a lead time, Critical Call-Off = Site Install − lead time.
    // Without one, the board's formula falls back to Site Install itself, so
    // the timeline still shows the buffer up to site install and the
    // critical zone after it. The float pill flags that lead time is missing.
    var critCO = mDate(g("criticalCalloff"));
    if (leadKnown) {
      if ((!critCO || (site && +critCO === +site)) && site) critCO = addWdays(site, -lead);
    } else {
      critCO = critCO || site;
    }
    var chain = (M_DEF_H + M_DEF_C) * 2;
    var critIssue = critCO ? addWdays(critCO, -chain) : null;

    var name = item.name;
    if (data.pkgs[name]) name = name + " (" + item.id + ")";

    var pkg = {
      name: name,
      mondayId: item.id,
      site: site,
      critCO: critCO,
      critIssue: critIssue,
      supplierDecision: null,
      designStart: plannedStart,
      designDuration: 0,
      leadFromOrder: lead || 0,
      leadFromDrawing: 0,
      tsPlanned: plannedStart,
      dwPlanned: plannedStart,
      coPlanned: plannedFinish,
      criticalDates: { techSub: critIssue, drawings: critIssue, calculations: critIssue, samples: critIssue, calloff: critCO },
      approvalPeriod: M_APPROVAL,
      firstRevPeriod: M_FIRST_REV,
      secondRevPeriod: M_SECOND_REV,
      chain: chain,
      tsItems: [], dwItems: [], calcItems: [], smpItems: [], coItems: [], rfiItems: [],
    };

    var seenCO = {};
    function addCalloff(id) {
      if (seenCO[id]) return;
      seenCO[id] = true;
      var rec = linked[id];
      pkg.coItems.push({
        ref: rec ? rec.name : "Call-off " + id,
        title: mPick(rec, ["co id"]),
        planned: mDate(mPick(rec, ["planned issue"])) || plannedFinish,
        issued: mDate(mPick(rec, ["actual issue"])) || mDate(mPick(rec, ["date issued"])),
      });
    }

    (item.subitems || []).forEach(function (sub) {
      var sv = {}, sl = {};
      sub.column_values.forEach(function (cv) {
        sv[cv.id] = mVal(cv);
        if (cv.linked_item_ids) sl[cv.id] = cv.linked_item_ids;
      });
      var s = function (k) { return mState.subCol[k] ? sv[mState.subCol[k]] || "" : ""; };
      var sL = function (k) { return mState.subCol[k] ? sl[mState.subCol[k]] || [] : []; };
      var store = mStore(s("category"));

      if (store === "coItems") {
        var coIds = sL("callOffs");
        if (coIds.length) coIds.forEach(addCalloff);
        else pkg.coItems.push({ ref: sub.name, title: s("title"), planned: mDate(s("calloffPlanned")) || plannedFinish, issued: null });
        return;
      }

      var current = linked[sL("currentRevision")[0]];
      var recs = current ? current.history || [current] : [];
      var revs = recs
        .map(function (r, idx) { return mRevisionItem(r, sub.name, s("title"), idx); })
        .filter(function (r) { return !r._void; });

      if (!revs.length) {
        // No linked revision yet — use the subitem's own mirrors.
        revs = [{
          ref: sub.name, title: s("title"), rev: 0, rc: s("revisionCode"),
          planned: mDate(s("plannedIssue")) || plannedStart,
          issued: mDate(s("actualIssue")), cmtsBy: mDate(s("commentsReqd")), cmtsRec: null,
          statusRec: "", constructionIssued: null, constructionFlag: 0, itemType: "", nextRevPlanned: null,
        }];
      }
      revs.forEach(function (r, idx) {
        r.rev = idx;
        if (!r.planned) r.planned = plannedStart;
        var next = revs[idx + 1];
        r.nextRevPlanned = next ? next.planned : null;
        delete r._void;
      });
      var history = revs.map(function (r) {
        return { rev: r.rev, rc: r.rc, planned: r.planned, statusRec: r.statusRec, issued: r.issued, cmtsRec: r.cmtsRec, constructionIssued: r.constructionIssued };
      });
      mResolveReviewTimes(revs, name, sub.name);
      revs.forEach(function (r) { r.revisionHistory = history; pkg[store].push(r); });
    });
    L("callOffs").forEach(addCalloff);

    L("rfis").forEach(function (id) {
      var rec = linked[id];
      if (!rec) return;
      var raised = mDate(mPick(rec, ["date raised"]));
      var required = mDate(mPick(rec, ["response required", "date response required"]));
      pkg.rfiItems.push({
        ref: rec.name,
        status: /closed/i.test(mPick(rec, ["status"])) || /closed/i.test(mPick(rec, ["response status"])) ? "Closed" : mPick(rec, ["status"]),
        title: mPick(rec, ["rfi title"]),
        issued: raised || TODAY,
        required: required || (raised ? addWdays(raised, 5) : null),
        received: mDate(mPick(rec, ["response received", "date response received"])),
        type: "",
      });
    });

    mApplyPackageChain(pkg);
    data.pkgs[name] = pkg;
    var floatRaw = g("floatDays");
    mState.meta[name] = {
      stateLabel: g("state"),
      section: mSection(g("state")),
      float: floatRaw !== "" && !isNaN(Number(floatRaw)) ? Number(floatRaw) : null,
      leadKnown: leadKnown,
    };
  });

  mState.projects = Object.keys(projects).sort();
  // Project name: the selected project, or the only project on the board,
  // else the board name.
  data.projName =
    mState.projectFilter ||
    (mState.projects.length === 1 ? mState.projects[0] : mState.boardName);
  return data;
}

// =====================================================================
// OVERRIDES OF THE ORIGINAL ENGINE
// Item-level detail (deliverable cards, due pills, actions, comments)
// still comes from the original rules; the package-level verdict comes
// from the board.
// =====================================================================
var _origComputePackageTimeline = computePackageTimeline;

packageHasAnyTrackedItems = function () { return true; };

computeAssessedList = function (data, asOfDate) {
  return Object.values(data.pkgs).map(function (p) {
    var a = assess(p, asOfDate);
    a.pkg = p;
    var m = mState.meta[p.name] || {};
    a.isClosed = m.section === "CLOSED";
    if (m.section && m.section !== "CLOSED") a.section = m.section;
    if (m.float !== null && m.float !== undefined) a.minFloat = m.float;
    a.plannedNegFloat = m.leadKnown && m.float !== null && m.float < 0;
    a.boardMeta = m;
    return a;
  });
};

computePackageTimeline = function (a) {
  var res = _origComputePackageTimeline(a);
  var m = a.boardMeta || {};
  var tl = res.tl;
  if (a.isClosed) return res;
  if (!m.leadKnown) mNoLeadZones(a, res);
  if (m.float === null || m.float === undefined) {
    tl.floatLabel = "Float not available";
    tl.floatColor = "neutral";
  } else if (!m.leadKnown) {
    tl.floatLabel = m.float + "d to site install, lead time not set";
    tl.floatColor = "neutral";
  } else {
    tl.floatLabel = m.float < 0 ? Math.abs(m.float) + "d past critical" : m.float + "d float remaining";
    tl.floatColor =
      a.section === "MIT" ? "var(--red)"
      : a.section === "CRIT" ? "var(--orange)"
      : a.section === "PAST" ? "var(--yellow-ink)"
      : a.section === "OK" ? "var(--green)"
      : "neutral";
  }
  return res;
};

// ---- Review times (Holden / Client) ---------------------------------
// Each revision carries its own Holden Review Time, Holden Review Time
// (Revision) and Client Review Time. A blank value falls back to the
// nearest earlier revision of the same deliverable, then any revision,
// then the defaults above (and the deliverable is listed in a note).
function mResolveReviewTimes(revs, pkgName, ref) {
  var missing = false;
  ["_H", "_Hrev", "_C"].forEach(function (k) {
    var anyVal = null;
    revs.forEach(function (r) { if (r[k] > 0 && anyVal === null) anyVal = r[k]; });
    var last = null;
    revs.forEach(function (r) {
      if (r[k] > 0) last = r[k];
      else r[k] = last !== null ? last : anyVal;
    });
  });
  revs.forEach(function (r) {
    if (!(r._H > 0)) { r._H = M_DEF_H; missing = true; }
    if (!(r._Hrev > 0)) { r._Hrev = M_DEF_HREV; missing = true; }
    if (!(r._C > 0)) { r._C = M_DEF_C; missing = true; }
    r.revH = r._H; r.revHrev = r._Hrev; r.revC = r._C;
    delete r._H; delete r._Hrev; delete r._C;
  });
  if (missing) mState.missingReview.push({ pkg: pkgName, ref: ref });
}

// Full chain for a first issue = (Holden + Client) × 2, taken from each
// deliverable's current revision. The package uses its longest chain so
// the critical issue date is never optimistic.
function mApplyPackageChain(pkg) {
  var maxChain = 0, maxH = 0, maxHrev = 0, maxC = 0;
  ["tsItems", "dwItems", "calcItems", "smpItems"].forEach(function (store) {
    var byRef = {};
    pkg[store].forEach(function (it) {
      if (!byRef[it.ref] || it.rev > byRef[it.ref].rev) byRef[it.ref] = it;
    });
    Object.keys(byRef).forEach(function (ref) {
      var it = byRef[ref];
      maxChain = Math.max(maxChain, (it.revH + it.revC) * 2);
      maxH = Math.max(maxH, it.revH);
      maxHrev = Math.max(maxHrev, it.revHrev);
      maxC = Math.max(maxC, it.revC);
    });
  });
  if (!maxChain) {
    maxChain = (M_DEF_H + M_DEF_C) * 2;
    maxH = M_DEF_H; maxHrev = M_DEF_HREV; maxC = M_DEF_C;
  }
  pkg.chain = maxChain;
  pkg.approvalPeriod = maxC;
  pkg.firstRevPeriod = maxHrev;
  pkg.secondRevPeriod = maxH;
  pkg.critIssue = pkg.critCO ? addWdays(pkg.critCO, -maxChain) : null;
  ["techSub", "drawings", "calculations", "samples"].forEach(function (k) {
    pkg.criticalDates[k] = pkg.critIssue;
  });
}

// Working days of approval left on one deliverable, using its own
// review times (same structure as the original rules).
remainingApprovalForItem = function (it, p, asOfDate) {
  if (!it) return 0;
  if (isCompleteItem(it)) return 0;

  var H = it.revH || p.secondRevPeriod || M_DEF_H;
  var Hrev = it.revHrev || p.firstRevPeriod || M_DEF_HREV;
  var C = it.revC || p.approvalPeriod || M_DEF_C;
  var full = (H + C) * 2;
  var issuedDate = effectiveIssuedDate(it);

  if (!issuedDate) {
    return isReissue(it) ? Hrev + C : full;
  }
  if (it.cmtsBy && !it.cmtsRec) {
    var commentDays = wdays(asOfDate, it.cmtsBy);
    commentDays = commentDays !== null ? Math.max(0, commentDays) : C;
    return isFirstIssue(it) ? commentDays + Hrev + C : commentDays;
  }
  if (it.statusRec === "C" && it.cmtsRec) return Hrev + C;
  if (it.statusRec === "B") return Hrev;
  if (it.statusRec === "A" && constructionFlagOn(it.constructionFlag)) return 2;
  return full;
};

// Without a lead time the critical call-off is just the site install date,
// so a separate "critical" zone would be misleading. The span from planned
// call-off to site install is drawn as ONE colour — amber while the
// projection lands before site install, red once it doesn't — labelled
// "Lead time not available". The Critical CO marker is dropped.
function mNoLeadZones(a, res) {
  var tl = res.tl, p = a.pkg;
  if (!p.site) return;
  var pct = function (d) {
    return d ? clamp((wdays(tl.timelineStart, d) / tl.totalSpan) * 100, 0, 100) : 0;
  };
  var from = res.plannedFinish || res.planStart || tl.timelineStart;
  var fromPct = pct(from);
  var sitePct = pct(p.site);
  var late =
    (res.projectedFinish && res.projectedFinish > p.site) ||
    (!a.isClosed && TODAY > p.site);

  if (late) {
    tl.orangePct = 0;
    tl.redLeftPct = fromPct;
    tl.redPct = Math.max(0, 100 - fromPct);
  } else {
    tl.orangeLeftPct = fromPct;
    tl.orangePct = Math.max(0, sitePct - fromPct);
    tl.redPct = 0;
  }
  var left = late ? tl.redLeftPct : tl.orangeLeftPct;
  var width = late ? tl.redPct : tl.orangePct;
  tl.noLeadNote = width > 0 ? { left: left, width: width, late: late } : null;
  tl.programmeMarkers = tl.programmeMarkers.filter(function (mk) { return mk.cls !== "calloff"; });
}

var _origRenderTimeline = renderTimeline;
renderTimeline = function (tl, hideFloatPill) {
  var html = _origRenderTimeline(tl, hideFloatPill);
  if (!tl.noLeadNote) return html;
  var n = tl.noLeadNote;
  var note =
    '<div class="tl-zone-note' + (n.late ? " late" : "") + '" style="left:' + n.left + "%;width:" + n.width +
    '%">Lead time not available</div>';
  var marker = 'class="tl-zones scaled tl-reveal" style="clip-path:inset(0 100% 0 0 round 7px)">';
  var i = html.indexOf(marker);
  return i < 0 ? html : html.slice(0, i + marker.length) + note + html.slice(i + marker.length);
};

// Drafting Plan packages get their own section after On Track.
var _origProjectReportBodyHtml = projectReportBodyHtml;
projectReportBodyHtml = function (mit, crit, past, ok, closedAssessed, assessed) {
  var draft = assessed
    .filter(function (a) { return !a.isClosed && a.section === "DRAFT"; })
    .sort(compareDisplayAssessments);
  var h = '<div class="area-label">Open Packages</div>';
  h += renderSection("Level 3 Mitigation Required - Project Leads, Project Senior Management, Projects Director", "red", mit, "MIT");
  h += renderSection("Level 2 Approaching Critical - Project Leads, Project Senior Management", "orange", crit, "CRIT");
  h += renderSection("Level 1 Past Planned - Project Leads", "yellow", past, "PAST");
  h += renderSection("On Track", "green", ok, "OK");
  if (draft.length) h += renderSection("Drafting Plan", "grey", draft, "DRAFT");
  h += renderClosedSection(closedAssessed);
  h += renderActions(assessed);
  return h;
};

// Week-on-week trend: the board has no history, so the view keeps its own
// daily snapshot of the four counts in monday storage.
var mHistory = {};
getSummaryCounts = function (data, asOfDate) {
  var key = null;
  Object.keys(mHistory).forEach(function (k) {
    if (new Date(k) <= asOfDate && (!key || k > key)) key = k;
  });
  return key ? mHistory[key] : null;
};
var _origUpdateSummaryComparison = updateSummaryComparison;
updateSummaryComparison = function (current, previous) {
  if (!previous) {
    ["sT1", "sT2", "sT3", "sT4"].forEach(function (id) {
      var el = document.getElementById(id);
      el.className = "sum-trend neutral";
      el.textContent = "";
    });
    mSaveSnapshot(current);
    return;
  }
  _origUpdateSummaryComparison(current, previous);
  mSaveSnapshot(current);
};
function mStorageKey() {
  return "summaryHistory:" + (mState.projectFilter || "all");
}
async function mLoadHistory() {
  mHistory = {};
  try {
    var r = await monday.storage.instance.getItem(mStorageKey());
    var v = r && r.data && r.data.value;
    if (v) mHistory = JSON.parse(v) || {};
  } catch (e) { /* storage unavailable — trend stays hidden */ }
}
function mSaveSnapshot(counts) {
  try {
    var key = TODAY.getFullYear() + "-" + String(TODAY.getMonth() + 1).padStart(2, "0") + "-" + String(TODAY.getDate()).padStart(2, "0");
    mHistory[key] = counts;
    var keys = Object.keys(mHistory).sort();
    while (keys.length > 60) delete mHistory[keys.shift()];
    monday.storage.instance.setItem(mStorageKey(), JSON.stringify(mHistory));
  } catch (e) { /* ignore */ }
}

function mRenderReviewTimeNote() {
  var old = document.getElementById("mReviewNote");
  if (old) old.remove();
  var list = mState.missingReview || [];
  if (!list.length) return;
  var legend = document.getElementById("timelineLegend");
  if (!legend) return;
  var pkgs = {};
  list.forEach(function (m) { pkgs[m.pkg] = true; });
  var el = document.createElement("details");
  el.id = "mReviewNote";
  el.className = "m-review-note";
  el.innerHTML =
    "<summary>" + list.length + " deliverable" + (list.length === 1 ? "" : "s") + " in " +
    Object.keys(pkgs).length + " package" + (Object.keys(pkgs).length === 1 ? "" : "s") +
    " have no review times on the board. Default times are used (Holden " + M_DEF_H +
    ", Holden revision " + M_DEF_HREV + ", Client " + M_DEF_C + " working days).</summary>" +
    "<ul>" + list.map(function (m) { return "<li>" + esc(m.pkg) + ": " + esc(m.ref) + "</li>"; }).join("") + "</ul>";
  legend.parentNode.insertBefore(el, legend.nextSibling);
}

// The upload flow is not used inside monday.
processFile = function () {};

// =====================================================================
// BOOTSTRAP
// =====================================================================
function mRenderProjectOptions() {
  var sel = document.getElementById("projectFilter");
  if (!sel) return;
  var list = mState.projects || [];
  sel.innerHTML =
    '<option value="">All projects</option>' +
    list.map(function (n) { return '<option value="' + attr(n) + '">' + esc(n) + "</option>"; }).join("");
  sel.value = mState.projectFilter;
  sel.style.display = list.length > 1 ? "" : "none";
}

async function mRender() {
  await mLoadHistory();
  var data = mBuildData();
  mRenderProjectOptions();
  renderReport(data, data.projName);
  mRenderReviewTimeNote();
  var titleEl = document.querySelector("#projInfo .proj-title");
  if (titleEl) titleEl.textContent = data.projName + " - Design Report";
  document.title = data.projName + " - Design Report";
  var details = document.querySelector("#projInfo .proj-details");
  if (details) {
    var dateText = TODAY.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
    var showAll = !mState.projectFilter && (mState.projects || []).length > 1;
    details.innerHTML =
      "<span>Project report | " + esc(dateText) + (showAll ? " | All projects" : "") + "</span>";
  }
}

var mLoading = false;
async function loadFromMonday() {
  if (mLoading) return;
  mLoading = true;
  try {
    TODAY = new Date();
    TODAY.setHours(0, 0, 0, 0);
    mResetProgress();
    mProgress(0.01);
    var ctx = await monday.get("context");
    var boardId = ctx && ctx.data && (ctx.data.boardId || (ctx.data.boardIds || [])[0]);
    if (!boardId) throw new Error("This view needs to be added to a board (no board id in context).");
    mState.raw = await mFetch(String(boardId));
    await mRender();
  } catch (err) {
    console.error(err);
    mShowError(err && err.message ? err.message : String(err), (err && err.stack) || String(err));
  } finally {
    mLoading = false;
  }
}

document.getElementById("refreshBtn").addEventListener("click", loadFromMonday);
document.getElementById("projectFilter").addEventListener("change", function (e) {
  mState.projectFilter = e.target.value;
  if (mState.raw) mRender();
});

var mLoadedOnce = false;
monday.listen("context", function () {
  if (mLoadedOnce) return;
  mLoadedOnce = true;
  loadFromMonday();
});
